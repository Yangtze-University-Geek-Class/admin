# 正式环境栈（production）：web(nginx) → server(Fastify) / forum(Nuxt 静态)。
#
# 用法（本地与目标机一致，事实来源是 env 文件，不在这份 compose 里写环境值）：
#   docker compose --env-file deploy/env/.env.production -f deploy/compose/production.yml config
#   docker compose --env-file deploy/env/.env.production -f deploy/compose/production.yml build
#   docker compose --env-file deploy/env/.env.production -f deploy/compose/production.yml up -d
#
# 目标机上的 env 文件固定叫 <STACK_ROOT>/.env.production（由 CI/CD 用环境级 secrets 渲染后推送），
# 本文件与 preview.yml 结构完全一致，只有项目名/卷名的兜底值不同。
#
# 隔离与暴露边界：
#   - 两套栈各有自己的 compose 项目名与命名卷，SQLite 与上传文件不可能互相看到；
#   - web 绑定 Arch tun0，server 只绑定回环；公网入口为香港 Caddy 经隧道反代，
#     容器端口不对 0.0.0.0 暴露；forum 不发布任何端口；
#   - 网络叫 internal 表示「只给本栈服务互连」。故意不开 docker 的 internal: true：
#     那个开关会切断容器出网，而 server 必须能访问 api.github.com 完成 OAuth 登录。

name: ${COMPOSE_PROJECT_NAME:-yzgc-production}

# 镜像仓库按环境分开：本栈只用 yzgc-production/<服务>:<IMAGE_TAG>，另一套栈用 yzgc-preview/…。
# 两套栈共用同一个 Docker 守护进程，同一提交的正式镜像与另一环境的镜像构建参数不同（release.json、版本串），
# 共用 yzgc/<服务>:<sha12> 会被后装载的一方覆盖。仓库名是字面量，不从 env 文件读取，IMAGE_TAG 仍是提交的 12 位 SHA。
services:
  server:
    image: yzgc-production/server:${IMAGE_TAG:?部署流程必须把发布 SHA 前 12 位写进 env 文件的 IMAGE_TAG}
    container_name: ${COMPOSE_PROJECT_NAME:-yzgc-production}-server
    restart: unless-stopped
    # 让 Node 进程正确收到 SIGTERM（index.ts 里注册了优雅关闭）。
    init: true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    mem_limit: 512m
    cpus: 1
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${SERVER_PORT:?}
      # 容器内监听全网卡，宿主侧只发布回环端口（SERVER_BIND）；
      # web 容器走 compose 网络访问 server:3000，因此不能只监听 127.0.0.1。
      HOST: ${HOST:?}
      # 反代来自 compose 网络而不是回环，必须显式信任 X-Forwarded-*。
      TRUST_PROXY: ${TRUST_PROXY:?}
      # 环境唯一的对外 origin：官网、管理端（/admin、/console）、论坛（/forum）同域，按路径区分。
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?}
      # 正式环境只设 host-only cookie：留空即不写 Domain。
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      POW_DIFFICULTY: ${POW_DIFFICULTY:-3}
      DB_PATH: ${DB_PATH:?}
      FORUM_DB_PATH: ${FORUM_DB_PATH:?}
      FORUM_UPLOAD_DIR: ${FORUM_UPLOAD_DIR:?}
      GEEK_DEPLOYMENT_ENVIRONMENT: ${GEEK_DEPLOYMENT_ENVIRONMENT:?}
      GEEK_ENVIRONMENT_ORIGIN: ${GEEK_ENVIRONMENT_ORIGIN:?}
      IMAGE_TAG: ${IMAGE_TAG:?}
      # 密钥：仓库里的 env 文件留空，目标机上由 CI/CD 注入；空值会在 server 启动时失败关闭。
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # 发信：发件地址、图片前缀、收件范围来自 env 文件的可见值；AccessKey、Resend 密钥与收件名单是可选密钥，
      # 阿里云与 Resend 的密钥都空时 server 照常启动，只把信记为「发信没有配置」，一封也不发。
      MAIL_ALIYUN_FROM: ${MAIL_ALIYUN_FROM:-}
      MAIL_RESEND_FROM: ${MAIL_RESEND_FROM:-}
      MAIL_ASSET_BASE: ${MAIL_ASSET_BASE:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_RECIPIENTS: ${MAIL_RECIPIENTS:-}
      MAIL_ALIYUN_ACCESS_KEY_ID: ${MAIL_ALIYUN_ACCESS_KEY_ID:-}
      MAIL_ALIYUN_ACCESS_KEY_SECRET: ${MAIL_ALIYUN_ACCESS_KEY_SECRET:-}
      MAIL_RESEND_API_KEY: ${MAIL_RESEND_API_KEY:-}
      MAIL_ALLOWLIST: ${MAIL_ALLOWLIST:-}
      # 访问防护（#333）：阈值、封禁时长与全站上限是 env 文件里的可见值；SHIELD_ALLOWLIST 是可选密钥，空 = 没有豁免。
      SHIELD_ENABLED: ${SHIELD_ENABLED:-}
      SHIELD_THRESHOLD: ${SHIELD_THRESHOLD:-}
      SHIELD_WINDOW_MINUTES: ${SHIELD_WINDOW_MINUTES:-}
      SHIELD_BLOCK_MINUTES: ${SHIELD_BLOCK_MINUTES:-}
      SHIELD_DECAY_HOURS: ${SHIELD_DECAY_HOURS:-}
      SITE_QUOTA_EMAIL_DAILY: ${SITE_QUOTA_EMAIL_DAILY:-}
      SITE_QUOTA_REGISTER_DAILY: ${SITE_QUOTA_REGISTER_DAILY:-}
      SITE_QUOTA_FEEDBACK_DAILY: ${SITE_QUOTA_FEEDBACK_DAILY:-}
      SITE_QUOTA_DEVICE_CODE_DAILY: ${SITE_QUOTA_DEVICE_CODE_DAILY:-}
      EMAIL_RECIPIENT_QUOTA_DAILY: ${EMAIL_RECIPIENT_QUOTA_DAILY:-}
      REGISTER_NO_COOKIE_IP_DAILY: ${REGISTER_NO_COOKIE_IP_DAILY:-}
      SHIELD_ALLOWLIST: ${SHIELD_ALLOWLIST:-}
      # Google 登录（#262）：可选的一对，都空时登录页不出现 Google；只填一项 server 启动失败。
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # 对外授权（#270）：签名私钥，空时 /oidc/* 一律 404；填了读不出来 server 启动失败。
      OIDC_JWKS: ${OIDC_JWKS:-}
      # GitLab 账号同步（#270）：开关、地址、组是 env 文件里的可见值；管理员令牌是密钥，GITLAB_SYNC=on 而令牌空时 server 启动失败。
      # 客户端与它钉住的 sector（#335）：库里的 sector 和这里对不上时同步整轮跳过（gitlab_sector_mismatch），不拿错 sector 的 sub 认人。
      GITLAB_SYNC: ${GITLAB_SYNC:-off}
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_GROUP: ${GITLAB_GROUP:-}
      GITLAB_EVENTS_INTERVAL_MINUTES: ${GITLAB_EVENTS_INTERVAL_MINUTES:-}
      GITLAB_OIDC_CLIENT: ${GITLAB_OIDC_CLIENT:?}
      GITLAB_OIDC_SECTOR: ${GITLAB_OIDC_SECTOR:?}
      GITLAB_API_TOKEN: ${GITLAB_API_TOKEN:-}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-}
      OBJECT_STORAGE_PUBLIC_BASE: ${OBJECT_STORAGE_PUBLIC_BASE:-}
      STATIC_CDN_ORIGIN: ${STATIC_CDN_ORIGIN:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
    ports:
      # 宿主回环，只给本机调试与部署脚本的健康检查用。
      - "${SERVER_BIND:?}:${SERVER_PORT:?}"
    volumes:
      # SQLite（data.db / forum.db）与论坛上传目录都落在 /data。
      - data:/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 健康检查在 app/server/Dockerfile 里定义（HEALTHCHECK 打 /healthz），此处不重复。

  web:
    image: yzgc-production/web:${IMAGE_TAG:?}
    container_name: ${COMPOSE_PROJECT_NAME:-yzgc-production}-web
    restart: unless-stopped
    # nginx 启动时要解析 server / forum 两个上游名，因此必须等它们先起容器。
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      server:
        condition: service_healthy
      forum:
        condition: service_started
    # 访问防护（#333）的开关与白名单也管 web 容器 nginx 的第一层限流：启动时由镜像里的 yzgc-shield-render 校验并渲染，写错容器起不来。
    # 与 server 读同一对键，两层对同一个来源的处理一致；SHIELD_ALLOWLIST 是可选密钥，空 = 没有豁免。
    environment:
      SHIELD_ENABLED: ${SHIELD_ENABLED:-}
      SHIELD_ALLOWLIST: ${SHIELD_ALLOWLIST:-}
    ports:
      # Arch tun0 → 容器 8080（容器内 nginx 以 nginx 用户运行，不监听特权端口）。
      - "${WEB_BIND:?}:8080"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/release.json || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  forum:
    image: yzgc-production/forum:${IMAGE_TAG:?}
    container_name: ${COMPOSE_PROJECT_NAME:-yzgc-production}-forum
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    # 只声明不发布：论坛端口只给本栈的 web 容器用。
    # FORUM_PORT 是镜像里的固定监听端口（见 app/forum/Dockerfile 的 listen/EXPOSE），
    # web 容器的反代目标也是 3000；要改这个值必须同时改镜像与 web 的 nginx 配置。
    expose:
      - "${FORUM_PORT:?}"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/200.html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 论坛当前是浏览器端演示/静态产物，没有服务端持久化数据，因此不发布端口、不挂卷。
    # 将来接入真实后端时，再按需要加命名卷与 FORUM_DB_PATH/FORUM_UPLOAD_DIR 挂载。

networks:
  internal:
    name: ${COMPOSE_PROJECT_NAME:-yzgc-production}-internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.181.0/24

volumes:
  data:
    name: ${COMPOSE_PROJECT_NAME:-yzgc-production}-data
