# 发布身份元数据的可 include 片段。
#
# 本文件是模板，直接 include 不会生效：alias 里的 /REPLACE_WITH_DEPLOY_ROOT 是故意写成不存在的占位。
# 必须先按环境替换成该环境真实的部署根目录，再 include；替换前 nginx -t 能过，但 /release.json 会 404。
# 之所以不给「可直接生效」的默认值：一份带预发布默认路径的片段被原样 include 进正式 server block，
# 会让正式站对外返回预发布的 environment/publicOrigin，而两个脚本又依赖这个端点判断自己打到了哪个环境。
#
# 预发布（https://prev.yangtzeu.work，DEPLOY_ROOT=/opt/yzgc-preview）：
#   location = /release.json {
#       alias /opt/yzgc-preview/current/release.json;
#       default_type application/json;
#       include /etc/nginx/snippets/geek-main-security-headers.conf;
#       add_header Cache-Control "no-store" always;
#   }
#
# 正式（https://yangtzeu.work，DEPLOY_ROOT=/opt/yzgc-admin）：
#   location = /release.json {
#       alias /opt/yzgc-admin/current/release.json;
#       default_type application/json;
#       include /etc/nginx/snippets/geek-main-security-headers.conf;
#       add_header Cache-Control "no-store" always;
#   }
#
# 两个环境各自 include 一份自己的副本，绝不让预发布和正式指向同一个部署根目录。
# 本文件不修改任何现有 nginx*.conf；启用前先 nginx -t 再重载。
#
# release.json 只包含构建身份（环境、版本、commit、产物摘要），不含密钥；
# deploymentAuthorized 恒为 false，它不是人工验收或部署批准的证明。
# deploy/remote/deploy-release.sh 与 rollback.sh 会读取本路径校验线上版本，所以必须禁用缓存。
location = /release.json {
    # TODO(维护者)：替换为本环境真实部署根目录下的 current/release.json，见上面两份完整示例。
    alias /REPLACE_WITH_DEPLOY_ROOT/current/release.json;
    default_type application/json;
    # 本 location 自带 add_header，会覆盖父级，因此必须重新 include 公共安全头。
    include /etc/nginx/snippets/geek-main-security-headers.conf;
    add_header Cache-Control "no-store" always;
}
