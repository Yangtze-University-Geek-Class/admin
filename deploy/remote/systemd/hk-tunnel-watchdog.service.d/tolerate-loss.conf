# 原来丢一个 ping 包就重启隧道，国际链路偶发丢包会反复重启（2026-10-25 一天 54 次）。
# 改成连发 3 个包，只要有一个回来就算通；3 个全丢才重启。tun0 上没有 10.66.0.2 仍然立即重启。
[Service]
ExecStart=
ExecStart=/bin/sh -c 'ip -4 addr show dev tun0 2>/dev/null | grep -q "10\.66\.0\.2" || exec systemctl restart hk-tunnel.service; ping -c3 -i1 -W3 10.66.0.1 >/dev/null 2>&1 || systemctl restart hk-tunnel.service'
