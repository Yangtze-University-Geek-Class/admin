# 预发布环境（preview）宿主 nginx server block。
#
# 安装：把本文件放到 /etc/nginx/sites-available/yzgc-preview.conf，
#       再 ln -s 到 /etc/nginx/sites-enabled/，然后 nginx -t && systemctl reload nginx。
#
# 预发布只有一个域名 prev.yangtzeu.work：官网、管理端（/admin、/console）、论坛（/forum）
# 都在它下面。这里只做 TLS 终止 + 转发到本机回环上的预发布 web 容器；应用路由
# （/api、/auth、/forum、按路径选 SPA 入口）都在 web 容器里完成，不注入任何站点头。
# 与 production 栈共用 nginx 进程，但上游端口、域名、证书互相独立：
# 上游端口来自 deploy/env/.env.preview 的 WEB_BIND：127.0.0.1:18200。
#
# 证书需要先签发（prev.yangtzeu.work 的 A 记录已指向本机）：
#   certbot certonly --webroot -w /var/www/html -d prev.yangtzeu.work
#
# 安全头只在这里加：容器不再重复下发，避免同一响应带两份 CSP。

# ── HTTP：只留 ACME 挑战，其余 301 到 HTTPS ────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name prev.yangtzeu.work;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 唯一入口：https://prev.yangtzeu.work ───────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prev.yangtzeu.work;

    ssl_certificate     /etc/letsencrypt/live/prev.yangtzeu.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prev.yangtzeu.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://github.com; object-src 'none'" always;

    # 与 web 容器内的上限保持一致（容器先看到请求体，值必须相同）。
    client_max_body_size 6m;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/wasm;

    location / {
        proxy_pass http://127.0.0.1:18200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
