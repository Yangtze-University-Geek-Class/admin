# 预发布环境（preview）宿主 nginx server block。
#
# 安装：把本文件放到 /etc/nginx/sites-available/yzgc-preview.conf，
#       再 ln -s 到 /etc/nginx/sites-enabled/，然后 nginx -t && systemctl reload nginx。
#
# 职责只有两件：TLS 终止 + 把这两个域名转发到本机回环上的预发布 web 容器。
# 与 production 栈完全共用 nginx 进程，但上游端口、域名、证书互相独立：
# 上游端口来自 deploy/env/.env.preview 的 WEB_BIND：127.0.0.1:18200。
#
# 应用路由（/api、/auth、/forum、按 host 选 SPA 入口）都在 web 容器里完成；
# 容器靠 X-YZGC-Site 区分官网与管理端，该头由这里注入并覆盖客户端同名头。
#
# 证书需要先签发（两个子域都得有记录，否则先在 DNSPod 加 A 记录）：
#   certbot certonly --webroot -w /var/www/html -d prev.yangtzeu.work -d prev-admin.yangtzeu.work
#
# 安全头只在这里加：容器不再重复下发，避免同一响应带两份 CSP。

# ── HTTP：只留 ACME 挑战，其余 301 到 HTTPS ────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name prev.yangtzeu.work prev-admin.yangtzeu.work;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 官网 + 论坛：https://prev.yangtzeu.work ────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prev.yangtzeu.work;

    ssl_certificate     /etc/letsencrypt/live/prev.yangtzeu.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prev.yangtzeu.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://github.com; object-src 'none'" always;

    # 与 web 容器内的上限保持一致（容器先看到请求体，值必须相同）。
    client_max_body_size 6m;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/wasm;

    location / {
        proxy_pass http://127.0.0.1:18200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 客户端自带的同名头在这一行被覆盖，容器只信这里注入的值。
        proxy_set_header X-YZGC-Site portal;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# ── 管理端：https://prev-admin.yangtzeu.work（预发布 OAuth 回调用域名）──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prev-admin.yangtzeu.work;

    ssl_certificate     /etc/letsencrypt/live/prev-admin.yangtzeu.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prev-admin.yangtzeu.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://github.com; object-src 'none'" always;

    client_max_body_size 6m;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/wasm;

    location / {
        proxy_pass http://127.0.0.1:18200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-YZGC-Site admin;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
