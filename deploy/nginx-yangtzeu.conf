## HTTP -> HTTPS for both
server {
    listen 80;
    listen [::]:80;
    server_name yangtzeu.work github.yangtzeu.work;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
