## Primary portal: yangtzeu.work
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yangtzeu.work;

    ssl_certificate     /etc/letsencrypt/live/yangtzeu.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yangtzeu.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
    gzip_min_length 512;

    location /forum/r/ {
        alias /root/geek-mbbs/resources/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* ^/assets/.*\.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
    }
}

