<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>geek_main · 项目地图</title>
<style>
:root{--bg:#2d323d;--panel:#353b48;--panel2:#3d4452;--line:#4a5262;--text:#eef0f5;--dim:#b4bccb;--faint:#8e98ab;--accent:#7db4ff;--top:#323845;--inp:#3d4452;--inpb:#566073;--btn:#3d4452;--btnb:#566073;--btnh:#4a5262;--btnon:#41557d;--btnonb:#6c8cc8;--pgh:#3d4452;--pgcur:#3a4c70;--cnt:#434b5b;--card:#3a4150;--carddash:#363c4a;--w:#2e3440;--wtxt:#dde1ea;--ptxt:#d5dae4;--sum:#bfc6d4;--path:#b3cdf5;--drillbg:#2f3b57;--dotb:#2d323d;--ghost:#353b48;--ghosth:#414958;--grid1:#3a404d;--grid2:#4a5262;--mm:#323845e6;--mmb:#566073;--lab:#2d323d;--labs:#5a6376;--labt:#e4e8f0;--leg:#323845;--legb:#566073;--lgt:#d5dae4;--shadow:rgba(10,14,24,.28);--kext:#4a5262;--cpbg:#2e3440;--cpc:#b3cdf5;--cph:#3b4a6b;--btn2:#33425f;--btn2b:#5b78b0;--btn2c:#d6e4ff;--btn2h:#3e5380;--sel:#fff;--gmix:#ffffff;--gmixt:.15;--bmixA:#d2d7e2;--bmixB:#5a6376;--inner:rgba(255,255,255,.05);--mmstroke:#9aa4b8;--mmview:#ffffff;--mmviewfill:rgba(255,255,255,.1);--edgemix:#ffffff;--edgemixt:0}
:root[data-theme=light]{--bg:#eef1f6;--panel:#ffffff;--panel2:#f4f6fa;--line:#d9dee8;--text:#232834;--dim:#5b6578;--faint:#7c8699;--accent:#2f6fd6;--top:#ffffff;--inp:#f4f6fa;--inpb:#c9d0dd;--btn:#ffffff;--btnb:#c9d0dd;--btnh:#eef1f6;--btnon:#dbe7fb;--btnonb:#7aa3e6;--pgh:#eef1f6;--pgcur:#e1ebfc;--cnt:#e8ecf3;--card:#ffffff;--carddash:#f6f8fc;--w:#eef1f6;--wtxt:#2e3544;--ptxt:#2e3544;--sum:#566073;--path:#2a5fb0;--drillbg:#e3edfc;--dotb:#ffffff;--ghost:#ffffff;--ghosth:#eef1f6;--grid1:#dde2eb;--grid2:#c5ccda;--mm:#ffffffe6;--mmb:#c9d0dd;--lab:#ffffff;--labs:#c1c8d6;--labt:#2e3544;--leg:#ffffff;--legb:#c9d0dd;--lgt:#2e3544;--shadow:rgba(40,55,90,.16);--kext:#6b7488;--cpbg:#eef1f6;--cpc:#2a5fb0;--cph:#dbe7fb;--btn2:#e3edfc;--btn2b:#9db9e8;--btn2c:#244f94;--btn2h:#d3e2fa;--sel:#2f6fd6;--gmix:#1f2633;--gmixt:.38;--bmixA:#3a4458;--bmixB:#d0d6e2;--inner:rgba(255,255,255,.6);--mmstroke:#6b7488;--mmview:#2f6fd6;--mmviewfill:rgba(47,111,214,.12);--edgemix:#1f2633;--edgemixt:.3}
:root{--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
--sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans)}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{display:grid;height:100vh;grid-template-rows:auto auto minmax(0,1fr) 26px;grid-template-columns:230px minmax(0,1fr) 0px}
#app.insp{grid-template-columns:230px minmax(0,1fr) 360px}
#topbar{grid-area:1/1/2/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 14px;background:var(--top);border-bottom:1px solid var(--line);min-height:50px}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;white-space:nowrap}
.brand svg{width:20px;height:20px}
.search{position:relative}
#q{width:200px;height:30px;background:var(--inp);border:1px solid var(--inpb);border-radius:6px;padding:0 64px 0 10px;outline:none}
#q:focus{border-color:var(--accent)}
#qinfo{position:absolute;right:9px;top:5px;font-size:12px;color:var(--dim);pointer-events:none}
#chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{height:24px;padding:0 7px;border-radius:12px;border:1px solid var(--c);background:transparent;color:var(--c);cursor:pointer;font-size:12px;white-space:nowrap}
.chip b{font-weight:600;margin-left:4px;opacity:.75}
.chip.on{background:var(--c);color:#fff}
.chip.on b{opacity:.9}
.chip.zero{opacity:.45}
.sp{flex:1}
.btn{height:30px;padding:0 10px;background:var(--btn);border:1px solid var(--btnb);border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--btnh)}
.btn.on{background:var(--btnon);border-color:var(--btnonb)}
#errbar{grid-area:2/1/3/-1;background:#8d2b2b;color:#fff;padding:7px 14px;display:flex;align-items:center;gap:12px;font-size:13px}
#errbar button{margin-left:auto;background:transparent;border:1px solid #ffffff66;border-radius:4px;color:#fff;cursor:pointer;padding:0 8px}
#side{grid-area:3/1/4/2;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:8px 0 16px}
.cl{padding:12px 16px 4px;font-size:11px;letter-spacing:.06em;color:var(--faint)}
.pg{display:flex;align-items:center;gap:8px;padding:6px 16px;cursor:pointer;color:var(--ptxt);border-left:3px solid transparent}
.pg:hover{background:var(--pgh)}
.pg.cur{background:var(--pgcur);border-left-color:var(--accent);color:var(--text)}
.pg .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg .cnt{font-size:11px;color:var(--dim);background:var(--cnt);border-radius:9px;padding:0 7px}
.pg .hit{font-size:11px;color:#1b1b1f;background:#ffd54a;border-radius:9px;padding:0 7px}
#stage{grid-area:3/2/4/3;position:relative;overflow:hidden;background-color:var(--bg);touch-action:none;cursor:grab;min-width:0;
background-image:radial-gradient(circle,var(--grid1) 1px,transparent 1.3px),radial-gradient(circle,var(--grid2) 1.6px,transparent 1.9px);background-size:24px 24px,120px 120px}
#stage.grab{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#glayer,#nlayer{position:absolute;left:0;top:0;width:0;height:0}
#elayer{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:15px;pointer-events:none}
/* groups */
.group{position:absolute;pointer-events:none}
.group svg{position:absolute;left:0;top:0;overflow:visible}
.glabel{position:absolute;left:14px;right:12px;top:7px;display:flex;align-items:baseline;gap:9px;white-space:nowrap;overflow:hidden;color:var(--gc)}
.glabel svg{position:static;width:15px;height:15px;flex:none;align-self:center;overflow:visible}
.glabel b{font-size:13px;font-weight:700;letter-spacing:.02em}
.glabel .gn{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;min-width:0}
/* edges */
.edge .ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-opacity:.78;transition:stroke-opacity .12s}
.edge.xp .ln{stroke-opacity:.2;stroke-width:1.4}
.edge.xp.on .ln{stroke-opacity:1;stroke-width:3}
.edge .hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.edge.on .ln{stroke-width:3;stroke-opacity:1}
.elab{display:none;pointer-events:none}
.labels .elab,.edge.on .elab{display:inline}
.elab rect{fill:var(--lab);fill-opacity:.92;stroke:var(--labs);stroke-width:1}
.elab text{fill:var(--labt);font-size:11px;font-family:var(--sans);text-anchor:middle;dominant-baseline:central}
.hl .edge:not(.on){opacity:.07}
.flt .edge:not(.fm){opacity:.1}
/* nodes */
.node{position:absolute;color:var(--text);user-select:none;-webkit-user-select:none;cursor:default;transition:opacity .15s}
.card{position:absolute;inset:0;border:1.5px solid var(--bc);border-radius:10px;background:var(--card);overflow:hidden;box-shadow:0 6px 20px var(--shadow)}
.node.dash .card{border-style:dashed;background:var(--carddash)}
.node.sel .card{box-shadow:0 0 0 2px var(--sel),0 8px 22px var(--shadow)}
.node.sm .card{box-shadow:0 0 0 2.5px #ffd54a,0 6px 18px rgba(0,0,0,.5)}
.node.cur .card{box-shadow:0 0 0 2.5px #ffd54a,0 0 0 5px #ffd54a44}
.hd{display:flex;align-items:center;gap:7px;padding:0 10px;background:var(--kc);color:#fff;overflow:hidden}
.k-external .hd{background:var(--kext)}
.ic{width:14px;height:14px;flex:none;opacity:.92}
.t{flex:1;min-width:0;font-weight:600;font-size:13px;line-height:16px;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.bd{flex:none;font-size:10.5px;line-height:15px;padding:0 6px;border-radius:8px;background:var(--sc);color:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);white-space:nowrap}
.ports{padding:5px 0}
.prow{display:flex;gap:10px;padding:0 15px;height:22px;align-items:center;font-size:11.5px;color:var(--ptxt)}
.pl,.pr{min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{margin-left:auto}
.metas{padding:2px 8px}
.mrow{display:flex;justify-content:space-between;gap:10px;height:20px;margin-bottom:2px;padding:0 8px;background:var(--w);border-radius:5px;font-size:11px;line-height:20px;overflow:hidden}
.mrow:last-child{margin-bottom:0}
.mk{flex:none;color:var(--dim)}
.mv{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:10.5px;color:var(--wtxt)}
.prw{padding:3px 8px;height:26px}
.pth{display:block;height:20px;line-height:20px;padding:0 8px;background:var(--w);border-radius:5px;font:10.5px/20px var(--mono);color:var(--path);white-space:nowrap;overflow:hidden}
.pth.drill{font-family:var(--sans);font-size:11px;color:var(--accent);background:var(--drillbg)}
.sum{height:38px;padding:4px 10px;font-size:11.5px;line-height:15px;color:var(--sum);overflow:hidden}
.sx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:30px}
.dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--pc);border:2px solid var(--dotb);box-shadow:0 0 0 1px var(--pc)}
.ghost{position:absolute;border:1.5px dashed var(--pc);border-radius:15px;background:var(--ghost);padding:3px 16px;cursor:pointer;transition:opacity .15s}
.ghost:hover{background:var(--ghosth)}
.ghost .gt{font-size:12px;font-weight:600;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost .gp{font-size:10.5px;font-weight:400;color:var(--dim)}
.ghost .dot{top:50%}
.hl .node:not(.on),.hl .ghost:not(.on){opacity:.26}
.flt .node:not(.fm),.flt .ghost:not(.fm){opacity:.22}
.srch .node:not(.sm),.srch .ghost:not(.sm){opacity:.3}
/* lod */
.z5 .secondary,.z5 .elab{visibility:hidden}
.z3 .card>:not(.hd){visibility:hidden}
.z3 .hd{height:100%!important;justify-content:center;text-align:center}
.z3 .hd .ic,.z3 .hd .bd{display:none}
.z3 .hd .t{flex:none;max-width:100%;font-size:var(--fs,var(--lowfs));line-height:1.18;-webkit-line-clamp:4!important}
.z3 .ghost .gp{display:none}
.z3 .ghost .gt{font-size:var(--lowfs)}
.z3 .glabel b{font-size:var(--lowgf)}
.z3 .edge .ln{stroke-opacity:.42;stroke-width:3}
.z3 .edge.on .ln{stroke-opacity:1;stroke-width:5}
.z3 .edge.xp .ln{stroke-opacity:.14}
.z3 .glabel{top:4px}
.z3 .glabel .gn{display:none}
/* corner */
.corner{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:5}
#mm{width:200px;height:132px;background:var(--mm);border:1px solid var(--mmb);border-radius:8px;cursor:pointer}
.zoom{display:flex;align-items:center;gap:4px;background:var(--mm);border:1px solid var(--mmb);border-radius:8px;padding:3px}
.zoom button{height:26px;min-width:28px;padding:0 8px;background:transparent;border:0;border-radius:5px;cursor:pointer}
.zoom button:hover{background:var(--btnh)}
.zoom span{min-width:44px;text-align:center;font-size:12px;color:var(--dim)}
/* legend */
#legend{position:absolute;left:14px;bottom:14px;z-index:6;width:640px;max-width:calc(100% - 28px);max-height:calc(100% - 28px);overflow:auto;background:var(--leg);border:1px solid var(--legb);border-radius:10px;padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:4px 28px;cursor:default}
#legend h4{grid-column:span 2;margin:8px 0 2px;font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.06em}
#legend h4:first-child{margin-top:0}
.lg{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--lgt);min-height:22px}
.sw{width:22px;height:12px;border-radius:6px;flex:none}
.sw.round{width:12px;border-radius:50%}
.sw.kind{height:14px;border-radius:3px}
.sw.badge{width:auto;height:auto;padding:0 6px;font-size:10.5px;line-height:15px;color:#fff;border-radius:8px}
.sw.dashbox{width:24px;height:14px;border-radius:3px;border:1.5px dashed var(--faint);background:var(--carddash)}
.sw.grp{width:30px;height:16px;border-radius:4px;background:transparent}
/* inspector */
#insp{grid-area:3/3/4/4;overflow:hidden;background:var(--panel);border-left:1px solid var(--line)}
#ii{width:360px;height:100%;overflow-y:auto;padding:14px 16px 24px;user-select:text;-webkit-user-select:text}
.ih{display:flex;align-items:flex-start;gap:8px}
.itl{flex:1;font-size:16px;font-weight:700;line-height:1.35}
.ix{flex:none;width:26px;height:26px;border:0;background:transparent;font-size:20px;line-height:1;color:var(--dim);cursor:pointer;border-radius:5px}
.ix:hover{background:var(--btnh);color:var(--text)}
.ibd{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.ibd span{font-size:11.5px;line-height:18px;padding:0 8px;border-radius:9px;color:#fff}
.ir{display:flex;gap:10px;margin:7px 0;align-items:baseline}
.ir .k{flex:none;width:44px;color:var(--faint);font-size:12px}
.ir .v{min-width:0;word-break:break-all}
code,.mono{font-family:var(--mono);font-size:11.5px}
.cp{cursor:pointer;color:var(--cpc);background:var(--cpbg);border-radius:4px;padding:1px 6px}
.cp:hover{background:var(--cph)}
.lk{color:var(--accent);cursor:pointer}
.lk:hover{text-decoration:underline}
.ih2{margin:16px 0 6px;font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.06em}
.ip{margin:6px 0;line-height:1.6;color:var(--ptxt);white-space:pre-wrap;overflow-wrap:anywhere}
.itb{width:100%;border-collapse:collapse}
.itb td{padding:3px 0;vertical-align:top;border-bottom:1px solid var(--line);font-size:12px}
.itb td:first-child{width:64px;color:var(--dim)}
.itb td:last-child{font-family:var(--mono);font-size:11.5px;word-break:break-all}
.prt{margin:8px 0}
.prt .ph{display:flex;align-items:center;gap:7px;font-size:12.5px}
.prt .pd{width:10px;height:10px;border-radius:50%;flex:none}
.prt .pty{margin-left:auto;font-size:11px;color:var(--faint)}
.prt .pc{margin:3px 0 0 17px;font-size:12px;color:var(--dim)}
.prt .pc div{padding:1px 0}
.ev div{font-family:var(--mono);font-size:11.5px;margin:3px 0;color:var(--path);cursor:pointer;word-break:break-all}
.ev div:hover{text-decoration:underline}
.btn2{display:inline-block;margin:8px 8px 0 0;padding:4px 12px;border:1px solid var(--btn2b);border-radius:6px;background:var(--btn2);color:var(--btn2c);cursor:pointer;font-size:12.5px}
.btn2:hover{background:var(--btn2h)}
#foot{grid-area:4/1/5/-1;display:flex;align-items:center;gap:18px;padding:0 14px;background:var(--top);border-top:1px solid var(--line);font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden}
#foot .r{margin-left:auto}
#toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:#000c;color:#fff;border-radius:6px;padding:5px 14px;font-size:12px;z-index:50;pointer-events:none}
#bNav{display:none}
.pg:focus-visible,.node:focus-visible,.lk:focus-visible,.btn2:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:760px){
 #app,#app.insp{grid-template-columns:0 minmax(0,1fr) 0;grid-template-rows:auto auto minmax(0,1fr) 30px}
 #topbar{padding:8px;gap:6px}.brand{font-size:13px}#bNav{display:inline-block}#q{width:min(220px,65vw);height:40px}
 #chips{order:4;width:100%}.chip{min-height:30px}.btn{height:40px;padding:0 8px}#side{display:none}
 #app.nav-open #side{display:block;grid-area:3/1/4/-1;width:min(280px,85vw);z-index:30;box-shadow:12px 0 30px var(--shadow)}
 .pg{min-height:44px}#stage{grid-area:3/1/4/-1}#insp{display:none}#app.insp #insp{display:block;grid-area:3/1/4/-1;z-index:20}#ii{width:100%;padding:16px}
 .ix{height:44px;width:44px}.btn2{min-height:40px}.corner{right:8px;bottom:8px}#mm{width:130px;height:86px}#legend{grid-template-columns:1fr}#legend h4{grid-column:1}
 #foot{padding:0 8px;font-size:10px;gap:8px}#fMeta{max-width:55%;overflow:hidden;text-overflow:ellipsis}.zoom button{min-height:36px;min-width:36px}
}
.impact-filter .node:not(.impact-hit){opacity:.18}.impact-filter .node.impact-hit .card{box-shadow:0 0 0 3px var(--accent)}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><svg viewBox="0 0 20 20" fill="none" stroke="#6ea8ff" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="3" width="6" height="5" rx="1.2"/><rect x="12" y="12" width="6" height="5" rx="1.2"/><path d="M8 5.5h2.5c1.5 0 1.5 9 3 9"/></svg><span id="ttl">项目节点图</span></div>
    <button class="btn" id="bNav" aria-expanded="false" aria-controls="side">目录</button><div class="search"><input aria-label="搜索项目节点" id="q" type="search" placeholder="搜索节点（/）" autocomplete="off"><span id="qinfo"></span></div>
    <div id="chips"></div>
    <div class="sp"></div>
    <button class="btn" id="bImpact">PR 影响</button><button class="btn" id="bImpactClear" hidden>清除影响</button><input id="impactFile" type="file" accept="application/json,.json" hidden><button class="btn" id="bFit">适应画布</button>
    <button class="btn" id="bReset">重置布局</button>
    <button class="btn" id="bLeg">图例</button>
    <button class="btn" id="bLab">连线标签</button>
    <button class="btn" id="bTheme">浅色</button>
  </header>
  <div id="errbar" role="alert" hidden><span id="errmsg"></span><button id="errx">关闭</button></div>
  <aside id="side" aria-label="项目地图目录"></aside>
  <main id="stage">
    <div id="world">
      <div id="glayer"></div>
      <svg id="elayer" width="1" height="1"></svg>
      <div id="nlayer"></div>
    </div>
    <div id="empty" hidden>本页暂无节点</div>
    <div id="legend" hidden></div>
    <div class="corner">
      <canvas id="mm" width="200" height="132"></canvas>
      <div class="zoom"><button id="zOut" title="缩小 (-)">−</button><span id="zPct">100%</span><button id="zIn" title="放大 (+)">+</button><button id="zFit" title="适应画布 (0)">适应</button></div>
    </div>
  </main>
  <aside id="insp"><div id="ii"></div></aside>
  <footer id="foot"><span id="fMeta"></span><span class="r" id="fStat"></span></footer>
</div>
<div id="toast" hidden></div>
<script id="graph-data" type="application/json">__GRAPH_JSON__</script>

$('#chips').addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;var s=c.dataset.st;if(filt.has(s))filt.delete(s);else filt.add(s);renderChips();applyDecor();});
$('#ii').addEventListener('click',function(e){
 var t=e.target.closest('[data-act],[data-copy],[data-goto],[data-page]');if(!t)return;
 if(t.dataset.act==='close')clearSelection();
 else if(t.dataset.copy)copyText(t.dataset.copy);
 else if(t.dataset.goto)gotoNode(t.dataset.goto);
 else if(t.dataset.page)showPage(t.dataset.page,t.dataset.first||null,{});
});
var impactIds=new Set();
function paintImpact(){world.classList.toggle('impact-filter',impactIds.size>0);document.querySelectorAll('.node').forEach(function(el){el.classList.toggle('impact-hit',impactIds.has(el.dataset.id));});}
$('#bImpact').onclick=function(){$('#impactFile').click();};
$('#bImpactClear').onclick=function(){impactIds.clear();paintImpact();this.hidden=true;$('#bImpact').textContent='PR 影响';$('#impactFile').value='';};
$('#impactFile').onchange=async function(){
 impactIds.clear();paintImpact();$('#bImpactClear').hidden=true;$('#bImpact').textContent='PR 影响';
 var f=this.files&&this.files[0];if(!f)return;
 try{
  if(f.size>5*1024*1024)throw new Error('影响报告超过 5MB');
  var report=JSON.parse(await f.text());
  if(report.catalogFingerprint!==G.meta.fingerprint)throw new Error('影响报告与当前地图的源码摘要不一致，请重新生成');
  if(!Number.isInteger(report.issue)||report.issue<1||typeof report.ok!=='boolean')throw new Error('影响报告字段无效');
  if(!Array.isArray(report.affectedNodeIds)||report.affectedNodeIds.some(function(id){return typeof id!=='string'||!NODE.has(id);}))throw new Error('影响报告引用了未知节点');
  impactIds=new Set(report.affectedNodeIds);$('#bImpactClear').hidden=false;
  $('#bImpact').textContent='PR #'+String(report.issue)+' · '+(report.ok?'报告通过':'待修正');
  $('#errbar').hidden=true;paintImpact();if(report.affectedNodeIds.length)gotoNode(report.affectedNodeIds[0]);paintImpact();
 }catch(error){showError(error.message||String(error));}
};
new MutationObserver(paintImpact).observe($('#nlayer'),{childList:true});
$('#bFit').onclick=$('#zFit').onclick=function(){fit(true);};
$('#zIn').onclick=function(){zoomCenter(1.25);};
$('#zOut').onclick=function(){zoomCenter(1/1.25);};
$('#bReset').onclick=function(){
 if(!curPid)return;cache.delete(curPid);var keep=selId,pid=curPid;curPid=null;
 renderPage(pid);selId=keep;applyDecor();toast('已重置布局');
};
$('#bLeg').onclick=function(){var l=$('#legend');l.hidden=!l.hidden;this.classList.toggle('on',!l.hidden);};
$('#bTheme').onclick=function(){setTheme(TH.name==='light'?'dark':'light',true);};
$('#bLab').onclick=function(){
 showLabels=!showLabels;this.classList.toggle('on',showLabels);world.classList.toggle('labels',showLabels);
 if(showLabels&&P)P.edges.forEach(placeLabel);
};
var qEl=$('#q');
qEl.addEventListener('input',function(){query=qEl.value.trim().toLowerCase();computeMatches();applyDecor();});
qEl.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&matches.length){
  matchIdx=(matchIdx+(e.shiftKey?-1:1)+matches.length)%matches.length;
  var n=matches[matchIdx];$('#qinfo').textContent=(matchIdx+1)+'/'+matches.length;
  gotoNode(n.id);e.preventDefault();
 }else if(e.key==='Escape'){qEl.value='';query='';computeMatches();applyDecor();qEl.blur();e.stopPropagation();}
});
document.addEventListener('keydown',function(e){
 if(e.target===qEl||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='+'||e.key==='=')zoomCenter(1.25);
 else if(e.key==='-'||e.key==='_')zoomCenter(1/1.25);
 else if(e.key==='0')fit(true);
 else if(e.key==='Escape'){$('#app').classList.remove('nav-open');$('#bNav').setAttribute('aria-expanded','false');hoverId=null;hoverEdge=null;clearSelection();}
 else if(e.key==='/'){qEl.focus();e.preventDefault();}
});
document.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var el=e.target.closest&&e.target.closest('.pg,.lk,.btn2,.node,.ghost,.cp,[data-copy]');if(!el)return;e.preventDefault();if(el.classList.contains('node'))selectNode(el.dataset.id,true,false);else if(el.classList.contains('ghost'))gotoNode(el.dataset.target);else el.click();});
window.addEventListener('hashchange',function(){applyHash(false);});
window.addEventListener('resize',resizeLater);
if(window.ResizeObserver)new ResizeObserver(resizeLater).observe(stage);

/* ---------- 图例 ---------- */
function renderLegend(){
 var h='<h4>端口 / 连线类型</h4>';
 Object.keys(PT).forEach(function(k){h+='<div class="lg"><span class="sw round" style="background:'+PT[k][0]+'"></span>'+esc(PT[k][1])+'</div>';});
 h+='<h4>节点类型（标题栏颜色）</h4>';
 Object.keys(KIND).forEach(function(k){h+='<div class="lg"><span class="sw kind" style="background:'+KIND[k][0]+'"></span>'+esc(KIND[k][1])+'</div>';});
 h+='<h4>状态徽章</h4>';
 Object.keys(STATUS).forEach(function(k){h+='<div class="lg"><span class="sw badge" style="background:'+STATUS[k][0]+'">'+esc(STATUS[k][1])+'</span>'+esc(STATUS_DESC[k])+'</div>';});
 h+='<h4>分组虚线框</h4>';
 Object.keys(GST).forEach(function(k){var s=GST[k];h+='<div class="lg"><span class="sw grp" style="border:'+s.w+'px dashed '+s.c+';background:'+rgba(s.c,s.a+.04)+'"></span>'+esc(s.name)+'：'+esc(s.desc)+'</div>';});
 h+='<h4>其他</h4><div class="lg"><span class="sw dashbox"></span>虚线节点：显式声明或退役入口</div><div class="lg"><span class="sw" style="border:1.5px dashed #aaa;border-radius:12px;background:var(--ghost)"></span>虚线胶囊：跨页节点，点击跳转</div>';
 $('#legend').innerHTML=h;
}

/* ---------- 启动 ---------- */
function boot(){
 var m=G.meta||{};
 $('#ttl').textContent=m.title||'项目节点图';document.title=m.title||'项目节点图';
 $('#fMeta').textContent=(m.fingerprint?'源码摘要 '+m.fingerprint.slice(0,12):'')+'  ·  未核验部署状态'+(m.repo?'  ·  '+m.repo:'');
 renderLegend();renderChips();renderSide();
 var h=parseHash(),pid=PAGE.has(h.page)?h.page:firstPage();
 if(pid){
  showPage(pid,h.node,{fromHash:true,instant:true});
  if(!location.hash)setHash(pid,null,false);
 }else{$('#empty').hidden=false;window.__ready=true;}
 window.__catalogMap={go:function(p,n){showPage(p,n||null,{});},fit:function(){fit(false);},zoom:function(k,x,y){autoFit=false;view.k=k;if(x!=null){view.x=x;view.y=y;}applyView();},state:function(){return {page:curPid,sel:selId,view:view};},layout:function(){return P;},search:function(q){qEl.value=q;qEl.dispatchEvent(new Event('input'));},filter:function(s){filt=new Set(s);renderChips();applyDecor();},labels:function(v){showLabels=!!v;world.classList.toggle('labels',showLabels);if(showLabels&&P)P.edges.forEach(placeLabel);},legend:function(v){$('#legend').hidden=!v;}};
}
try{boot();}catch(e){showError('渲染出错：'+e.message);console.error(e);window.__ready=true;}
})();
</script>
</body>
</html>
