# geek_main 正式发布流水线（production / https://yangtzeu.work）
#
# 边界声明（与 docs/conventions/RELEASES.md、docs/ops/CICD.md 一致）：
#   * 本工作流只把「已在预发布试用过、且由人在打 tag 之前批准过」的准确提交搬上正式环境。
#   * 它自身不产生任何批准：不创建/移动/删除 tag，不修改版本号，不写 approved 之类的放行状态。
#   * 顶层权限仅 contents: read；需要更多权限的 job 单独最小化声明。
#   * 不使用 pull_request_target；不使用 continue-on-error 掩盖失败。
#   * tag 名一律交给 scripts/release-policy.mjs 严格解析——on.push.tags 的 glob 只是触发过滤，不是版本语法校验。
#   * 任何 shell 步骤都不把 ${{ github.* }} / ${{ needs.* }} 直接内插进命令，
#     一律先赋给 env: 再用 "$VAR"，避免表达式内容进入 shell 语法层。
#
# 证据链（evidence job，任一项缺失即失败关闭）：
#   1. 同一提交在 preview 环境有成功的部署记录；
#   2. https://prev.yangtzeu.work/release.json 当前就是该提交（"上一个预发布通过" 不能推广到别的代码）；
#   3. production 环境配置了 required_reviewers 人工门禁。
# 另外在 build 之后比对核心产物摘要：server/web 必须与预发布验收产物逐字节等价。

name: Production release

on:
  push:
    # glob 只负责触发；release-1.2.3-rc1 这种也会进来，随后由 release-policy 拒绝。
    tags: ['release-*']

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # plan：解析发布身份。不安装依赖、不构建、不部署。
  # ---------------------------------------------------------------------------
  plan:
    name: plan (release-policy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      environment: ${{ steps.plan.outputs.environment }}
      githubEnvironment: ${{ steps.plan.outputs.githubEnvironment }}
      tag: ${{ steps.plan.outputs.tag }}
      baseVersion: ${{ steps.plan.outputs.baseVersion }}
      displayVersion: ${{ steps.plan.outputs.displayVersion }}
      commit: ${{ steps.plan.outputs.commit }}
      shortCommit: ${{ steps.plan.outputs.shortCommit }}
      publicOrigin: ${{ steps.plan.outputs.publicOrigin }}
      releaseId: ${{ steps.plan.outputs.releaseId }}
    steps:
      - name: 断言触发形状
        id: trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
        run: |
          set -u
          # 正式发布只有一个入口：推送 refs/tags/release-*。
          # 必须区分 refs/heads/release-... 与 refs/tags/release-...（CICD.md 明确要求）。
          if [ "$EVENT_NAME" != "push" ]; then
            echo "拒绝：不支持的事件 ${EVENT_NAME}。" >&2
            exit 1
          fi
          if [ "$REF_TYPE" != "tag" ]; then
            echo "拒绝：正式发布必须由 tag 触发，实际 ref_type=${REF_TYPE}。" >&2
            exit 1
          fi
          case "$REF" in
            refs/tags/release-*) ;;
            *) echo "拒绝：正式发布只接受 refs/tags/release-*，实际 ${REF}。" >&2; exit 1 ;;
          esac
          tag="${REF#refs/tags/}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "触发：正式发布 tag ${tag}（版本语法仍由 release-policy 判定）。"

      - name: 检出代码（完整历史与 tag）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-policy 要做 main 祖先检查并枚举 refs/tags，必须有完整历史与全部 tag。
          fetch-depth: 0
          fetch-tags: true
          # fetch-depth: 0 + fetch-tags: true 已经把完整历史、全部分支的远程跟踪 ref 与全部 tag 取下来，
          # 本 job 运行期不再做任何 Git 网络操作，因此不把 GITHUB_TOKEN 写进 .git/config。
          persist-credentials: false

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: 确认 refs/remotes/origin/main 存在
        shell: bash
        run: |
          set -u
          # 绝不 checkout 到 main：只需要一个可用于祖先判定的远程跟踪 ref。
          # 上一步的 fetch-depth: 0 已经取回该 ref，这里不再运行期补 fetch——
          # 补 fetch 需要凭据，而为此保留凭据会把 GITHUB_TOKEN 留在 .git/config 里。
          # 缺这个 ref 说明 checkout 配置被改动或远程没有 main，直接失败关闭，不静默降级。
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "缺少 refs/remotes/origin/main：release-policy 无法做 main 祖先判定。" >&2
            echo "请确认 checkout 步骤仍为 fetch-depth: 0，且远程存在 main 分支。" >&2
            exit 1
          fi
          echo "refs/remotes/origin/main：$(git rev-parse refs/remotes/origin/main)"

      - name: 运行 release-policy 并解析为 job outputs
        id: plan
        shell: bash
        env:
          TAG_INPUT: ${{ steps.trigger.outputs.tag }}
          EXPECTED_ENVIRONMENT: production
          EXPECTED_GITHUB_ENVIRONMENT: production
          # 交叉核对目标域名：release tag 配 prev 域名会被 deploymentTarget 拒绝。
          TARGET_ORIGIN: https://yangtzeu.work
        run: |
          set -u
          policy="${RUNNER_TEMP}/release-policy.json"
          node scripts/release-policy.mjs tag \
            --tag "$TAG_INPUT" \
            --main-ref refs/remotes/origin/main \
            --target-origin "$TARGET_ORIGIN" > "$policy"

          cat >"${RUNNER_TEMP}/emit-plan.mjs" <<'NODE'
          // 把 release-policy 的 JSON 逐字段校验后写成 job outputs。
          // 校验不是重复劳动：outputs 会流向后续 shell 与 SSH 命令，形状必须先钉死。
          import { appendFileSync, readFileSync } from 'node:fs';

          const fail = (message) => { console.error(`发布计划校验失败：${message}`); process.exit(1); };
          const policyFile = process.env.POLICY_FILE;
          const outputFile = process.env.GITHUB_OUTPUT;
          if (!policyFile || !outputFile) fail('缺少 POLICY_FILE 或 GITHUB_OUTPUT。');

          const policy = JSON.parse(readFileSync(policyFile, 'utf8'));
          const contract = JSON.parse(readFileSync('deploy/environments.json', 'utf8'));

          const SHA = /^[a-f0-9]{40}$/;
          const VERSION = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          const TAG = /^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          const ORIGIN = /^https:\/\/[a-z0-9.-]{3,120}$/;
          const ENV_NAME = /^[a-z][a-z0-9-]{0,30}$/;

          // release-policy 永远不授权部署；这个字段变成 true 说明校验器被改过。
          if (policy.deploymentAuthorized !== false) fail('deploymentAuthorized 必须恒为 false。');
          if (policy.mode !== 'tag') fail('正式发布只接受 tag 模式。');
          if (policy.environment !== process.env.EXPECTED_ENVIRONMENT) {
            fail(`环境不符：期望 ${process.env.EXPECTED_ENVIRONMENT}，实际 ${policy.environment}。`);
          }
          if (!SHA.test(policy.commit ?? '')) fail('commit 不是 40 位小写 SHA。');
          if (policy.shortCommit !== policy.commit.slice(0, 12)) fail('shortCommit 与 commit 不一致。');
          if (!VERSION.test(policy.baseVersion ?? '')) fail('baseVersion 不是 X.Y.Z。');
          // 正式版本绝对不能带 @：这里不是重复校验，而是最后一道不依赖 release-policy 的判定。
          if (policy.displayVersion !== policy.baseVersion) fail('正式版本禁止 @ 后缀或任何与基础版本不同的展示版本。');
          if (!TAG.test(policy.tag ?? '')) fail('tag 必须形如 release-X.Y.Z。');
          if (policy.baselineCommit !== undefined) fail('正式发布不应出现预发布基准提交。');
          if (!ORIGIN.test(policy.publicOrigin ?? '')) fail('publicOrigin 必须是 https 域名。');

          const contractEnv = contract.environments?.[policy.environment];
          if (!contractEnv) fail('deploy/environments.json 缺少该环境。');
          if (contractEnv.origin !== policy.publicOrigin) fail('publicOrigin 与环境合同不一致。');
          if (contractEnv.allowCommitSuffix !== false) fail('环境合同允许正式环境带 commit 后缀，与 RELEASES.md 冲突。');
          const githubEnvironment = contractEnv.githubEnvironment;
          if (!ENV_NAME.test(githubEnvironment ?? '')) fail('githubEnvironment 形状非法。');
          // 工作流里的 environment.name 是字面量，这里确认合同没有被改到别的名字上。
          if (githubEnvironment !== process.env.EXPECTED_GITHUB_ENVIRONMENT) {
            fail(`环境合同的 githubEnvironment=${githubEnvironment}，与工作流写死的 ${process.env.EXPECTED_GITHUB_ENVIRONMENT} 不符。`);
          }

          const values = {
            mode: policy.mode,
            environment: policy.environment,
            githubEnvironment,
            tag: policy.tag,
            baseVersion: policy.baseVersion,
            displayVersion: policy.displayVersion,
            commit: policy.commit,
            shortCommit: policy.shortCommit,
            publicOrigin: policy.publicOrigin,
            releaseId: `${policy.baseVersion}-${policy.shortCommit}`,
          };
          for (const [key, value] of Object.entries(values)) {
            if (typeof value !== 'string' || /[\r\n]/.test(value)) fail(`输出 ${key} 类型非法或含换行。`);
            appendFileSync(outputFile, `${key}=${value}\n`);
          }
          console.log(`发布计划：环境 ${values.environment} · 版本 ${values.displayVersion} · commit ${values.commit} · releaseId ${values.releaseId}`);
          console.log('release-policy 只做离线命名与 main 来源检查，不代表人工试用、审批或部署授权。');
          NODE

          POLICY_FILE="$policy" node "${RUNNER_TEMP}/emit-plan.mjs"

          {
            echo '### release-policy 输出（完整 JSON）'
            echo
            echo '```json'
            cat "$policy"
            echo '```'
            echo
            echo "> 以上为离线规划结果，\`deploymentAuthorized\` 恒为 false，不代表人工试用或部署批准。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # evidence：正式发布的三项前置证据。任一项缺失即失败关闭，不进入构建。
  # ---------------------------------------------------------------------------
  evidence:
    name: evidence (预发布验收证据)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # 读取 preview 的历史部署记录。只读，不创建。
      deployments: read
    outputs:
      previewServerSha256: ${{ steps.preview-release.outputs.previewServerSha256 }}
      previewWebSha256: ${{ steps.preview-release.outputs.previewWebSha256 }}
      previewForumSha256: ${{ steps.preview-release.outputs.previewForumSha256 }}
      previewManifestSha256: ${{ steps.preview-release.outputs.previewManifestSha256 }}
      previewOrigin: ${{ steps.preview-release.outputs.previewOrigin }}
    steps:
      - name: 检出发布提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: 证据 1／同一提交必须有成功的 preview 部署记录
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -u
          # RELEASES.md：正式推广建议使用已在预发布试用的同一提交和同一产物。
          # 这里的可信记录 = 本仓库 preview 环境上、该提交的成功部署记录。
          accepted=0
          ids="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=preview&sha=${COMMIT}&per_page=100" --jq '.[].id')"
          for id in $ids; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq '.[0].state // ""')"
            echo "preview 部署记录 ${id}：最新状态 ${state:-<无>}"
            if [ "$state" = "success" ]; then accepted=1; break; fi
          done
          if [ "$accepted" != "1" ]; then
            echo "该提交没有成功的 preview 部署记录，禁止正式发布。" >&2
            echo "提交=${COMMIT}。请先在预发布环境部署并试用同一提交（见 RELEASES.md）。" >&2
            exit 1
          fi
          {
            echo '### 证据 1：preview 部署记录'
            echo
            echo "- 提交：\`${COMMIT}\`"
            echo '- 结论：该提交在 preview 环境有成功的部署记录。'
            echo '- 注意：部署记录只证明产物上过预发布环境，不证明有人试用并批准过它。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 证据 2／预发布线上当前就是该提交
        id: preview-release
        shell: bash
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -u
          # 预发布 origin 只能来自环境合同，绝不接受触发者输入或 tag 字符串推导。
          preview_origin="$(node -e 'const fs=require("node:fs");const c=JSON.parse(fs.readFileSync("deploy/environments.json","utf8"));process.stdout.write(c.environments.preview.origin);')"
          case "$preview_origin" in
            https://*) ;;
            *) echo "环境合同中的 preview origin 非法：${preview_origin}" >&2; exit 1 ;;
          esac
          echo "预发布入口：${preview_origin}"

          curl -fsS --max-time 20 --retry 3 --retry-all-errors \
            -o "${RUNNER_TEMP}/preview-release.json" "${preview_origin}/release.json"

          cat >"${RUNNER_TEMP}/emit-preview.mjs" <<'NODE'
          // 读取预发布线上的构建身份，确认它就是本次要发布的提交，并留下三个组件摘要。
          import { appendFileSync, readFileSync } from 'node:fs';

          const fail = (message) => { console.error(`预发布证据校验失败：${message}`); process.exit(1); };
          const release = JSON.parse(readFileSync(process.env.PREVIEW_RELEASE, 'utf8'));
          const outputFile = process.env.GITHUB_OUTPUT;
          const HEX64 = /^[a-f0-9]{64}$/;

          if (release.environment !== 'preview') fail(`预发布入口返回的不是 preview 构建：${release.environment}`);
          if (release.commit !== process.env.COMMIT) {
            fail(`当前预发布线上不是该提交，请先在预发布试用同一提交：线上 ${release.commit}，待发布 ${process.env.COMMIT}`);
          }
          const components = release.components ?? {};
          const values = {
            previewOrigin: release.publicOrigin,
            previewManifestSha256: release.manifestSha256,
            previewServerSha256: components.server?.sha256,
            previewWebSha256: components.web?.sha256,
            previewForumSha256: components.forum?.sha256,
          };
          for (const key of ['previewManifestSha256', 'previewServerSha256', 'previewWebSha256', 'previewForumSha256']) {
            if (!HEX64.test(values[key] ?? '')) fail(`${key} 摘要形状非法。`);
          }
          for (const [key, value] of Object.entries(values)) {
            if (typeof value !== 'string' || /[\r\n]/.test(value)) fail(`输出 ${key} 类型非法或含换行。`);
            appendFileSync(outputFile, `${key}=${value}\n`);
          }
          console.log(`预发布线上：${release.environment} ${release.displayVersion} ${release.commit}`);
          NODE

          PREVIEW_RELEASE="${RUNNER_TEMP}/preview-release.json" node "${RUNNER_TEMP}/emit-preview.mjs"

          {
            echo '### 证据 2：预发布线上构建身份'
            echo
            echo "- 预发布入口：${preview_origin}/release.json"
            echo "- 待发布提交：\`${COMMIT}\`"
            echo
            echo '```json'
            cat "${RUNNER_TEMP}/preview-release.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 证据 3／production 环境必须配置人工 reviewer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENVIRONMENT: ${{ needs.plan.outputs.githubEnvironment }}
        run: |
          set -u
          # 权限说明（2026-09-13 核对官方文档）：
          #   * 工作流 permissions 键没有 environments 作用域，可用作用域为
          #     actions / artifact-metadata / attestations / checks / code-quality / contents /
          #     deployments / discussions / id-token / issues / packages / pages /
          #     pull-requests / security-events / statuses / vulnerability-alerts。
          #   * REST「Get an environment」文档只说明 classic token 需要 repo 作用域，
          #     未给出 GITHUB_TOKEN 的独立作用域映射，因此本 job 声明的是可声明范围内的最小集：
          #     contents: read + deployments: read。
          #   * 读不到（403/404/无该环境）一律失败关闭，绝不降级为「假定已配置」。
          # 计划限制（CICD.md）：私有仓库的环境保护规则需要 GitHub Pro/Team 及以上；
          # 免费计划的私有仓库拿不到 required reviewers，这一步会正确地失败关闭。
          if ! gh api "repos/${GITHUB_REPOSITORY}/environments/${GH_ENVIRONMENT}" > "${RUNNER_TEMP}/environment.json" 2>"${RUNNER_TEMP}/environment-error.txt"; then
            echo "production 环境未配置人工 reviewer，禁止自动部署。" >&2
            echo "读取 repos/${GITHUB_REPOSITORY}/environments/${GH_ENVIRONMENT} 失败：" >&2
            sed -n '1,10p' "${RUNNER_TEMP}/environment-error.txt" >&2
            echo "可能原因：环境不存在、GITHUB_TOKEN 无权读取，或当前 GitHub 计划不为私有仓库提供环境保护规则（见 docs/ops/CICD.md）。" >&2
            exit 1
          fi
          rules="$(node -e 'const fs=require("node:fs");const e=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write((e.protection_rules||[]).map(r=>r.type).join(","));' "${RUNNER_TEMP}/environment.json")"
          echo "production 环境保护规则：${rules:-<无>}"
          case ",${rules}," in
            *,required_reviewers,*) ;;
            *)
              echo "production 环境未配置人工 reviewer，禁止自动部署。" >&2
              echo "当前保护规则：${rules:-<无>}；需要 required_reviewers。" >&2
              echo "注意：仅在 YAML 写 environment: production 不会自动产生人工门禁——GitHub 会为不存在的名称创建一个没有任何保护规则的环境。" >&2
              exit 1
              ;;
          esac
          {
            echo '### 证据 3：production 人工门禁'
            echo
            echo "- 环境：\`${GH_ENVIRONMENT}\`"
            echo "- 保护规则：\`${rules}\`"
            echo '- 结论：已配置 required_reviewers。规则存在不等于审批人身份可信，仍须维护者核对名单与禁止自批设置。'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # build：在 plan 解析出的准确提交上做隔离构建，并与预发布验收产物比对核心摘要。
  # ---------------------------------------------------------------------------
  build:
    name: build (双工具链 + 发布包)
    needs: [plan, evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NUXT_TELEMETRY_DISABLED: '1'
      FORUM_PNPM_VERSION: '11.24.0'
    outputs:
      artifactName: ${{ steps.bundle.outputs.artifactName }}
      tarSha256: ${{ steps.bundle.outputs.tarSha256 }}
      manifestSha256: ${{ steps.bundle.outputs.manifestSha256 }}
      componentsServer: ${{ steps.bundle.outputs.componentsServer }}
      componentsWeb: ${{ steps.bundle.outputs.componentsWeb }}
      componentsForum: ${{ steps.bundle.outputs.componentsForum }}
    steps:
      - name: 检出 plan 解析出的准确提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 构建对象必须是 plan 已做过 main 祖先检查的那个 40 位 SHA，不是 tag 名、不是分支 HEAD。
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: 确认检出的就是计划提交
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -u
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_COMMIT" ]; then
            echo "检出提交与发布计划不一致：期望 ${EXPECTED_COMMIT}，实际 ${actual}。" >&2
            exit 1
          fi
          echo "构建提交：${actual}"

      # pnpm 必须先于 setup-node 安装：setup-node 的 pnpm 缓存需要调用 pnpm 解析 store 路径。
      - name: 安装 pnpm（读取根 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 记录核心工具链版本
        shell: bash
        run: |
          set -u
          # 必须在切换到论坛 Node 26 之前记录，否则拿到的是论坛运行时。
          {
            echo "CORE_NODE_VERSION=$(node --version)"
            echo "CORE_PNPM_VERSION=$(pnpm --version)"
          } >> "$GITHUB_ENV"
          node scripts/check-runtime.mjs

      - name: 核心依赖安装（锁文件不可变）
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: 核心静态检查（pnpm check）
        shell: bash
        run: pnpm check

      - name: 核心单元测试（pnpm test）
        shell: bash
        run: pnpm test

      - name: 核心构建（pnpm build）
        shell: bash
        run: pnpm build

      - name: 安装 Node 26（论坛独立运行时）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false

      - name: 安装 pnpm 11.24.0 到 .tools/pnpm11
        shell: bash
        run: |
          set -u
          tmp="$(mktemp -d)"
          npm pack "pnpm@${FORUM_PNPM_VERSION}" --pack-destination "$tmp"
          rm -rf .tools/pnpm11
          mkdir -p .tools/pnpm11
          tar -xzf "${tmp}/pnpm-${FORUM_PNPM_VERSION}.tgz" -C .tools/pnpm11
          rm -rf "$tmp"

      - name: 断言论坛工具链版本并锁定 FORUM_NODE
        shell: bash
        run: |
          set -u
          # 必须在 modules/forum 目录内调用 pnpm.cjs：pnpm 10+ 的启动器会按「最近的 package.json
          # 的 packageManager 字段」自适应版本。仓库根声明的是 pnpm@9.15.9，在根目录运行这个
          # 启动器会解析成 9.15.9（全新 runner 上还会先去下载 pnpm 9），断言必然失败；
          # 只有在 modules/forum 内才会解析成上游锁定的 11.24.0。
          actual="$(cd modules/forum && node ../../.tools/pnpm11/package/bin/pnpm.cjs --version)"
          if [ "$actual" != "$FORUM_PNPM_VERSION" ]; then
            echo "论坛包管理器版本不符：期望 ${FORUM_PNPM_VERSION}，实际 ${actual}" >&2
            exit 1
          fi
          {
            echo "FORUM_NODE=$(command -v node)"
            echo "FORUM_NODE_VERSION=$(node --version)"
          } >> "$GITHUB_ENV"
          echo "forum node: $(node --version); forum pnpm: ${actual}"

      - name: 解析论坛 pnpm store 路径
        id: forum-store
        shell: bash
        run: |
          set -u
          # 与上一步同因：store 路径与 pnpm.cjs 的版本自适应都按最近的 packageManager 字段决定，
          # 必须在 modules/forum 内执行。
          store="$(cd modules/forum && node ../../.tools/pnpm11/package/bin/pnpm.cjs store path)"
          echo "path=${store}" >> "$GITHUB_OUTPUT"
          echo "forum pnpm store: ${store}"

      - name: 缓存论坛 pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.forum-store.outputs.path }}
          key: forum-pnpm-store-${{ runner.os }}-${{ hashFiles('modules/forum/pnpm-lock.yaml') }}
          restore-keys: |
            forum-pnpm-store-${{ runner.os }}-

      - name: 论坛依赖安装（frozen-lockfile）
        shell: bash
        run: node scripts/forum.mjs install

      - name: 论坛检查（强制 demo 种子）
        shell: bash
        # forum.mjs 会先跑 check-forum-adoption.mjs 并强制 GEEK_FORUM_SOURCE=demo：
        # 流水线永远不接触本地私有快照或真实论坛数据。
        run: node scripts/forum.mjs check

      - name: 论坛静态生成（注入构建身份）
        shell: bash
        env:
          # RELEASES.md：论坛「关于」页的环境与版本必须构建时显式注入，
          # 不能靠 NODE_ENV=production 猜正式/预发布。
          GEEK_DEPLOYMENT_ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          GEEK_RELEASE_VERSION: ${{ needs.plan.outputs.displayVersion }}
          GEEK_RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: node scripts/forum.mjs generate

      - name: 打包发布产物（release-bundle build）
        id: bundle
        shell: bash
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          DISPLAY_VERSION: ${{ needs.plan.outputs.displayVersion }}
          BASE_VERSION: ${{ needs.plan.outputs.baseVersion }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_ID: ${{ needs.plan.outputs.releaseId }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -u
          out="${RUNNER_TEMP}/bundle"
          toolchain="${RUNNER_TEMP}/toolchain.json"
          # 工具链元数据由本次实际使用的版本拼成，不是手写常量。
          node -e 'const fs=require("node:fs");fs.writeFileSync(process.argv[1],JSON.stringify({coreNode:process.env.CORE_NODE_VERSION,corePnpm:process.env.CORE_PNPM_VERSION,forumNode:process.env.FORUM_NODE_VERSION,forumPnpm:process.env.FORUM_PNPM_VERSION}));' "$toolchain"
          cat "$toolchain"

          if [ -z "$TAG" ]; then
            echo "正式发布必须携带 release tag。" >&2
            exit 1
          fi

          node scripts/release-bundle.mjs build \
            --environment "$ENVIRONMENT" \
            --display-version "$DISPLAY_VERSION" \
            --base-version "$BASE_VERSION" \
            --commit "$COMMIT" \
            --tag "$TAG" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --run-id "$RUN_ID" \
            --run-number "$RUN_NUMBER" \
            --toolchain "$(cat "$toolchain")" \
            --out "$out" > "${RUNNER_TEMP}/bundle-result.json"

          cat >"${RUNNER_TEMP}/emit-bundle.mjs" <<'NODE'
          // 把 release-bundle 的 stdout JSON 校验后写成 job outputs。
          import { appendFileSync, readFileSync } from 'node:fs';

          const fail = (message) => { console.error(`发布包结果校验失败：${message}`); process.exit(1); };
          const result = JSON.parse(readFileSync(process.env.BUNDLE_RESULT, 'utf8'));
          const outputFile = process.env.GITHUB_OUTPUT;
          if (!outputFile) fail('缺少 GITHUB_OUTPUT。');

          const HEX64 = /^[a-f0-9]{64}$/;
          const ARTIFACT = /^geek-production-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[a-f0-9]{12}$/;

          if (!ARTIFACT.test(result.artifactName ?? '')) fail('artifactName 形状非法。');
          if (result.releaseId !== process.env.RELEASE_ID) {
            fail(`releaseId 与发布计划不一致：计划 ${process.env.RELEASE_ID}，产物 ${result.releaseId}。`);
          }
          if (result.artifactName !== `geek-${process.env.ENVIRONMENT}-${result.releaseId}`) {
            fail('artifactName 与环境/releaseId 不一致。');
          }
          for (const key of ['tarSha256', 'manifestSha256']) {
            if (!HEX64.test(result[key] ?? '')) fail(`${key} 不是 64 位小写十六进制。`);
          }
          for (const name of ['server', 'web', 'forum']) {
            if (!HEX64.test(result.components?.[name] ?? '')) fail(`components.${name} 摘要形状非法。`);
          }

          const values = {
            artifactName: result.artifactName,
            tarPath: result.tarPath,
            tarSha256: result.tarSha256,
            manifestSha256: result.manifestSha256,
            componentsServer: result.components.server,
            componentsWeb: result.components.web,
            componentsForum: result.components.forum,
          };
          for (const [key, value] of Object.entries(values)) {
            if (typeof value !== 'string' || /[\r\n]/.test(value)) fail(`输出 ${key} 类型非法或含换行。`);
            appendFileSync(outputFile, `${key}=${value}\n`);
          }
          console.log(`发布包 ${values.artifactName}：tar ${values.tarSha256.slice(0, 16)}… manifest ${values.manifestSha256.slice(0, 16)}…`);
          NODE

          BUNDLE_RESULT="${RUNNER_TEMP}/bundle-result.json" node "${RUNNER_TEMP}/emit-bundle.mjs"

          # 只把三个文件放进上传目录：发布包 tar、它的摘要文件、构建身份 release.json。
          # 绝不上传解包后的目录、node_modules、.tools、数据库或任何环境文件。
          artifact_name="$(node -e 'const fs=require("node:fs");process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).artifactName);' "${RUNNER_TEMP}/bundle-result.json")"
          upload="${RUNNER_TEMP}/upload"
          mkdir -p "$upload"
          cp "${out}/${artifact_name}.tar.gz" "$upload/"
          cp "${out}/${artifact_name}.tar.gz.sha256" "$upload/"
          cp "${out}/${artifact_name}/release.json" "$upload/"
          ls -l "$upload"

          {
            echo '### 发布包'
            echo
            echo "- 环境：\`${ENVIRONMENT}\`"
            echo "- 版本：\`${DISPLAY_VERSION}\`（tag \`${TAG}\`）"
            echo "- 提交：\`${COMMIT}\`"
            echo "- releaseId：\`${RELEASE_ID}\`"
            echo "- artifact：\`${artifact_name}\`"
            echo
            echo '```json'
            cat "${RUNNER_TEMP}/bundle-result.json"
            echo '```'
            echo
            echo '> 机器构建完成不代表人工验收或部署批准。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 核心产物必须与预发布验收产物一致
        shell: bash
        env:
          BUILD_SERVER: ${{ steps.bundle.outputs.componentsServer }}
          BUILD_WEB: ${{ steps.bundle.outputs.componentsWeb }}
          BUILD_FORUM: ${{ steps.bundle.outputs.componentsForum }}
          PREVIEW_SERVER: ${{ needs.evidence.outputs.previewServerSha256 }}
          PREVIEW_WEB: ${{ needs.evidence.outputs.previewWebSha256 }}
          PREVIEW_FORUM: ${{ needs.evidence.outputs.previewForumSha256 }}
          PREVIEW_MANIFEST: ${{ needs.evidence.outputs.previewManifestSha256 }}
          BUILD_MANIFEST: ${{ steps.bundle.outputs.manifestSha256 }}
        run: |
          set -u
          # server 与 web 两个组件不注入任何环境/版本元数据，因此正式构建应当与预发布构建逐字节等价。
          # 不等 = 代码或依赖发生了变化，人试用过的不是这一份。
          mismatch=0
          if [ "$BUILD_SERVER" != "$PREVIEW_SERVER" ]; then
            echo "server 组件摘要不一致：预发布 ${PREVIEW_SERVER}，本次 ${BUILD_SERVER}" >&2
            mismatch=1
          fi
          if [ "$BUILD_WEB" != "$PREVIEW_WEB" ]; then
            echo "web 组件摘要不一致：预发布 ${PREVIEW_WEB}，本次 ${BUILD_WEB}" >&2
            mismatch=1
          fi
          if [ "$mismatch" != "0" ]; then
            echo "核心产物与预发布验收产物不一致，需重新试用。" >&2
            exit 1
          fi

          # forum 组件在构建期注入 GEEK_DEPLOYMENT_ENVIRONMENT / GEEK_RELEASE_VERSION / GEEK_RELEASE_COMMIT，
          # 预发布与正式必然不同，所以只记录两者摘要供人比对，不做相等判定。
          {
            echo '### 产物一致性'
            echo
            echo '| 组件 | 预发布验收产物 | 本次正式构建 | 判定 |'
            echo '|---|---|---|---|'
            echo "| server | \`${PREVIEW_SERVER}\` | \`${BUILD_SERVER}\` | 必须相等，已通过 |"
            echo "| web | \`${PREVIEW_WEB}\` | \`${BUILD_WEB}\` | 必须相等，已通过 |"
            echo "| forum | \`${PREVIEW_FORUM}\` | \`${BUILD_FORUM}\` | 构建期注入环境/版本，预期不同，不比较 |"
            echo "| manifest | \`${PREVIEW_MANIFEST}\` | \`${BUILD_MANIFEST}\` | 含 forum 与元数据，预期不同，不比较 |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "核心产物（server/web）与预发布验收产物一致。"

      - name: 上传发布包（仅 tar / sha256 / release.json）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundle.outputs.artifactName }}
          path: ${{ runner.temp }}/upload
          if-no-files-found: error
          retention-days: 30

      - name: 部署开关状态提示
        shell: bash
        env:
          DEPLOY_SWITCH: ${{ vars.GEEK_DEPLOY_PRODUCTION }}
        run: |
          set -u
          # 开关未启用时必须显式说明，避免「跑绿了就以为上线了」的静默误读。
          if [ "${DEPLOY_SWITCH:-}" != "enabled" ]; then
            echo "::warning title=部署开关未启用::部署开关未启用：仅产出并校验产物，未部署"
            {
              echo '### 部署开关未启用：仅产出并校验产物，未部署'
              echo
              echo "仓库变量 \`GEEK_DEPLOY_PRODUCTION\` 不等于 \`enabled\`，deploy job 已跳过。"
              echo '正式环境 https://yangtzeu.work 未发生任何变化。'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "部署开关已启用，deploy job 将执行（仍需通过 production 环境的人工审批）。"
          fi

  # ---------------------------------------------------------------------------
  # deploy：默认关闭。开关、环境保护规则（人工 reviewer）、secrets/vars 都必须由维护者显式配置。
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy (production)
    needs: [plan, evidence, build]
    # 默认关闭：仓库变量未显式设为 enabled 时，整个 job 不运行。
    if: vars.GEEK_DEPLOY_PRODUCTION == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      # 字面量与 deploy/environments.json 的 githubEnvironment 一致，plan 已断言过；
      # evidence job 另外确认了该环境配有 required_reviewers。
      name: production
      url: ${{ needs.plan.outputs.publicOrigin }}
    concurrency:
      # 生产串行，且绝不取消进行中的部署：旧请求排队不能覆盖更晚版本，
      # 切换过程中被取消会留下半完成状态。
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      # 只为写显式部署记录；不含 contents: write，拿不到打 tag 的能力。
      deployments: write
    steps:
      - name: 检出 plan 解析出的准确提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # deploy/remote/deploy-release.sh 必须取自本次构建的同一提交：
          # 它要在解包之前存在于目标机，所以无法从发布包内部取。
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: 下载发布包
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifactName }}
          path: ${{ runner.temp }}/artifact

      - name: 重算 sha256 并与构建结果比对
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.build.outputs.artifactName }}
          EXPECTED_TAR_SHA: ${{ needs.build.outputs.tarSha256 }}
          EXPECTED_COMMIT: ${{ needs.plan.outputs.commit }}
          EXPECTED_ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          EXPECTED_RELEASE_ID: ${{ needs.plan.outputs.releaseId }}
          EXPECTED_DISPLAY_VERSION: ${{ needs.plan.outputs.displayVersion }}
          EXPECTED_TAG: ${{ needs.plan.outputs.tag }}
          EXPECTED_PUBLIC_ORIGIN: ${{ needs.plan.outputs.publicOrigin }}
        run: |
          set -u
          dir="${RUNNER_TEMP}/artifact"
          tar_file="${dir}/${ARTIFACT_NAME}.tar.gz"
          [ -f "$tar_file" ] || { echo "发布包缺失：${tar_file}" >&2; exit 1; }

          actual="$(sha256sum "$tar_file" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_TAR_SHA" ]; then
            echo "发布包 sha256 与构建结果不一致：期望 ${EXPECTED_TAR_SHA}，实际 ${actual}。" >&2
            exit 1
          fi
          # 随包上传的 .sha256 文件也必须一致，否则说明两条记录已经分叉。
          sha_from_file="$(cut -d' ' -f1 < "${tar_file}.sha256")"
          if [ "$sha_from_file" != "$EXPECTED_TAR_SHA" ]; then
            echo ".sha256 文件与构建结果不一致：${sha_from_file}" >&2
            exit 1
          fi

          # release.json 的身份必须与发布计划完全一致，再谈上传。
          # JS 模板字面量的 ${} 必须由 node 解释，不能被 shell 展开。
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const release = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const expect = {
              environment: process.env.EXPECTED_ENVIRONMENT,
              commit: process.env.EXPECTED_COMMIT,
              releaseId: process.env.EXPECTED_RELEASE_ID,
              displayVersion: process.env.EXPECTED_DISPLAY_VERSION,
              tag: process.env.EXPECTED_TAG,
              // 产物内的 publicOrigin 来自构建提交的 deploy/environments.json；
              // 它必须与 plan 解析出的目标域名一致，否则两份环境合同已经分叉。
              publicOrigin: process.env.EXPECTED_PUBLIC_ORIGIN,
            };
            for (const [key, value] of Object.entries(expect)) {
              if (release[key] !== value) {
                console.error(`release.json 的 ${key} 与发布计划不一致：期望 ${value}，实际 ${release[key]}`);
                process.exit(1);
              }
            }
            if (release.displayVersion.includes("@")) {
              console.error("正式发布产物的 displayVersion 不得带 @ 后缀。");
              process.exit(1);
            }
            if (release.deploymentAuthorized !== false) {
              console.error("release.json 的 deploymentAuthorized 必须恒为 false。");
              process.exit(1);
            }
          ' "${dir}/release.json"
          echo "发布包完整性与身份校验通过：${actual}"

      - name: 校验部署配置是否齐备
        shell: bash
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
          DEPLOY_LOCAL_HEALTH: ${{ vars.DEPLOY_LOCAL_HEALTH }}
          DEPLOY_TARGET_ENVIRONMENT: ${{ vars.DEPLOY_TARGET_ENVIRONMENT }}
        run: |
          set -u
          # 缺任何一项都明确失败：不猜生产默认路径、默认端口或默认服务名。
          # 这些 secrets/vars 必须是 production 环境级的，与 preview 完全隔离
          # （不同目录、数据库、会话密钥、服务身份，见 CICD.md / DEPLOY.md）。
          missing=0
          for name in DEPLOY_SSH_HOST DEPLOY_SSH_PORT DEPLOY_SSH_USER DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then echo "缺少环境级 secret：${name}" >&2; missing=1; fi
          done
          for name in DEPLOY_ROOT DEPLOY_SERVICE DEPLOY_LOCAL_HEALTH DEPLOY_TARGET_ENVIRONMENT; do
            if [ -z "${!name:-}" ]; then echo "缺少环境级变量：${name}" >&2; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "部署配置不完整，拒绝继续。" >&2; exit 1; }

          # preview 与 production 使用同名 secrets/vars。环境级缺失时 GitHub 会静默回落到
          # 仓库级同名值，两个环境因此可能指向同一台机器、同一个目录和同一个服务。
          # DEPLOY_TARGET_ENVIRONMENT 必须逐字等于本 job 的环境名。但 GitHub 是逐个变量独立解析的
          # （environment > repository > organization），所以该哨兵只证明 DEPLOY_TARGET_ENVIRONMENT
          # 本身配在环境级；DEPLOY_ROOT、DEPLOY_SERVICE、DEPLOY_LOCAL_HEALTH 与 5 个 SSH secret
          # 仍须维护者逐项确认配在环境级，并且不要在仓库级创建任何同名 DEPLOY_* 项
          # （仓库级一旦存在就可能静默回落）。
          if [ "$DEPLOY_TARGET_ENVIRONMENT" != "production" ]; then
            echo "DEPLOY_TARGET_ENVIRONMENT=${DEPLOY_TARGET_ENVIRONMENT}，与本 job 的环境名 production 不符。" >&2
            echo "环境级变量未配置或被仓库级值覆盖：请在 production 环境下把它设为 production（见 docs/ops/CICD.md）。" >&2
            exit 1
          fi

          # 形状校验只对非机密项报值；secret 只判空，绝不回显。
          fail_shape() { echo "部署配置取值非法：$1" >&2; exit 1; }
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9._/-]{1,200}$ ]] || fail_shape "DEPLOY_ROOT=${DEPLOY_ROOT}"
          [[ "$DEPLOY_SERVICE" =~ ^[A-Za-z0-9@._-]{1,120}$ ]] || fail_shape "DEPLOY_SERVICE=${DEPLOY_SERVICE}"
          [[ "$DEPLOY_LOCAL_HEALTH" =~ ^http://127\.0\.0\.1:[0-9]{2,5}/[A-Za-z0-9._/-]*$ ]] || fail_shape "DEPLOY_LOCAL_HEALTH=${DEPLOY_LOCAL_HEALTH}"
          [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || fail_shape "DEPLOY_SSH_PORT（取值不回显）"
          [[ "$DEPLOY_SSH_HOST" =~ ^[A-Za-z0-9.:_-]{3,255}$ ]] || fail_shape "DEPLOY_SSH_HOST（取值不回显）"
          [[ "$DEPLOY_SSH_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || fail_shape "DEPLOY_SSH_USER（取值不回显）"
          echo "部署配置齐备（DEPLOY_ROOT=${DEPLOY_ROOT} DEPLOY_SERVICE=${DEPLOY_SERVICE}）。"

      - name: 上传产物与部署脚本并执行远端部署
        id: remote-deploy
        shell: bash
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
          DEPLOY_LOCAL_HEALTH: ${{ vars.DEPLOY_LOCAL_HEALTH }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifactName }}
          TAR_SHA256: ${{ needs.build.outputs.tarSha256 }}
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_ID: ${{ needs.plan.outputs.releaseId }}
          PUBLIC_ORIGIN: ${{ needs.plan.outputs.publicOrigin }}
        run: |
          set -u
          key="${RUNNER_TEMP}/deploy_key"
          known="${RUNNER_TEMP}/known_hosts"
          # umask 先行，保证文件从创建瞬间就不是全局可读。
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$known"
          chmod 600 "$key" "$known"

          # StrictHostKeyChecking=yes + 显式 known_hosts：主机指纹不匹配直接断开，不接受首次信任。
          ssh_opts=(-i "$key" -o "IdentitiesOnly=yes" -o "StrictHostKeyChecking=yes"
            -o "UserKnownHostsFile=${known}" -o "BatchMode=yes" -o "ConnectTimeout=20"
            -o "ServerAliveInterval=30" -o "LogLevel=ERROR")
          dest="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"

          incoming="${DEPLOY_ROOT}/incoming"
          remote_tar="${incoming}/${ARTIFACT_NAME}.tar.gz"
          remote_sha="${incoming}/${ARTIFACT_NAME}.tar.gz.sha256"
          # 部署脚本版本 = 本次构建提交：它取自 checkout 的 deploy/remote/，与发布包同源。
          remote_script="${incoming}/deploy-release.${RELEASE_ID}.sh"

          run_ssh() {
            # 远端命令整串由调用方用 printf %q 组装，这里不再拼接。
            ssh -p "$DEPLOY_SSH_PORT" "${ssh_opts[@]}" "$dest" "$1"
          }
          put_file() {
            # $1=本地文件 $2=远端绝对路径；用 ssh cat 而非 scp，远端路径只经一次 %q 转义。
            ssh -p "$DEPLOY_SSH_PORT" "${ssh_opts[@]}" "$dest" "cat > $(printf %q "$2")" < "$1"
          }

          run_ssh "mkdir -p $(printf %q "$incoming")"
          put_file "${RUNNER_TEMP}/artifact/${ARTIFACT_NAME}.tar.gz" "$remote_tar"
          put_file "${RUNNER_TEMP}/artifact/${ARTIFACT_NAME}.tar.gz.sha256" "$remote_sha"
          put_file "deploy/remote/deploy-release.sh" "$remote_script"
          echo "已上传发布包与部署脚本（脚本版本 = 构建提交 ${COMMIT}）。"

          cmd="bash $(printf %q "$remote_script")"
          cmd="${cmd} --environment $(printf %q "$ENVIRONMENT")"
          cmd="${cmd} --deploy-root $(printf %q "$DEPLOY_ROOT")"
          cmd="${cmd} --service $(printf %q "$DEPLOY_SERVICE")"
          cmd="${cmd} --tar $(printf %q "$remote_tar")"
          cmd="${cmd} --sha256 $(printf %q "$TAR_SHA256")"
          cmd="${cmd} --commit $(printf %q "$COMMIT")"
          cmd="${cmd} --release-id $(printf %q "$RELEASE_ID")"
          cmd="${cmd} --public-origin $(printf %q "$PUBLIC_ORIGIN")"
          cmd="${cmd} --local-health $(printf %q "$DEPLOY_LOCAL_HEALTH")"
          run_ssh "$cmd"

      - name: 清理远端 incoming（尽力而为）
        if: always()
        shell: bash
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifactName }}
          RELEASE_ID: ${{ needs.plan.outputs.releaseId }}
        run: |
          set -u
          key="${RUNNER_TEMP}/deploy_key"
          known="${RUNNER_TEMP}/known_hosts"
          if [ ! -f "$key" ] || [ ! -f "$known" ]; then
            echo "SSH 凭据文件不存在，跳过远端清理。"
            exit 0
          fi
          incoming="${DEPLOY_ROOT}/incoming"
          cmd="rm -f $(printf %q "${incoming}/${ARTIFACT_NAME}.tar.gz")"
          cmd="${cmd} $(printf %q "${incoming}/${ARTIFACT_NAME}.tar.gz.sha256")"
          cmd="${cmd} $(printf %q "${incoming}/deploy-release.${RELEASE_ID}.sh")"
          # 清理失败不改变部署结论：部署成败已由上一步决定，这里只避免磁盘堆积。
          if ssh -p "$DEPLOY_SSH_PORT" -i "$key" -o "IdentitiesOnly=yes" -o "StrictHostKeyChecking=yes" \
               -o "UserKnownHostsFile=${known}" -o "BatchMode=yes" -o "ConnectTimeout=20" -o "LogLevel=ERROR" \
               "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" "$cmd"; then
            echo "远端 incoming 已清理。"
          else
            echo "远端 incoming 清理失败（不影响本次部署结论）。"
          fi

      - name: 销毁 runner 上的 SSH 材料
        if: always()
        shell: bash
        run: |
          set -u
          rm -f "${RUNNER_TEMP}/deploy_key" "${RUNNER_TEMP}/known_hosts"
          echo "已删除 runner 上的 SSH 私钥与 known_hosts。"

      - name: runner 侧独立复核公开入口
        id: verify-public
        shell: bash
        env:
          PUBLIC_ORIGIN: ${{ needs.plan.outputs.publicOrigin }}
          EXPECTED_COMMIT: ${{ needs.plan.outputs.commit }}
          EXPECTED_DISPLAY_VERSION: ${{ needs.plan.outputs.displayVersion }}
          EXPECTED_ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          EXPECTED_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -u
          # 目标机脚本失败时已自动回滚，但 runner 必须独立再看一眼公开入口，
          # 否则「服务器说成功」就成了唯一证据来源。
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-all-errors "${PUBLIC_ORIGIN}/healthz" || echo 000)"
          if [ "$status" != "200" ]; then
            echo "公开健康检查失败：${PUBLIC_ORIGIN}/healthz 返回 ${status}。" >&2
            exit 1
          fi
          curl -fsS --max-time 20 --retry 3 --retry-all-errors -o "${RUNNER_TEMP}/public-release.json" "${PUBLIC_ORIGIN}/release.json"
          # JS 模板字面量的 ${} 必须由 node 解释，不能被 shell 展开。
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const release = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (release.commit !== process.env.EXPECTED_COMMIT) {
              console.error(`线上 release.json 的 commit 不是本次提交：期望 ${process.env.EXPECTED_COMMIT}，实际 ${release.commit}`);
              process.exit(1);
            }
            if (release.displayVersion !== process.env.EXPECTED_DISPLAY_VERSION) {
              console.error(`线上 release.json 的 displayVersion 不一致：期望 ${process.env.EXPECTED_DISPLAY_VERSION}，实际 ${release.displayVersion}`);
              process.exit(1);
            }
            // 只比 commit 与 displayVersion 不够：同一提交在预发布与正式上构建出的 commit 完全相同，
            // 环境和入口却可能指向另一台机器。environment / publicOrigin / tag 必须一并断言，
            // 才能证明「yangtzeu.work 上跑的确实是本次 release tag 的正式产物」。
            if (release.environment !== process.env.EXPECTED_ENVIRONMENT) {
              console.error(`线上 release.json 的 environment 不是本工作流环境：期望 ${process.env.EXPECTED_ENVIRONMENT}，实际 ${release.environment}`);
              process.exit(1);
            }
            if (release.publicOrigin !== process.env.PUBLIC_ORIGIN) {
              console.error(`线上 release.json 的 publicOrigin 与发布计划不一致：期望 ${process.env.PUBLIC_ORIGIN}，实际 ${release.publicOrigin}`);
              process.exit(1);
            }
            if (release.tag !== process.env.EXPECTED_TAG) {
              console.error(`线上 release.json 的 tag 与发布计划不一致：期望 ${process.env.EXPECTED_TAG}，实际 ${release.tag}`);
              process.exit(1);
            }
            console.log(`线上确认：${release.environment} ${release.displayVersion} ${release.commit} ${release.tag} ${release.publicOrigin}`);
          ' "${RUNNER_TEMP}/public-release.json"

      - name: 记录显式部署结果
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENVIRONMENT: ${{ needs.plan.outputs.githubEnvironment }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_ID: ${{ needs.plan.outputs.releaseId }}
          DISPLAY_VERSION: ${{ needs.plan.outputs.displayVersion }}
          TAG: ${{ needs.plan.outputs.tag }}
          PUBLIC_ORIGIN: ${{ needs.plan.outputs.publicOrigin }}
          DEPLOY_OUTCOME: ${{ steps.remote-deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify-public.outcome }}
        run: |
          set -u
          # 成功与失败都要写，不能只在成功时留痕，否则部署历史会只剩好消息。
          if [ "$DEPLOY_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
            state="success"
          else
            state="failure"
          fi

          # JS 模板字面量的 ${} 必须由 node 解释，不能被 shell 展开。
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              ref: process.env.COMMIT,
              environment: process.env.GH_ENVIRONMENT,
              auto_merge: false,
              required_contexts: [],
              production_environment: process.env.GH_ENVIRONMENT === "production",
              transient_environment: false,
              description: `releaseId=${process.env.RELEASE_ID} tag=${process.env.TAG} displayVersion=${process.env.DISPLAY_VERSION}`,
            }));
          ' "${RUNNER_TEMP}/deployment.json"

          id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments" -X POST --input "${RUNNER_TEMP}/deployment.json" --jq '.id')"
          if [ -z "$id" ]; then
            echo "未能创建部署记录。" >&2
            exit 1
          fi

          # JS 模板字面量的 ${} 必须由 node 解释，不能被 shell 展开。
          # shellcheck disable=SC2016
          DEPLOY_STATE="$state" node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              state: process.env.DEPLOY_STATE,
              environment: process.env.GH_ENVIRONMENT,
              environment_url: process.env.PUBLIC_ORIGIN,
              description: `releaseId=${process.env.RELEASE_ID} commit=${process.env.COMMIT}`,
            }));
          ' "${RUNNER_TEMP}/deployment-status.json"

          gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" -X POST \
            --input "${RUNNER_TEMP}/deployment-status.json" --jq '.state'

          {
            echo '### 部署记录'
            echo
            echo "- 环境：\`${GH_ENVIRONMENT}\`（${PUBLIC_ORIGIN}）"
            echo "- tag：\`${TAG}\`，提交：\`${COMMIT}\`"
            echo "- releaseId：\`${RELEASE_ID}\`"
            echo "- 部署记录 ID：\`${id}\`，状态：\`${state}\`"
            echo
            echo '> 部署记录证明「这个产物上过这个环境」，不证明有人试用并批准过它。'
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$state" = "success" ] || echo "本次部署未成功，已记录 failure 状态。"
