name: Architecture alignment

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: architecture-alignment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  architecture-alignment:
    name: architecture-alignment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 读取候选提交与完整历史（不安装或运行应用）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 安装检查运行时
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: 按真实 diff 核对宏观颗粒度
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          git fetch --no-tags origin "$BASE_SHA"
          policy="${RUNNER_TEMP}/check-architecture.mjs"
          # 检查器只取目标分支的版本，候选分支不能改自己的校验逻辑放行；目标分支连检查器都没有时失败关闭。
          if ! git cat-file -e "${BASE_SHA}:scripts/check-architecture.mjs" 2>/dev/null \
            || ! git show "${BASE_SHA}:scripts/check-architecture.mjs" > "$policy"; then
            echo "宏观对齐失败：目标分支没有 scripts/check-architecture.mjs，不改用候选分支的检查器放行。"
            exit 1
          fi
          # 目标分支的检查器认 --forge（已合入 #330）时按平台读声明；不认时（GitHub stage 还没合入 #330）按旧参数调用，检查器仍只取目标分支的版本。
          use_forge=""
          if grep -q '^export const FORGES' "$policy"; then
            use_forge=yes
          fi
          git show "${BASE_SHA}:scripts/hotfix-windows.mjs" > "${RUNNER_TEMP}/hotfix-windows.mjs"
          # 基线还没有 owner-approval 时不复制：hotfix-windows 只有导入它的版本才需要，set -e 下 git show 找不到路径会直接失败
          if git cat-file -e "${BASE_SHA}:scripts/owner-approval.mjs" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/owner-approval.mjs" > "${RUNNER_TEMP}/owner-approval.mjs"
          fi
          git show "${BASE_SHA}:scripts/check-doc-sync.mjs" > "${RUNNER_TEMP}/check-doc-sync.mjs"
          git show "${BASE_SHA}:scripts/note.mjs" > "${RUNNER_TEMP}/note.mjs"
          # 基线还没有隐私门禁时不复制：set -e 下 git show 找不到路径会直接失败；基线的 note.mjs 不导入它
          if git cat-file -e "${BASE_SHA}:scripts/check-privacy.mjs" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/check-privacy.mjs" > "${RUNNER_TEMP}/check-privacy.mjs"
          fi
          git show "${BASE_SHA}:scripts/pr-markdown.mjs" > "${RUNNER_TEMP}/pr-markdown.mjs"
          printf '%s' "$PR_BODY" > "${RUNNER_TEMP}/architecture-body.md"
          # 认 --forge 时 GitHub 一侧读 docs/changes/github/<编号>.json，与 GitLab 同号的 docs/changes/<编号>.json 各取各的（#330）；旧检查器只读扁平的 docs/changes/<编号>.json
          node "$policy" --root "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --branch "$HEAD_REF" --body-file "${RUNNER_TEMP}/architecture-body.md" \
            --report "${RUNNER_TEMP}/architecture-impact.json" ${use_forge:+--forge github}

      - name: 保存宏观影响报告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-impact
          path: ${{ runner.temp }}/architecture-impact.json
          if-no-files-found: error
          retention-days: 14
