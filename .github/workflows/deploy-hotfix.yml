# 已授权 P0 的同版本热修订：main + 完整 SHA + 既有正式 tag；不创建或移动 tag。
name: Deploy Hotfix
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '既有正式版本 tag，例如 v0.1.1'
        required: true
        type: string
      commit:
        description: 'main 当前完整 40 位修复 SHA'
        required: true
        type: string
      issue:
        description: '已由所有者批准的 P0 issue 编号'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  plan:
    name: plan (main 同版本 hotfix)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      base_commit: ${{ steps.identity.outputs.base_commit }}
      issue: ${{ inputs.issue }}
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      image_tag: ${{ steps.identity.outputs.image_tag }}
      image_repository: ${{ steps.identity.outputs.image_repository }}
      release_version: ${{ steps.identity.outputs.release_version }}
      origin: ${{ steps.identity.outputs.origin }}
      stack_root: ${{ steps.identity.outputs.stack_root }}
      incoming_dir: ${{ steps.identity.outputs.incoming_dir }}
      runtime_env_file: ${{ steps.identity.outputs.runtime_env_file }}
      images_archive: ${{ steps.identity.outputs.images_archive }}
      compose_project: ${{ steps.identity.outputs.compose_project }}
    steps:
      - name: 拒绝 main 以外的触发来源
        shell: bash
        run: |
          set -eu
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
      - name: 检出工作流的明确提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 安装 Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: 规划 hotfix 身份
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          HOTFIX_COMMIT: ${{ inputs.commit }}
          HOTFIX_ISSUE: ${{ inputs.issue }}
        run: |
          set -eu
          node scripts/hotfix-policy.mjs plan > "$RUNNER_TEMP/hotfix-plan.json"
          jq -r 'to_entries[] | select(.key as $k | ["tag","version","commit","origin"] | index($k)) | "\(.key)=\(.value)"' "$RUNNER_TEMP/hotfix-plan.json" >> "$GITHUB_OUTPUT"
          for pair in base_commit:baseCommit image_tag:imageTag image_repository:imageRepository release_version:releaseVersion stack_root:stackRoot incoming_dir:incomingDir runtime_env_file:runtimeEnvFile images_archive:imagesArchive compose_project:composeProject; do
            printf '%s=%s\n' "${pair%%:*}" "$(jq -r --arg key "${pair#*:}" '.[$key]' "$RUNNER_TEMP/hotfix-plan.json")" >> "$GITHUB_OUTPUT"
          done
          node scripts/deployment-environment.mjs --check
          node scripts/check-doc-sync.mjs

  core:
    name: hotfix-core
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: 准备离线 CLI 集成测试依赖（锁文件不可变）
        run: cargo fetch --manifest-path app/cli/Cargo.toml --locked
      - run: pnpm test
      - run: pnpm build

  evidence:
    name: hotfix-verify
    needs: [plan, core, forum]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: 核对线上版本与成功的生产部署记录
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          HOTFIX_COMMIT: ${{ needs.plan.outputs.commit }}
          HOTFIX_ISSUE: ${{ needs.plan.outputs.issue }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          node scripts/hotfix-policy.mjs plan > "$RUNNER_TEMP/hotfix-plan.json"
          node scripts/hotfix-policy.mjs verify-live "$RUNNER_TEMP/hotfix-plan.json"

      - name: 写入 hotfix-verify 的 commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -eu
          # workflow_dispatch 的 check-run 不会自动成为 Deployments API 的 required_contexts。
          # 只有上面的完整核心/论坛验证与真实生产证据都成功后，才把同一个上下文写成 success；
          # deploy 创建记录时仍要求 hotfix-verify，不减少任何验证。
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${COMMIT}" \
            -f context=hotfix-verify -f state=success \
            -f description="核心、论坛与生产证据核对通过" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  forum:
    needs: plan
    name: forum (Node 26 / pnpm 11.24.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NUXT_TELEMETRY_DISABLED: '1'
      # 上游锁定版本；同时用于 npm pack 的包名和安装后的断言。
      FORUM_PNPM_VERSION: '11.24.0'
      # pnpm-11.24.0.tgz 的 sha512，取自官方源（npm view pnpm@11.24.0 dist.integrity --registry https://registry.npmjs.org）。
      # npm pack 只拿同一个源给的 integrity 核对，源换成镜像后要靠这个写死的值；与 app/forum/Dockerfile 相同，
      # tests/tooling/build-mirrors.test.ts 核对两处一致。
      FORUM_PNPM_INTEGRITY: 'sha512-vSfjRel23LC+C3oSKCF7BJqBfiGx81XJDb59xGZxiVqLwebQbCRVRQXqk+oLRfSJon7Bv7yN5qlln8oPFvoAAA=='
      # npm pack 读 npm_config_registry；论坛的 pnpm 11 只认 pnpm_config_registry（scripts/forum.mjs 原样转给它），
      # 装依赖时按 app/forum/pnpm-lock.yaml 的 integrity 核对。
      npm_config_registry: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
      pnpm_config_registry: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: 安装 Node 26（论坛独立运行时）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # app/forum/package.json 要求 engines.node >=26。
          node-version: '26'
          # 根 packageManager 是 pnpm 而非 npm，这里显式关掉 setup-node 的自动包管理器缓存，
          # 论坛 store 由下面的 actions/cache 单独管理，避免误用核心工具链的缓存。
          package-manager-cache: false

      - name: 安装 pnpm 11.24.0 到 .tools/pnpm11
        shell: bash
        run: |
          set -u
          tmp="$(mktemp -d)"
          # npm pack 从 registry 下载并按 integrity 校验 tarball，源可能是镜像，再按写死的 FORUM_PNPM_INTEGRITY 核对一次；
          # 解包后得到 .tools/pnpm11/package/bin/pnpm.cjs，与本机开发布局一致，
          # 这样 scripts/forum.mjs 的默认 FORUM_PNPM 路径无需改动。
          npm pack "pnpm@${FORUM_PNPM_VERSION}" --pack-destination "$tmp"
          node -e 'const [file, want] = process.argv.slice(1); const got = "sha512-" + require("node:crypto").createHash("sha512").update(require("node:fs").readFileSync(file)).digest("base64"); if (got !== want) { console.error(file + " 的 sha512 不符：期望 " + want + "，实际 " + got); process.exit(1); } console.log(file + " 的 sha512 核对通过");' \
            "${tmp}/pnpm-${FORUM_PNPM_VERSION}.tgz" "$FORUM_PNPM_INTEGRITY"
          rm -rf .tools/pnpm11
          mkdir -p .tools/pnpm11
          tar -xzf "${tmp}/pnpm-${FORUM_PNPM_VERSION}.tgz" -C .tools/pnpm11
          rm -rf "$tmp"

      - name: 断言论坛工具链版本并锁定 FORUM_NODE
        shell: bash
        run: |
          set -u
          # 必须在 app/forum 目录内调用 pnpm.cjs：pnpm 10+ 的启动器会按「最近的 package.json
          # 的 packageManager 字段」自适应版本。仓库根声明的是 pnpm@9.15.9，在根目录运行这个
          # 启动器会解析成 9.15.9（全新 runner 上还会先去下载 pnpm 9），断言必然失败；
          # 只有在 app/forum 内才会解析成上游锁定的 11.24.0。
          actual="$(cd app/forum && node ../../.tools/pnpm11/package/bin/pnpm.cjs --version)"
          if [ "$actual" != "$FORUM_PNPM_VERSION" ]; then
            echo "论坛包管理器版本不符：期望 ${FORUM_PNPM_VERSION}，实际 ${actual}" >&2
            exit 1
          fi
          # scripts/forum.mjs 会逐个探测候选 Node 并要求主版本 >=26；
          # 这里显式指向 setup-node 装好的那一个，不依赖探测顺序。
          echo "FORUM_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "forum node: $(node --version); forum pnpm: ${actual}"

      - name: 解析论坛 pnpm store 路径
        id: forum-store
        shell: bash
        run: |
          set -u
          # 必须在 app/forum 内解析：store 位置受该目录的 pnpm 配置影响，
          # 且 pnpm.cjs 的版本自适应同样按最近的 packageManager 字段决定（同上一步的原因）。
          store="$(cd app/forum && node ../../.tools/pnpm11/package/bin/pnpm.cjs store path)"
          echo "path=${store}" >> "$GITHUB_OUTPUT"
          echo "forum pnpm store: ${store}"

      - name: 缓存论坛 pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.forum-store.outputs.path }}
          key: forum-pnpm-store-${{ runner.os }}-${{ hashFiles('app/forum/pnpm-lock.yaml') }}
          # 只缓存包内容寻址的 store，不缓存 node_modules；
          # 命中与否都不改变 --frozen-lockfile 的安装结果。
          restore-keys: |
            forum-pnpm-store-${{ runner.os }}-

      - name: 论坛依赖安装（frozen-lockfile）
        shell: bash
        run: node scripts/forum.mjs install

      - name: 论坛检查（强制 demo 种子）
        shell: bash
        # forum.mjs 会先跑 scripts/check-forum-adoption.mjs 核对上游来源，
        # 并强制 GEEK_FORUM_SOURCE=demo：CI 永远不接触本地私有快照或真实数据。
        run: node scripts/forum.mjs check

      - name: 论坛静态生成（强制 demo 种子）
        shell: bash
        run: node scripts/forum.mjs generate

  # 环境契约：deploy/env/.env.<environment> ↔ deploy/environments.json ↔ deploy/compose/*.yml。
  # 这一条是部署前的硬门禁——两套栈的端口、目录、域名、密钥留空状态不许静默漂移。

  # 同构清单：预发布做过、不在提交里的事（表结构的手工步骤、数据格式、env 键与密钥、宿主配置、外部服务），正式都要做完才能构建。
  # 规则见 docs/conventions/RELEASE-PARITY.md；清单里还有 pending 就失败，不构建、不部署。
  parity:
    name: parity (预发布到正式的同构清单)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 检出 plan 核对过的提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: 清单必须清零
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/parity.mjs check --release --version "$RELEASE_VERSION"

  cdn-plan:
    name: cdn-plan (静态资源 CDN 开关)
    needs: [plan, evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # token 存在 GitHub Environment `static-cdn`（部署 tag 规则只放行 v*）；deployment: false 不产生部署记录。
    environment:
      name: static-cdn
      deployment: false
    permissions:
      contents: read
    outputs:
      base: ${{ steps.decide.outputs.base }}
    steps:
      - name: 检出 plan 核对过的提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 决定这次是否用 CDN（没有凭据或 CSP 未放行 = 同源）
        id: decide
        shell: bash
        # stdout 只有一行 base=<地址或空>。部分凭据或 S3 认证失败直接失败；不打印凭据。
        env:
          STATIC_CDN_S3_ACCESS_KEY_ID: ${{ secrets.STATIC_CDN_S3_ACCESS_KEY_ID }}
          STATIC_CDN_S3_SECRET_ACCESS_KEY: ${{ secrets.STATIC_CDN_S3_SECRET_ACCESS_KEY }}
          STATIC_CDN_S3_ENDPOINT: https://cdn.yangtzeu.work
          STATIC_CDN_S3_REGION: garage
          STATIC_CDN_S3_BUCKET: geek-public
          STATIC_CDN_S3_FORCE_PATH_STYLE: 'true'
          ORIGIN: ${{ needs.plan.outputs.origin }}
        run: |
          set -eu
          node scripts/static-cdn.mjs decide --origin "$ORIGIN" >> "$GITHUB_OUTPUT"

  # 构建：与预发布同构，但按正式身份（无 @ 后缀）构建。
  build:
    name: build (镜像归档)
    needs: [plan, evidence, cdn-plan, parity]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 下载源（#104）：仓库变量没设时回到官方源，与 ci.yml 的写法相同（docs/ops/CICD.md「构建下载源」）。
      # 大写三项以 build arg 传给 Dockerfile 的构建阶段，不进运行镜像。
      NPM_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
      DEBIAN_MIRROR: ${{ vars.DEBIAN_MIRROR || '' }}
      BETTER_SQLITE3_BINARY_HOST: ${{ vars.BETTER_SQLITE3_BINARY_HOST || '' }}
      # runner 上的 pnpm/action-setup（npm ci）与 pnpm 9 install 读这两项；不设 pnpm_config_registry 的原因见 ci.yml core job。
      npm_config_registry: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
      npm_config_better_sqlite3_binary_host: ${{ vars.BETTER_SQLITE3_BINARY_HOST || '' }}
    steps:
      - name: 检出 plan 核对过的提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 用 plan 输出的完整 SHA，而不是再按 tag 名解析一次：tag 在两次检出之间被改动也构建不到别的代码。
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      # prebuild-install 不核对 better-sqlite3 预编译包的哈希，传输途中不被换包只能靠 https（#104）。
      # 在任何下载之前按与 app/server/Dockerfile 构建阶段相同的 case 核对地址：空 = GitHub releases；
      # tests/tooling/build-mirrors.test.ts 核对三处 job 与 Dockerfile 一致，并实跑这一步。
      - name: 核对 better-sqlite3 预编译包地址
        shell: bash
        run: |
          BETTER_SQLITE3_BINARY_HOST=$npm_config_better_sqlite3_binary_host
          if [ -n "$BETTER_SQLITE3_BINARY_HOST" ]; then
            case "$BETTER_SQLITE3_BINARY_HOST" in https://*[!/]) ;; *) echo "BETTER_SQLITE3_BINARY_HOST 必须是不带结尾 / 的 https:// 地址：${BETTER_SQLITE3_BINARY_HOST}" >&2; exit 1 ;; esac
            case "$BETTER_SQLITE3_BINARY_HOST" in *[!0-9A-Za-z.:/_-]*) echo "BETTER_SQLITE3_BINARY_HOST 含有不允许的字符：${BETTER_SQLITE3_BINARY_HOST}" >&2; exit 1 ;; esac
          fi
          echo "better-sqlite3 预编译包：${BETTER_SQLITE3_BINARY_HOST:-GitHub releases}"

      - name: 安装 pnpm（读取根 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 依赖安装（锁文件不可变）
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: 构建（提交态 = production 值）
        shell: bash
        env:
          GEEK_DEPLOYMENT_ENVIRONMENT: production
          GEEK_RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
          GEEK_RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: pnpm build

      - name: 构建并核对 CLI 五目标分发物料
        shell: bash
        # 固定 digest 的 cargo-zigbuild 容器内含 macOS SDK；不向 web 运行镜像加入 Rust/Zig/Cargo。
        # cli-dist 生成五目标二进制、安装脚本、latest.json 与 sha256，随后独立核对非空和清单完整性。
        run: |
          set -eu
          node scripts/cli-dist.mjs --container
          node scripts/check-cli-dist.mjs

      - name: 构建三个镜像（production 专用仓库，tag = SHA 前 12 位）
        shell: bash
        # 镜像仓库按环境分开（yzgc-production/<服务>）：两套栈共用目标机的 Docker 守护进程，
        # 同一提交的预发布与正式镜像构建参数不同，共用镜像名会在 docker load 时互相覆盖。
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          IMAGE_REPOSITORY: ${{ needs.plan.outputs.image_repository }}
          GEEK_RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
          GEEK_RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          STATIC_CDN_BASE: ${{ needs.cdn-plan.outputs.base }}
        run: |
          set -eu
          for service in server web forum; do
            # 只有 server 的构建阶段用 apt 与 better-sqlite3 的预编译包；web、forum 只换 npm 源。
            case "$service" in
              server) mirror_args=(--build-arg NPM_REGISTRY="$NPM_REGISTRY" --build-arg DEBIAN_MIRROR="$DEBIAN_MIRROR" --build-arg BETTER_SQLITE3_BINARY_HOST="$BETTER_SQLITE3_BINARY_HOST") ;;
              *) mirror_args=(--build-arg NPM_REGISTRY="$NPM_REGISTRY") ;;
            esac
            # 静态资源 CDN 开关（#146、#286）：web、forum 的前端产物，以及 server 里内置表情图片的地址都跟着它；空 = 同源。
            cdn_args=(--build-arg STATIC_CDN_BASE="$STATIC_CDN_BASE")
            case "$service" in
              web) context_args=(--build-context cli=dist/cli) ;;
              *) context_args=() ;;
            esac
            docker build \
              --file "app/${service}/Dockerfile" \
              "${context_args[@]}" \
              --build-arg GEEK_DEPLOYMENT_ENVIRONMENT=production \
              --build-arg GEEK_RELEASE_VERSION="$GEEK_RELEASE_VERSION" \
              --build-arg GEEK_RELEASE_COMMIT="$GEEK_RELEASE_COMMIT" \
              "${mirror_args[@]}" \
              "${cdn_args[@]}" \
              --tag "${IMAGE_REPOSITORY}/${service}:${IMAGE_TAG}" .
          done
          docker image list --format '{{.Repository}}:{{.Tag}}' | grep "^${IMAGE_REPOSITORY}/"

      - name: 取出要上传 CDN 的带哈希文件（开关打开时）
        if: needs.cdn-plan.outputs.base != ''
        shell: bash
        # 从刚构建的 web、forum 镜像里原样拷出三个产物目录，再按 scripts/static-cdn.mjs 的规则挑文件（不联网）：
        # 有不带内容哈希的文件就在这里失败。上传在 cdn-upload job 里做，本 job 不接触 S3 凭据。
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          IMAGE_REPOSITORY: ${{ needs.plan.outputs.image_repository }}
        run: |
          set -eu
          out="${RUNNER_TEMP}/static-cdn"
          mkdir -p "${out}/web" "${out}/forum"
          web="$(docker create "${IMAGE_REPOSITORY}/web:${IMAGE_TAG}")"
          forum="$(docker create "${IMAGE_REPOSITORY}/forum:${IMAGE_TAG}")"
          docker cp "${web}:/usr/share/nginx/html/assets" "${out}/web/assets"
          docker cp "${web}:/usr/share/nginx/html/console-assets" "${out}/web/console-assets"
          docker cp "${forum}:/usr/share/nginx/html/_nuxt" "${out}/forum/_nuxt"
          docker rm "$web" "$forum" > /dev/null
          node scripts/static-cdn.mjs plan --web "${out}/web" --forum "${out}/forum"

      - name: 准备私有索引归档工具
        if: needs.cdn-plan.outputs.base != ''
        shell: bash
        run: |
          set -eu
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends rclone
          mkdir -p "$RUNNER_TEMP/static-cdn/tools"
          install -m 755 "$(command -v rclone)" "$RUNNER_TEMP/static-cdn/tools/rclone"
          ( cd "$RUNNER_TEMP/static-cdn/tools" && sha256sum rclone > rclone.sha256 )
          rclone version

      - name: 上传带哈希的静态文件（交给 cdn-upload，保留 7 天）
        if: needs.cdn-plan.outputs.base != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yzgc-static-production-${{ needs.plan.outputs.image_tag }}
          path: ${{ runner.temp }}/static-cdn/
          if-no-files-found: error
          retention-days: 7

      - name: 打包镜像归档与校验和
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          IMAGE_REPOSITORY: ${{ needs.plan.outputs.image_repository }}
          IMAGES_ARCHIVE: ${{ needs.plan.outputs.images_archive }}
        run: |
          set -eu
          out="${RUNNER_TEMP}/bundle"
          mkdir -p "$out"
          docker save "${IMAGE_REPOSITORY}/server:${IMAGE_TAG}" "${IMAGE_REPOSITORY}/web:${IMAGE_TAG}" "${IMAGE_REPOSITORY}/forum:${IMAGE_TAG}" \
            | gzip -9 > "${out}/${IMAGES_ARCHIVE}"
          ( cd "$out" && sha256sum "${IMAGES_ARCHIVE}" > "${IMAGES_ARCHIVE}.sha256" )
          ls -lh "$out"
          cat "${out}/${IMAGES_ARCHIVE}.sha256"

      - name: 上传镜像归档（保留 30 天，供回滚与审计）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yzgc-images-production-${{ needs.plan.outputs.image_tag }}
          path: |
            ${{ runner.temp }}/bundle/${{ needs.plan.outputs.images_archive }}
            ${{ runner.temp }}/bundle/${{ needs.plan.outputs.images_archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  # 上传并核对（#146）：开关关闭时只打印一行，job 照常成功，deploy 不受影响；开关打开时任何一个文件
  # 上传或经 CDN 核对失败，deploy 都不会开始——HTML 不会先于它引用的文件上线。只增不改，不删除任何对象。
  cdn-upload:
    name: cdn-upload (上传并核对 CDN 静态文件)
    needs: [plan, cdn-plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: static-cdn
      deployment: false
    permissions:
      contents: read
      # 读本次运行的静态文件 artifact（scripts/fetch-artifact.mjs 经 REST API 下载）。
      actions: read
    env:
      STATIC_CDN_BASE: ${{ needs.cdn-plan.outputs.base }}
    steps:
      - name: 开关状态
        shell: bash
        run: |
          set -eu
          if [ -z "$STATIC_CDN_BASE" ]; then
            echo "静态资源 CDN 开关关闭：这次同源构建，不上传。"
          else
            echo "静态资源 CDN 开关打开：${STATIC_CDN_BASE}"
          fi

      - name: 检出 plan 核对过的提交
        if: needs.cdn-plan.outputs.base != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: 安装 Node（读取 .nvmrc）
        if: needs.cdn-plan.outputs.base != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 下载带哈希的静态文件
        if: needs.cdn-plan.outputs.base != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: yzgc-static-production-${{ needs.plan.outputs.image_tag }}
        run: |
          set -eu
          node scripts/fetch-artifact.mjs --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" \
            --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/static-cdn"

      - name: 上传（存在则逐字核对）并经 CDN 完整验证
        if: needs.cdn-plan.outputs.base != ''
        shell: bash
        # 核对 HEAD、完整 GET SHA-256、Range、长度、MIME、CORS；拒绝冲突，不主动覆盖。
        env:
          STATIC_CDN_S3_ACCESS_KEY_ID: ${{ secrets.STATIC_CDN_S3_ACCESS_KEY_ID }}
          STATIC_CDN_S3_SECRET_ACCESS_KEY: ${{ secrets.STATIC_CDN_S3_SECRET_ACCESS_KEY }}
          STATIC_CDN_S3_ENDPOINT: https://cdn.yangtzeu.work
          STATIC_CDN_S3_REGION: garage
          STATIC_CDN_S3_BUCKET: geek-public
          STATIC_CDN_S3_FORCE_PATH_STYLE: 'true'
          ORIGIN: ${{ needs.plan.outputs.origin }}
        run: |
          set -eu
          node scripts/static-cdn.mjs upload --web "$RUNNER_TEMP/static-cdn/web" --forum "$RUNNER_TEMP/static-cdn/forum" \
            --referer "${ORIGIN}/" --environment production \
            --commit "$(git rev-parse HEAD)" --generated-at "$(git show -s --format=%cI HEAD)" \
            --manifest "$RUNNER_TEMP/cdn-release-manifest.json" --content-index "$RUNNER_TEMP/cdn-content-index.json"

      - name: 归档私有内容索引并核验
        if: needs.cdn-plan.outputs.base != ''
        shell: bash
        env:
          PRODUCTION_PRIVATE_INDEX_S3_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_PRIVATE_INDEX_S3_ACCESS_KEY_ID }}
          PRODUCTION_PRIVATE_INDEX_S3_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_PRIVATE_INDEX_S3_SECRET_ACCESS_KEY }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -eu
          ( cd "$RUNNER_TEMP/static-cdn/tools" && sha256sum --check rclone.sha256 )
          chmod 700 "$RUNNER_TEMP/static-cdn/tools/rclone"
          export PATH="$RUNNER_TEMP/static-cdn/tools:$PATH"
          node deploy/remote/garage-archive.mjs put-file --role production-content-index \
            --source "$RUNNER_TEMP/cdn-content-index.json" --key "indexes/content/${COMMIT}/sha256.json"

  # 部署：需要显式开关；GitHub Environment `production` 应配置人工审批（这是真正的放行点）。
  deploy:
    name: deploy (production stack)
    needs: [plan, build, cdn-upload]
    if: vars.DEPLOY_PRODUCTION_ENABLED == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ needs.plan.outputs.origin }}
      # required reviewers 仍生效；目标校验通过后才由 record 步骤创建部署记录。
      deployment: false
    permissions:
      contents: read
      # 读本次运行的镜像归档（scripts/fetch-artifact.mjs 经 REST API 下载）。
      actions: read
      deployments: write
      checks: read
      statuses: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
      HOTFIX_ISSUE: ${{ needs.plan.outputs.issue }}
      BASE_COMMIT: ${{ needs.plan.outputs.base_commit }}
      IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
      IMAGE_REPOSITORY: ${{ needs.plan.outputs.image_repository }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      STACK_ROOT: ${{ needs.plan.outputs.stack_root }}
      INCOMING_DIR: ${{ needs.plan.outputs.incoming_dir }}
      RUNTIME_ENV_FILE: ${{ needs.plan.outputs.runtime_env_file }}
      IMAGES_ARCHIVE: ${{ needs.plan.outputs.images_archive }}
      ORIGIN: ${{ needs.plan.outputs.origin }}
      COMPOSE_PROJECT: ${{ needs.plan.outputs.compose_project }}
    steps:
      - name: 校验 production 环境保护（人工审批必须真实存在）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # 不信任「YAML 里写了 environment: production」这一行：直接读 REST 的环境配置，
        # 没有 required reviewers 就拒绝上线（详见 docs/ops/CICD.md 的证据链一节）。
        run: |
          set -eu
          if ! environment="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production" 2>/dev/null)"; then
            echo "读不到 GitHub Environment 'production'（可能尚未创建，或当前计划不支持环境保护）：拒绝上线。" >&2
            exit 1
          fi
          reviewers="$(echo "$environment" | jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')"
          if [ "$reviewers" -lt 1 ]; then
            echo "Environment 'production' 没有 required reviewers 保护规则：人工审批无法生效，拒绝上线。" >&2
            echo "请在仓库 Settings → Environments → production 配置 required reviewers 后再打开部署开关。" >&2
            exit 1
          fi
          echo "production 环境保护确认：required reviewers 规则 ${reviewers} 条。"

      - name: 校验环境哨兵（防止仓库级变量静默回落）
        shell: bash
        # 环境级 vars 必须显式等于 production：任何回落（仓库级同名变量、空值）都拒绝部署。
        env:
          DEPLOY_TARGET_ENVIRONMENT: ${{ vars.DEPLOY_TARGET_ENVIRONMENT }}
        run: |
          set -eu
          if [ "${DEPLOY_TARGET_ENVIRONMENT}" != "production" ]; then
            echo "环境哨兵不匹配：GitHub Environment 'production' 的 DEPLOY_TARGET_ENVIRONMENT 必须是 production，实际 '${DEPLOY_TARGET_ENVIRONMENT}'" >&2
            exit 1
          fi
          echo "环境哨兵确认：production"

      - name: 检出 plan 核对过的提交（取部署物料：compose 与远端脚本）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 审批后再次核对 main 与当前生产身份
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOTFIX_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -eu
          node scripts/hotfix-policy.mjs plan > "$RUNNER_TEMP/hotfix-plan.json"
          test "$(jq -r '.baseCommit' "$RUNNER_TEMP/hotfix-plan.json")" = "$BASE_COMMIT"
          node scripts/hotfix-policy.mjs verify-live "$RUNNER_TEMP/hotfix-plan.json"

      - name: 校验 SSH 目标并生成受控配置（必须与模板逐字一致）
        shell: bash
        env:
          DEPLOY_TARGET_ENVIRONMENT: ${{ vars.DEPLOY_TARGET_ENVIRONMENT }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -eu
          node scripts/deployment-environment.mjs ssh-config --environment production \
            --out "$RUNNER_TEMP/ssh/config" --key-file "$RUNNER_TEMP/ssh/id_deploy" \
            --known-hosts-file "$RUNNER_TEMP/ssh/known_hosts"

      - name: 下载镜像归档（并发分段）
        shell: bash
        # 不用 actions/download-artifact：它单连接下载。#99 加这一步时部署跑在家里的自托管 runner 上（#139 已退役），
        # 那里单连接只有几十 KB/s、163MB 要一小时，并发 16 段约 6.6MB/s。归档内容仍由目标机的 sha256sum -c 核对。
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: yzgc-images-production-${{ needs.plan.outputs.image_tag }}
        run: |
          set -eu
          node scripts/fetch-artifact.mjs --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" \
            --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/bundle"

      - name: 渲染运行时 env 文件（模板 + 环境级 secrets + IMAGE_TAG）
        shell: bash
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          MAIL_ALIYUN_FROM: ${{ secrets.MAIL_ALIYUN_FROM }}
          MAIL_RESEND_FROM: ${{ secrets.MAIL_RESEND_FROM }}
          MAIL_ALIYUN_ACCESS_KEY_ID: ${{ secrets.MAIL_ALIYUN_ACCESS_KEY_ID }}
          MAIL_ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.MAIL_ALIYUN_ACCESS_KEY_SECRET }}
          MAIL_RESEND_API_KEY: ${{ secrets.MAIL_RESEND_API_KEY }}
          MAIL_ALLOWLIST: ${{ secrets.MAIL_ALLOWLIST }}
          SHIELD_ALLOWLIST: ${{ secrets.SHIELD_ALLOWLIST }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OIDC_JWKS: ${{ secrets.OIDC_JWKS }}
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
        run: |
          set -eu
          node scripts/deployment-environment.mjs render \
            --environment production \
            --out "$RUNNER_TEMP/bundle/.env.production" \
            --image-tag "$IMAGE_TAG"

      - name: 准备 SSH（私钥与 known_hosts 只落在 runner 的临时目录）
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/id_deploy"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_deploy"
          chmod 644 "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH 物料就绪：私钥 $(wc -l < "$RUNNER_TEMP/ssh/id_deploy") 行，known_hosts $(wc -l < "$RUNNER_TEMP/ssh/known_hosts") 行"

      - name: 将本次成功检查绑定到部署状态接口
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/hotfix-policy.mjs publish-check "$RUNNER_TEMP/hotfix-plan.json"

      - name: 创建部署记录（in_progress）
        id: record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # required_contexts 只认本次完整核心/论坛验证与生产证据汇总「hotfix-verify」：默认会要求这个提交上的全部检查都已通过，
          # 而本 job 自己此刻还在运行，GitHub 永远返回 409（v0.1.0-rc.1 首次部署时实测）。
          # auto_merge 默认 true：重新部署落后于默认分支的旧 tag 时 GitHub 会去合并默认分支；这里只部署 plan 核对过的提交。
          # 状态 POST 一律 -F auto_inactive=false（布尔要用 -F）：默认会把同一环境里更早的成功记录置为 inactive，
          # 正式环境的证据 job 读的正是预发布的这些记录。
          deployment_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" \
            -f ref="$COMMIT" -f environment=production -F auto_merge=false \
            -f "required_contexts[]=hotfix-verify" \
            -f description="${RELEASE_TAG} hotfix #${HOTFIX_ISSUE} → production（修复 ${COMMIT}）" \
            -f "payload[tag]=${RELEASE_TAG}" -f "payload[release_version]=${RELEASE_VERSION}" \
            -f "payload[mode]=hotfix" -f "payload[issue]=${HOTFIX_ISSUE}" -f "payload[base_tag_commit]=${BASE_COMMIT}" -f "payload[image_tag]=${IMAGE_TAG}" \
            -f "payload[image_repository]=${IMAGE_REPOSITORY}" \
            --jq '.id')"
          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" -F auto_inactive=false \
            -f state=in_progress -f description="分发镜像与 env 文件到 ${STACK_ROOT}" > /dev/null
          echo "部署记录已创建：deployment ${deployment_id}（${COMMIT}）"

      - name: 生产一致性备份与隔离恢复门禁
        shell: bash
        run: |
          set -eu
          ssh -F "$RUNNER_TEMP/ssh/config" yzgc-target \
            'systemctl start yzgc-backup@production.service && test "$(systemctl show yzgc-backup@production.service -p Result --value)" = success'

      - name: 分发镜像、env 文件与 compose 物料
        shell: bash
        run: |
          set -eu
          cfg="$RUNNER_TEMP/ssh/config"
          ssh -F "$cfg" yzgc-target \
            "mkdir -p '$INCOMING_DIR' '$STACK_ROOT/deploy/compose' && chmod 700 '$INCOMING_DIR'"
          scp -F "$cfg" \
            "$RUNNER_TEMP/bundle/${IMAGES_ARCHIVE}" "$RUNNER_TEMP/bundle/${IMAGES_ARCHIVE}.sha256" \
            "$RUNNER_TEMP/bundle/.env.production" deploy/remote/deploy-stack.sh deploy/remote/rollback-stack.sh \
            "yzgc-target:${INCOMING_DIR}/"
          scp -F "$cfg" \
            deploy/compose/production.yml deploy/compose/preview.yml \
            "yzgc-target:${STACK_ROOT}/deploy/compose/"
          ssh -F "$cfg" yzgc-target \
            "cd '${INCOMING_DIR}' && chmod 600 '.env.production' && ls -la && sha256sum -c '${IMAGES_ARCHIVE}.sha256'"
      - name: 执行远端部署（load 镜像 → compose up → 健康检查）
        id: deploy-stack
        shell: bash
        run: |
          set -eu
          cfg="$RUNNER_TEMP/ssh/config"
          ssh -F "$cfg" yzgc-target \
            "bash '${INCOMING_DIR}/deploy-stack.sh' --environment production --stack-root '${STACK_ROOT}' \
              --image-tag '${IMAGE_TAG}' --incoming-dir '${INCOMING_DIR}' --images '${INCOMING_DIR}/${IMAGES_ARCHIVE}' \
              --env-file '${INCOMING_DIR}/.env.production'"

      - name: 记录部署结果
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.deploy-stack.outcome }}
          DEPLOYMENT_ID: ${{ steps.record.outputs.deployment_id }}
        run: |
          set -eu
          if [ -z "${DEPLOYMENT_ID:-}" ]; then
            echo "::warning::部署记录未创建（前置步骤失败），跳过状态更新。"
            exit 0
          fi
          if [ "$OUTCOME" = "success" ]; then
            state=success
            description="${RELEASE_TAG} 正式部署成功（镜像 tag ${IMAGE_TAG}）"
          else
            state=failure
            description="${RELEASE_TAG} 正式部署失败或未执行（$OUTCOME）"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" -F auto_inactive=false \
            -f state="$state" -f environment_url="$ORIGIN" -f description="$description" > /dev/null
          echo "部署记录已更新：${state}"

      - name: 同步宿主层物料（systemd 单元、CDN 镜像）并核对
        shell: bash
        env:
          CDN_MIRROR_ACCESS_KEY_ID: ${{ secrets.CDN_MIRROR_ACCESS_KEY_ID }}
          CDN_MIRROR_SECRET_ACCESS_KEY: ${{ secrets.CDN_MIRROR_SECRET_ACCESS_KEY }}
        run: |
          set -eu
          cfg="$RUNNER_TEMP/ssh/config"
          host_dir=/opt/yzgc/host-incoming-${GITHUB_RUN_ID}
          ssh -F "$cfg" yzgc-target "find /opt/yzgc -maxdepth 1 -name 'host-incoming-*' -mmin +1440 -exec rm -rf -- {} + ; rm -rf $host_dir && install -d -m 700 $host_dir"
          tar -C deploy/remote -cf - install-host.sh cdn-mirror.sh cdn-mirror.hosts systemd \
            | ssh -F "$cfg" yzgc-target "tar -C $host_dir -xf -"
          if [ -n "${CDN_MIRROR_ACCESS_KEY_ID:-}" ] && [ -n "${CDN_MIRROR_SECRET_ACCESS_KEY:-}" ]; then
            printf 'CDN_MIRROR_ACCESS_KEY_ID=%s\nCDN_MIRROR_SECRET_ACCESS_KEY=%s\n' "$CDN_MIRROR_ACCESS_KEY_ID" "$CDN_MIRROR_SECRET_ACCESS_KEY" \
              | ssh -F "$cfg" yzgc-target "bash $host_dir/install-host.sh apply --source $host_dir --mirror-env-stdin"
          else
            echo "::notice::环境里没有 CDN_MIRROR_ACCESS_KEY_ID / CDN_MIRROR_SECRET_ACCESS_KEY：沿用目标机上已有的镜像凭据"
            ssh -F "$cfg" yzgc-target "bash $host_dir/install-host.sh apply --source $host_dir"
          fi
          ssh -F "$cfg" yzgc-target "bash $host_dir/install-host.sh verify --source $host_dir && rm -rf $host_dir"

      - name: 输出入口与身份
        if: always()
        shell: bash
        run: |
          set -eu
          {
            echo "## 正式部署"
            echo ""
            echo "- 环境：production（GitHub Environment: production）"
            echo "- 发布 tag：\`${RELEASE_TAG}\`（版本锚点；hotfix #${HOTFIX_ISSUE}，原 tag 提交 ${BASE_COMMIT}）"
            echo "- 展示版本：\`${RELEASE_VERSION}\`"
            echo "- commit：\`${COMMIT}\`"
            echo "- 镜像：\`${IMAGE_REPOSITORY}/{server,web,forum}:${IMAGE_TAG}\`"
            echo "- compose 项目：\`${COMPOSE_PROJECT}\`"
            echo "- 栈根目录：\`${STACK_ROOT}\`"
            echo "- 入口：${ORIGIN}"
            echo ""
            echo "回滚：\`deploy/remote/rollback-stack.sh\`（把 IMAGE_TAG 切回更早的正式 tag 的镜像 → compose up -d）；tag 本身不移动、不删除。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "正式入口：${ORIGIN}"

  # 发版烟测：部署成功后按 deploy/parity/smoke.json 的 require 段核对线上（含内部赛事官网）。失败时这次运行变红，
  # 已经切换的栈不会被它回滚：按 docs/ops/DEPLOY.md 的回滚步骤处理。
  smoke:
    name: smoke (线上烟测)
    needs: [plan, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 检出本次部署的提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: 线上必须满足 require 段
        env:
          ORIGIN: ${{ needs.plan.outputs.origin }}
        run: |
          set -eu
          for attempt in 1 2 3 4 5 6; do
            if node scripts/parity.mjs smoke --origin "$ORIGIN" --env production; then exit 0; fi
            echo "第 $attempt 次未通过，30 秒后重试" >&2
            sleep 30
          done
          exit 1
