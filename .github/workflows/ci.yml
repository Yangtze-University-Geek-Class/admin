# geek_main 持续集成（CI）
#
# 边界声明：
#   * 只做机器验证——隔离安装、静态检查、测试、构建、镜像构建、环境契约、工作流自检、分支不变量。
#   * 机器 PASS 不等于人工试用；它不构成任何发版授权或验收记录。
#   * 不部署任何环境（既不碰 prev.yangtzeu.work，也不碰 yangtzeu.work）：push stage / main 只跑本工作流。
#     发版只由发布 tag 触发（vX.Y.Z-rc.N → deploy-preview.yml，vX.Y.Z → deploy-production.yml）。
#   * 不创建/移动/删除 tag，不修改版本号，不写 approved 之类的放行状态。
#   * 不挂载任何 secrets；顶层权限仅 contents: read；不使用 pull_request_target。
#   * 不使用 continue-on-error 掩盖失败。
#
# 分支模型：长期分支只有 main（正式）与 stage（预发布）；task/<issue>/<slug> 从 stage 拉出、
# PR 回 stage、合并后删除；dev/<username> 是个人分支，只验证、不部署，也不能作为进入 stage 的凭据。
# 分支名不用 -，只用 / 分层（见 docs/conventions/BRANCHING.md）。
# 硬不变量由 branch-guard 强制（scripts/check-branch-invariants.mjs）。
#
# 触发：pull_request → main/stage；push → main/stage/task/**(任务分支)/dev/**(个人分支)；手工 dispatch。
# push 只写了 branches、没写 tags：推送 tag 不会触发 CI（GitHub 对未声明的 ref 类型不运行）。
#
# 运行位置：每个 job 的 runs-on 读仓库变量 CI_RUNNER（自托管 runner 的标签 yzgc-arch），
# 没设这个变量时回到 ubuntu-latest。私有仓库的托管 runner 额度用完后靠它继续跑；
# runner 在哪、怎么隔离、怎么切回，见 docs/ops/CICD.md「自托管 runner」。
#
# 下载源（#104）：仓库变量 NPM_REGISTRY、DEBIAN_MIRROR、BETTER_SQLITE3_BINARY_HOST 给家里的 runner 换国内镜像，
# 没设时一律回到官方源。装依赖的 job 用 npm_config_registry（npm、pnpm 9）/ pnpm_config_registry（pnpm 11）/
# npm_config_better_sqlite3_binary_host（prebuild-install），docker job 以同名 build arg 传给 Dockerfile。
# 锁文件 integrity、corepack 签名、apt 签名照常核对；各项的信任依据见 docs/ops/CICD.md「构建下载源」。

name: CI

on:
  pull_request:
    branches: [main, stage]
  push:
    branches: [main, stage, 'task/**', 'dev/**']
  workflow_dispatch:

# 最小权限：只读仓库内容。任何需要写权限的动作（tag、release、部署）都不属于本工作流。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 只对 pull_request 取消旧运行（PR 会频繁 force-push）。
  # push 到长期分支的运行必须跑完，否则主线提交会缺少验证证据。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 显式声明 CI，供 core 及其余 job 的脚本使用（部分工具据此关闭交互与进度动画）。
  CI: 'true'

jobs:
  # 分支不变量：stage 必须包含 main，main 不得领先 stage。
  # 长期分支命名违规只告警（硬失败只针对上面两条不变量），见脚本内的分级说明。
  branch-guard:
    name: branch-guard (main/stage 不变量)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: 检出代码（取全部远端分支，不保留凭据）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 判定不变量需要 origin/main 与 origin/stage 两个远端 ref，浅克隆拿不到。
          fetch-depth: 0
          persist-credentials: false

      - name: 判定分支不变量
        shell: bash
        run: node scripts/check-branch-invariants.mjs --require-remote-refs

      # 执行记录（docs/conventions/NOTES.md）：task 分支进 stage 的 PR 必须新增引用本 issue 的 notes/ 记录。
      # 分支名经环境变量传入，不直接拼进脚本。
      - name: 执行记录（notes/）
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'task/')
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/note.mjs check --pr --base "origin/${BASE_REF}" --head "${HEAD_REF}"

      # 文档跟着模块改（docs/README.md「文档跟着模块改」）：按 PR 核对，merge-base 以来动了模块路径就必须也动对应的文档路径，
      # 并在 merge-base 上按第一父链的时间核对一次。core 的 pnpm check 在 PR 的合并提交上按第一父链的时间核对，两处互为兜底。
      # 前面的执行记录检查没过也照样跑，一次把要补的都列出来。
      - name: 文档跟着模块改（本 PR 的改动）
        if: ${{ !cancelled() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'task/') }}
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        # --head 给出 task 分支名：检出的是合并提交，没有分支名，要靠它找到这个 task 自己的执行记录（文档核对）。
        run: node scripts/check-doc-sync.mjs --base "origin/${BASE_REF}" --head "${HEAD_REF}"

      # 全部链路的一览表贴进运行摘要：stage、main 上随时能看到每个人的链路（入口 notes/INDEX.md）。
      - name: 执行记录一览（运行摘要）
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/note.mjs index --summary >> "$GITHUB_STEP_SUMMARY"

  # 核心工具链：Node 22（.nvmrc）+ pnpm 9.15.9（根 package.json packageManager）。
  core:
    name: core (Node 22 / pnpm 9)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      # pnpm/action-setup 用 npm ci 装引导版 pnpm（按它自带的锁文件核对 integrity），pnpm 9 装依赖（按本仓锁文件核对）。
      # 故意不设 pnpm_config_registry：引导版 pnpm 11 再用 self-update 换成 9.15.9，这一步没有锁文件，
      # 只能信源给的 integrity，所以留在官方源。
      npm_config_registry: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
      npm_config_better_sqlite3_binary_host: ${{ vars.BETTER_SQLITE3_BINARY_HOST || '' }}
    steps:
      - name: 检出代码（完整历史）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pnpm check 里的 check:doc-sync 按提交时间比较模块与文档，浅克隆看不到历史会直接失败。
          fetch-depth: 0
          # 不把 GITHUB_TOKEN 写进 .git/config：本 job 只读代码，不做任何 Git 写操作。
          persist-credentials: false

      # prebuild-install 不核对 better-sqlite3 预编译包的哈希，传输途中不被换包只能靠 https（#104）。
      # 在任何下载之前按与 app/server/Dockerfile 构建阶段相同的 case 核对地址：空 = GitHub releases；
      # tests/tooling/build-mirrors.test.ts 核对三处 job 与 Dockerfile 一致，并实跑这一步。
      - name: 核对 better-sqlite3 预编译包地址
        shell: bash
        run: |
          BETTER_SQLITE3_BINARY_HOST=$npm_config_better_sqlite3_binary_host
          if [ -n "$BETTER_SQLITE3_BINARY_HOST" ]; then
            case "$BETTER_SQLITE3_BINARY_HOST" in https://*[!/]) ;; *) echo "BETTER_SQLITE3_BINARY_HOST 必须是不带结尾 / 的 https:// 地址：${BETTER_SQLITE3_BINARY_HOST}" >&2; exit 1 ;; esac
            case "$BETTER_SQLITE3_BINARY_HOST" in *[!0-9A-Za-z.:/_-]*) echo "BETTER_SQLITE3_BINARY_HOST 含有不允许的字符：${BETTER_SQLITE3_BINARY_HOST}" >&2; exit 1 ;; esac
          fi
          echo "better-sqlite3 预编译包：${BETTER_SQLITE3_BINARY_HOST:-GitHub releases}"

      # pnpm 必须先于 setup-node 安装：setup-node 的 pnpm 缓存需要调用 pnpm 解析 store 路径。
      # 不传 version，由根 package.json 的 packageManager (pnpm@9.15.9) 决定，避免两处版本漂移。
      - name: 安装 pnpm（读取根 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 依赖安装（锁文件不可变）
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: 静态检查（pnpm check）
        shell: bash
        run: pnpm check

      - name: 单元测试（pnpm test）
        shell: bash
        run: pnpm test

      - name: 构建（pnpm build）
        shell: bash
        run: pnpm build

  # 论坛工具链：app/forum 是独立上游仓，锁文件、Node 与包管理器都与核心不同，
  # 必须单独安装、单独运行，禁止让一套 Node 去跑另一套 ABI 的原生依赖。
  forum:
    name: forum (Node 26 / pnpm 11.24.0)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      NUXT_TELEMETRY_DISABLED: '1'
      # 上游锁定版本；同时用于 npm pack 的包名和安装后的断言。
      FORUM_PNPM_VERSION: '11.24.0'
      # pnpm-11.24.0.tgz 的 sha512，取自官方源（npm view pnpm@11.24.0 dist.integrity --registry https://registry.npmjs.org）。
      # npm pack 只拿同一个源给的 integrity 核对，源换成镜像后要靠这个写死的值；与 app/forum/Dockerfile 相同，
      # tests/tooling/build-mirrors.test.ts 核对两处一致。
      FORUM_PNPM_INTEGRITY: 'sha512-vSfjRel23LC+C3oSKCF7BJqBfiGx81XJDb59xGZxiVqLwebQbCRVRQXqk+oLRfSJon7Bv7yN5qlln8oPFvoAAA=='
      # npm pack 读 npm_config_registry；论坛的 pnpm 11 只认 pnpm_config_registry（scripts/forum.mjs 原样转给它），
      # 装依赖时按 app/forum/pnpm-lock.yaml 的 integrity 核对。
      npm_config_registry: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
      pnpm_config_registry: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Node 26（论坛独立运行时）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # app/forum/package.json 要求 engines.node >=26。
          node-version: '26'
          # 根 packageManager 是 pnpm 而非 npm，这里显式关掉 setup-node 的自动包管理器缓存，
          # 论坛 store 由下面的 actions/cache 单独管理，避免误用核心工具链的缓存。
          package-manager-cache: false

      - name: 安装 pnpm 11.24.0 到 .tools/pnpm11
        shell: bash
        run: |
          set -u
          tmp="$(mktemp -d)"
          # npm pack 从 registry 下载并按 integrity 校验 tarball，源可能是镜像，再按写死的 FORUM_PNPM_INTEGRITY 核对一次；
          # 解包后得到 .tools/pnpm11/package/bin/pnpm.cjs，与本机开发布局一致，
          # 这样 scripts/forum.mjs 的默认 FORUM_PNPM 路径无需改动。
          npm pack "pnpm@${FORUM_PNPM_VERSION}" --pack-destination "$tmp"
          node -e 'const [file, want] = process.argv.slice(1); const got = "sha512-" + require("node:crypto").createHash("sha512").update(require("node:fs").readFileSync(file)).digest("base64"); if (got !== want) { console.error(file + " 的 sha512 不符：期望 " + want + "，实际 " + got); process.exit(1); } console.log(file + " 的 sha512 核对通过");' \
            "${tmp}/pnpm-${FORUM_PNPM_VERSION}.tgz" "$FORUM_PNPM_INTEGRITY"
          rm -rf .tools/pnpm11
          mkdir -p .tools/pnpm11
          tar -xzf "${tmp}/pnpm-${FORUM_PNPM_VERSION}.tgz" -C .tools/pnpm11
          rm -rf "$tmp"

      - name: 断言论坛工具链版本并锁定 FORUM_NODE
        shell: bash
        run: |
          set -u
          # 必须在 app/forum 目录内调用 pnpm.cjs：pnpm 10+ 的启动器会按「最近的 package.json
          # 的 packageManager 字段」自适应版本。仓库根声明的是 pnpm@9.15.9，在根目录运行这个
          # 启动器会解析成 9.15.9（全新 runner 上还会先去下载 pnpm 9），断言必然失败；
          # 只有在 app/forum 内才会解析成上游锁定的 11.24.0。
          actual="$(cd app/forum && node ../../.tools/pnpm11/package/bin/pnpm.cjs --version)"
          if [ "$actual" != "$FORUM_PNPM_VERSION" ]; then
            echo "论坛包管理器版本不符：期望 ${FORUM_PNPM_VERSION}，实际 ${actual}" >&2
            exit 1
          fi
          # scripts/forum.mjs 会逐个探测候选 Node 并要求主版本 >=26；
          # 这里显式指向 setup-node 装好的那一个，不依赖探测顺序。
          echo "FORUM_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "forum node: $(node --version); forum pnpm: ${actual}"

      - name: 解析论坛 pnpm store 路径
        id: forum-store
        shell: bash
        run: |
          set -u
          # 必须在 app/forum 内解析：store 位置受该目录的 pnpm 配置影响，
          # 且 pnpm.cjs 的版本自适应同样按最近的 packageManager 字段决定（同上一步的原因）。
          store="$(cd app/forum && node ../../.tools/pnpm11/package/bin/pnpm.cjs store path)"
          echo "path=${store}" >> "$GITHUB_OUTPUT"
          echo "forum pnpm store: ${store}"

      - name: 缓存论坛 pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.forum-store.outputs.path }}
          key: forum-pnpm-store-${{ runner.os }}-${{ hashFiles('app/forum/pnpm-lock.yaml') }}
          # 只缓存包内容寻址的 store，不缓存 node_modules；
          # 命中与否都不改变 --frozen-lockfile 的安装结果。
          restore-keys: |
            forum-pnpm-store-${{ runner.os }}-

      - name: 论坛依赖安装（frozen-lockfile）
        shell: bash
        run: node scripts/forum.mjs install

      - name: 论坛检查（强制 demo 种子）
        shell: bash
        # forum.mjs 会先跑 scripts/check-forum-adoption.mjs 核对上游来源，
        # 并强制 GEEK_FORUM_SOURCE=demo：CI 永远不接触本地私有快照或真实数据。
        run: node scripts/forum.mjs check

      - name: 论坛静态生成（强制 demo 种子）
        shell: bash
        run: node scripts/forum.mjs generate

  # 环境契约：deploy/env/.env.<environment> ↔ deploy/environments.json ↔ deploy/compose/*.yml。
  # 这一条是部署前的硬门禁——两套栈的端口、目录、域名、密钥留空状态不许静默漂移。
  env-contract:
    name: env-contract (.env ↔ environments.json ↔ compose)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      # 只给 pnpm/action-setup 的 npm ci 换源（按它自带的锁文件核对）；pnpm_config_registry 不设的原因见 core job。
      npm_config_registry: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm（读取根 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # 本 job 不需要依赖，只跑仓库自带的 Node 脚本。
          package-manager-cache: false

      - name: 校验环境契约（模板 ↔ 契约 ↔ compose ↔ 远端脚本）
        shell: bash
        run: pnpm check:environments

      - name: 前端站点配置不含域名（每个环境一个 origin，管理端按路径区分）
        shell: bash
        run: pnpm check:site-config

      - name: 密钥门禁（模板 env 只允许留空密钥）
        shell: bash
        run: pnpm check:secrets

  # 镜像构建验证：三条 Dockerfile 各构建一次（只构建、不推送、不打 latest）。
  docker:
    name: docker (三条 Dockerfile 构建验证)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      # 以 build arg 传给 Dockerfile 的构建阶段（不进运行镜像）；没设仓库变量时就是 Dockerfile 里的官方默认值。
      NPM_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
      DEBIAN_MIRROR: ${{ vars.DEBIAN_MIRROR || '' }}
      BETTER_SQLITE3_BINARY_HOST: ${{ vars.BETTER_SQLITE3_BINARY_HOST || '' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 解析提交态的发布身份
        shell: bash
        # CI 只验证「能不能用提交态的正式身份构建」，不代表发版；镜像 tag 用 SHA 前 12 位，不用 latest。
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          {
            echo "GEEK_RELEASE_VERSION=${version}"
            echo "GEEK_RELEASE_COMMIT=${GITHUB_SHA}"
            echo "IMAGE_TAG=${GITHUB_SHA:0:12}"
          } >> "$GITHUB_ENV"
          echo "构建身份：version=${version} commit=${GITHUB_SHA} tag=${GITHUB_SHA:0:12}（按正式身份构建，镜像仓库 yzgc-production/）"

      - name: 解析两套 compose（与各自 env 文件配对）
        shell: bash
        # 只解析不启动：证明 compose 文件在真实 env 值下语法与变量引用都成立；
        # 再用同一个 IMAGE_TAG 解析两套镜像引用，必须互不相同（两套栈共用目标机的 Docker 守护进程）。
        run: |
          set -eu
          for environment in production preview; do
            docker compose --env-file "deploy/env/.env.${environment}" -f "deploy/compose/${environment}.yml" config --quiet
            IMAGE_TAG="$IMAGE_TAG" docker compose --env-file "deploy/env/.env.${environment}" -f "deploy/compose/${environment}.yml" \
              config --images | sort -u > "${RUNNER_TEMP}/images-${environment}.txt"
            echo "deploy/compose/${environment}.yml 解析通过：$(tr '\n' ' ' < "${RUNNER_TEMP}/images-${environment}.txt")"
          done
          shared="$(comm -12 "${RUNNER_TEMP}/images-production.txt" "${RUNNER_TEMP}/images-preview.txt")"
          if [ -n "$shared" ]; then
            echo "两套 compose 在同一提交上解析出相同的镜像引用：${shared}" >&2
            exit 1
          fi

      - name: 构建 server 镜像
        shell: bash
        run: |
          set -eu
          docker build \
            --file app/server/Dockerfile \
            --build-arg GEEK_DEPLOYMENT_ENVIRONMENT=production \
            --build-arg GEEK_RELEASE_VERSION="$GEEK_RELEASE_VERSION" \
            --build-arg GEEK_RELEASE_COMMIT="$GEEK_RELEASE_COMMIT" \
            --build-arg NPM_REGISTRY="$NPM_REGISTRY" \
            --build-arg DEBIAN_MIRROR="$DEBIAN_MIRROR" \
            --build-arg BETTER_SQLITE3_BINARY_HOST="$BETTER_SQLITE3_BINARY_HOST" \
            --tag "yzgc-production/server:$IMAGE_TAG" .

      - name: 构建 web 镜像
        shell: bash
        run: |
          set -eu
          docker build \
            --file app/web/Dockerfile \
            --build-arg GEEK_DEPLOYMENT_ENVIRONMENT=production \
            --build-arg GEEK_RELEASE_VERSION="$GEEK_RELEASE_VERSION" \
            --build-arg GEEK_RELEASE_COMMIT="$GEEK_RELEASE_COMMIT" \
            --build-arg NPM_REGISTRY="$NPM_REGISTRY" \
            --tag "yzgc-production/web:$IMAGE_TAG" .

      - name: 构建 forum 镜像
        shell: bash
        run: |
          set -eu
          docker build \
            --file app/forum/Dockerfile \
            --build-arg GEEK_DEPLOYMENT_ENVIRONMENT=production \
            --build-arg GEEK_RELEASE_VERSION="$GEEK_RELEASE_VERSION" \
            --build-arg GEEK_RELEASE_COMMIT="$GEEK_RELEASE_COMMIT" \
            --build-arg NPM_REGISTRY="$NPM_REGISTRY" \
            --tag "yzgc-production/forum:$IMAGE_TAG" .

      - name: 断言三个镜像都有健康检查与非 root 运行身份
        shell: bash
        run: |
          set -eu
          for service in server web forum; do
            image="yzgc-production/${service}:${IMAGE_TAG}"
            docker image inspect "$image" --format '{{.Config.Healthcheck.Test}}' | grep -q . \
              || { echo "${image} 缺少健康检查" >&2; exit 1; }
            user="$(docker image inspect "$image" --format '{{.Config.User}}')"
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "${image} 必须以非 root 用户运行（当前：${user:-未设置}）" >&2
              exit 1
            fi
            echo "${image} 构建成功：healthcheck=有，user=${user}"
          done

  # 汇总 job：给 branch protection 用的单一 required check 名称。
  # if: always() 是必须的——若上游 job 被跳过或取消，required check 不能因“没跑”而算通过。
  # 必须把 lint-workflows 也纳入 needs 与汇总条件：否则工作流自身的静态错误虽然让
  # lint-workflows 变红，却不会让唯一的 required check 变红，等于没有强制力。
  # 它只汇总机器结果，不代表人工验收，也不授权任何部署。
  verify:
    name: verify (required check)
    needs: [branch-guard, core, forum, env-contract, docker, lint-workflows]
    if: always()
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: 汇总上游 job 结果
        shell: bash
        env:
          BRANCH_GUARD_RESULT: ${{ needs.branch-guard.result }}
          CORE_RESULT: ${{ needs.core.result }}
          FORUM_RESULT: ${{ needs.forum.result }}
          ENV_CONTRACT_RESULT: ${{ needs.env-contract.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          LINT_WORKFLOWS_RESULT: ${{ needs.lint-workflows.result }}
        run: |
          set -u
          echo "branch-guard=${BRANCH_GUARD_RESULT} core=${CORE_RESULT} forum=${FORUM_RESULT} env-contract=${ENV_CONTRACT_RESULT} docker=${DOCKER_RESULT} lint-workflows=${LINT_WORKFLOWS_RESULT}"
          if [ "$BRANCH_GUARD_RESULT" != "success" ] || [ "$CORE_RESULT" != "success" ] \
             || [ "$FORUM_RESULT" != "success" ] || [ "$ENV_CONTRACT_RESULT" != "success" ] \
             || [ "$DOCKER_RESULT" != "success" ] || [ "$LINT_WORKFLOWS_RESULT" != "success" ]; then
            echo "机器验证未通过：failure / cancelled / skipped 一律视为失败。" >&2
            exit 1
          fi
          echo "机器验证通过。这是自动化结论，不等于人工试用，也不是发版授权。"

  # 工作流自检：把 CI 配置本身也纳入验证，避免 YAML/表达式/shell 错误只能靠线上试错发现。
  lint-workflows:
    name: lint-workflows (actionlint)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      # 固定版本 + 固定 SHA-256。选择“直接下载二进制并核对内联摘要”而不是
      # docker run rhysd/actionlint:<tag>：镜像 tag 可变，而这里的摘要一旦改动就必须走代码评审。
      ACTIONLINT_VERSION: '1.7.12'
      # actionlint_1.7.12_linux_amd64.tar.gz 的 SHA-256，取自上游 checksums.txt 并在本机复核过。
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 下载并校验 actionlint
        shell: bash
        run: |
          set -u
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o actionlint.tar.gz "$url"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          mkdir -p .tools/actionlint
          tar -xzf actionlint.tar.gz -C .tools/actionlint actionlint
          chmod +x .tools/actionlint/actionlint
          rm -f actionlint.tar.gz
          .tools/actionlint/actionlint --version

      - name: 检查 .github/workflows 下的全部工作流
        shell: bash
        # ubuntu-latest 与自托管 runner 的容器都装了 shellcheck，actionlint 会顺带检查每个 run 块的 shell 代码。
        run: .tools/actionlint/actionlint -no-color -oneline .github/workflows/*.yml
