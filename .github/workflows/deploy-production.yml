# 正式部署（vX.Y.Z → production）
#
# 触发：推送正式 tag vX.Y.Z（提交必须在 main 上），或手工 dispatch：「Use workflow from」选这个 tag，
# 并在 tag 输入框里再填同一个 tag。push stage / main 不再部署。
# plan job 硬断言触发 ref 就是 refs/tags/<正式 tag>；rc tag、分支、格式不对的 tag 一律拒绝。
# 前置证据（evidence job，任一缺失即失败关闭）：
#   1. 同一提交上有 vX.Y.Z-rc.N（同一个 X.Y.Z）；
#   2. 该提交在 preview 环境有**成功**的部署记录，且记录来自这些 rc tag 之一；
#   3. https://prev.yangtzeu.work/release.json 当前就是这个提交与这个 rc 版本。
# 开关：仓库级 vars.DEPLOY_PRODUCTION_ENABLED 必须显式等于 enabled，未设置 = 不部署。
#
# 边界：
#   * 本工作流不创建、不移动、不删除 tag；正式 tag 由所有者在预发布验收并授权后手工打。
#   * 部署用环境级 secrets（GitHub Environment `production`，应配置人工审批），与 PR 构建、预发布完全隔离。
#   * 正式部署不设 cancel-in-progress：已经开始的上线必须跑完或明确失败，不允许被后来的 tag 静默取消。

name: Deploy Production

on:
  push:
    # GitHub 的过滤模式匹配整个 tag 名：`v[0-9]+.[0-9]+.[0-9]+` 不含 -，所以 vX.Y.Z-rc.N 不会触发本工作流；
    # plan job 再用正则硬断言一次。
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: '正式 tag（vX.Y.Z），必须与「Use workflow from」选中的 tag 相同'
        required: true
        type: string

# 默认最小权限：只读仓库内容。读 deployments 与写 deployments 的权限按 job 单独声明。
permissions:
  contents: read

concurrency:
  group: deploy-production
  # 正式环境串行但不取消：正在跑的部署必须收敛成成功或失败，留下完整记录。
  cancel-in-progress: false

jobs:
  # 规划：硬断言触发来源是正式 tag → 解析发布身份。
  plan:
    name: plan (正式 tag → production 身份)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      preview_tags: ${{ steps.identity.outputs.preview_tags }}
      commit: ${{ steps.identity.outputs.commit }}
      image_tag: ${{ steps.identity.outputs.image_tag }}
      release_version: ${{ steps.identity.outputs.release_version }}
      origin: ${{ steps.identity.outputs.origin }}
      stack_root: ${{ steps.identity.outputs.stack_root }}
      incoming_dir: ${{ steps.identity.outputs.incoming_dir }}
      runtime_env_file: ${{ steps.identity.outputs.runtime_env_file }}
      images_archive: ${{ steps.identity.outputs.images_archive }}
      compose_project: ${{ steps.identity.outputs.compose_project }}
    steps:
      - name: 硬断言触发来源是正式 tag
        id: source
        shell: bash
        # 只有 vX.Y.Z 能进正式环境：rc tag、分支、格式不对的 tag 一概拒绝，没有回落路径。
        # 手工触发时输入的 tag 必须就是运行所在的 ref，工作流定义与被部署的代码来自同一个 tag。
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          case "${GITHUB_EVENT_NAME}" in
            push) tag="${GITHUB_REF_NAME}" ;;
            workflow_dispatch) tag="${INPUT_TAG}" ;;
            *) echo "不支持的触发事件：${GITHUB_EVENT_NAME}" >&2; exit 1 ;;
          esac
          final_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          case "$tag" in
            *-*) echo "正式部署不接受预发布 tag 或任何带 - 的 tag：收到 '${tag}'" >&2; exit 1 ;;
          esac
          if ! [[ "$tag" =~ $final_re ]]; then
            echo "正式发布只接受 vX.Y.Z（不带前导 0，不带任何后缀）：收到 '${tag}'" >&2
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/tags/${tag}" ]; then
            echo "本工作流只接受 refs/tags/${tag}（当前：${GITHUB_REF}，事件：${GITHUB_EVENT_NAME}）。手工触发时「Use workflow from」必须选同一个 tag。" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "触发来源确认：${GITHUB_REF}（事件 ${GITHUB_EVENT_NAME}）"

      - name: 检出发布 tag（取全部分支与 tag，不保留凭据）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.source.outputs.tag }}
          # 判定「提交在 main 上」需要 origin/main，找同一提交上的 rc tag 需要全部 tag，浅克隆拿不到。
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 规划发布身份（tag 模型）
        id: identity
        shell: bash
        # release-policy 校验：tag 指向检出的提交、X.Y.Z 等于该提交 package.json 的 version、
        # 提交在 origin/main 的历史里、同一提交上已有 vX.Y.Z-rc.N。正式环境禁止版本后缀。
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -eu
          commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$(git rev-parse HEAD)" != "$commit" ]; then
            echo "检出的 HEAD 不是 ${RELEASE_TAG} 指向的提交 ${commit}：拒绝规划。" >&2
            exit 1
          fi
          node scripts/release-policy.mjs plan --tag "$RELEASE_TAG" --commit "$commit" \
            --branch-ref refs/remotes/origin/main --require-tag > "$RUNNER_TEMP/plan.json"
          {
            echo "version=$(jq -r '.version' "$RUNNER_TEMP/plan.json")"
            echo "preview_tags=$(jq -r '.previewTags | join(" ")' "$RUNNER_TEMP/plan.json")"
            echo "commit=$(jq -r '.commit' "$RUNNER_TEMP/plan.json")"
            echo "image_tag=$(jq -r '.imageTag' "$RUNNER_TEMP/plan.json")"
            echo "release_version=$(jq -r '.releaseVersion' "$RUNNER_TEMP/plan.json")"
            echo "origin=$(jq -r '.origin' "$RUNNER_TEMP/plan.json")"
            echo "stack_root=$(jq -r '.stackRoot' "$RUNNER_TEMP/plan.json")"
            echo "incoming_dir=$(jq -r '.incomingDir' "$RUNNER_TEMP/plan.json")"
            echo "runtime_env_file=$(jq -r '.runtimeEnvFile' "$RUNNER_TEMP/plan.json")"
            echo "images_archive=$(jq -r '.imagesArchive' "$RUNNER_TEMP/plan.json")"
            echo "compose_project=$(jq -r '.composeProject' "$RUNNER_TEMP/plan.json")"
          } >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/plan.json"
          release_version="$(jq -r '.releaseVersion' "$RUNNER_TEMP/plan.json")"
          if [ "v${release_version}" != "$RELEASE_TAG" ]; then
            echo "正式发布版本必须就是 tag 去掉 v（不允许 @ 或 -rc 后缀）：tag ${RELEASE_TAG}，版本 ${release_version}" >&2
            exit 1
          fi

      - name: 校验环境契约（部署事实来源不许漂移）
        shell: bash
        run: node scripts/deployment-environment.mjs --check

  # 证据：同一提交必须先以 vX.Y.Z-rc.N 成功部署到预发布，且预发布站点现在跑的就是它。没有证据就不上线（失败关闭）。
  evidence:
    name: evidence (同提交已有成功的 rc 预发布部署)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      PREVIEW_TAGS: ${{ needs.plan.outputs.preview_tags }}
    steps:
      - name: 核对同一提交上的预发布 tag
        shell: bash
        # plan 已在本地 Git 里找过一次；这里把结果再核对一遍格式，后面两步只认这些 tag。
        run: |
          set -eu
          if [ -z "$PREVIEW_TAGS" ]; then
            echo "提交 ${COMMIT} 上没有 v${VERSION}-rc.N：正式版只能发在已经发过预发布的同一提交上。" >&2
            exit 1
          fi
          for tag in $PREVIEW_TAGS; do
            case "$tag" in
              "v${VERSION}-rc."[1-9]*) echo "同一提交上的预发布 tag：${tag}" ;;
              *) echo "预发布 tag 列表里出现了不属于 v${VERSION} 的条目：${tag}" >&2; exit 1 ;;
            esac
          done

      - name: 查询 preview 环境的部署记录
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # 只认「同一提交 + payload.tag 是上一步列出的 rc tag + 最新状态为 success」的部署记录；
        # 分支时代留下的、没有 tag 的旧记录不算数。
        run: |
          set -eu
          deployments="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=preview&sha=${COMMIT}&per_page=100" --paginate \
            --jq '.[] | "\(.id)\t\(.payload.tag // "")"')"
          if [ -z "$deployments" ]; then
            echo "没有找到提交 ${COMMIT} 在 preview 环境的任何部署记录；正式上线必须先经过预发布。" >&2
            exit 1
          fi
          verified=""
          while IFS="$(printf '\t')" read -r deployment tag; do
            [ -n "$deployment" ] || continue
            case " ${PREVIEW_TAGS} " in
              *" ${tag} "*) ;;
              *) echo "preview deployment ${deployment}：tag '${tag:-无}' 不是 ${PREVIEW_TAGS} 之一，跳过"; continue ;;
            esac
            state="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment}/statuses?per_page=1" --jq '.[0].state')"
            echo "preview deployment ${deployment}（${tag}）：${state:-无状态}"
            if [ "$state" = "success" ]; then
              verified="${deployment}（${tag}）"
            fi
          done <<< "$deployments"
          if [ -z "$verified" ]; then
            echo "提交 ${COMMIT} 没有来自 ${PREVIEW_TAGS} 的成功预发布部署：拒绝进入正式环境。" >&2
            exit 1
          fi
          echo "证据成立：${COMMIT} 已以 ${verified} 在 preview 环境部署成功。"

      - name: 核对预发布站点当前就是该提交
        shell: bash
        env:
          PREVIEW_ORIGIN: https://prev.yangtzeu.work
        # 部署记录可能是上一轮留下的：再直接读预发布站点的 release.json，
        # 确认线上跑的就是这个提交与它的某个 rc 版本（避免「上一个预发布通过」被推广到未经试用的新代码）。
        run: |
          set -eu
          body="$(curl -fsS --max-time 20 --retry 3 --retry-all-errors "${PREVIEW_ORIGIN}/release.json")"
          echo "预发布 release.json：${body}"
          short="${COMMIT:0:12}"
          expected=""
          for tag in $PREVIEW_TAGS; do
            expected="${expected}${expected:+,}${tag#v}@${short}"
          done
          echo "$body" | jq -e --arg commit "$COMMIT" --arg expected "$expected" \
            '.environment == "preview" and .commit == $commit and (.version as $v | ($expected | split(",")) | index($v) != null)' > /dev/null \
            || { echo "预发布站点当前不是提交 ${COMMIT} 的 rc 版本（期望其一：${expected}）：拒绝进入正式环境。" >&2; exit 1; }
          echo "证据成立：${PREVIEW_ORIGIN}/release.json 是提交 ${COMMIT} 的预发布版本。"

  # 构建：与预发布同构，但按正式身份（无 @ 后缀）构建。
  build:
    name: build (镜像归档)
    needs: [plan, evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出 plan 核对过的提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 用 plan 输出的完整 SHA，而不是再按 tag 名解析一次：tag 在两次检出之间被改动也构建不到别的代码。
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: 安装 pnpm（读取根 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 依赖安装（锁文件不可变）
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: 构建（提交态 = production 值）
        shell: bash
        env:
          GEEK_DEPLOYMENT_ENVIRONMENT: production
          GEEK_RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
          GEEK_RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: pnpm build

      - name: 构建三个镜像（tag = SHA 前 12 位）
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          GEEK_RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
          GEEK_RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -eu
          for service in server web forum; do
            docker build \
              --file "app/${service}/Dockerfile" \
              --build-arg GEEK_DEPLOYMENT_ENVIRONMENT=production \
              --build-arg GEEK_RELEASE_VERSION="$GEEK_RELEASE_VERSION" \
              --build-arg GEEK_RELEASE_COMMIT="$GEEK_RELEASE_COMMIT" \
              --tag "yzgc/${service}:${IMAGE_TAG}" .
          done
          docker image list --format '{{.Repository}}:{{.Tag}}' | grep '^yzgc/'

      - name: 打包镜像归档与校验和
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          IMAGES_ARCHIVE: ${{ needs.plan.outputs.images_archive }}
        run: |
          set -eu
          out="${RUNNER_TEMP}/bundle"
          mkdir -p "$out"
          docker save "yzgc/server:${IMAGE_TAG}" "yzgc/web:${IMAGE_TAG}" "yzgc/forum:${IMAGE_TAG}" \
            | gzip -9 > "${out}/${IMAGES_ARCHIVE}"
          ( cd "$out" && sha256sum "${IMAGES_ARCHIVE}" > "${IMAGES_ARCHIVE}.sha256" )
          ls -lh "$out"
          cat "${out}/${IMAGES_ARCHIVE}.sha256"

      - name: 上传镜像归档（保留 30 天，供回滚与审计）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yzgc-images-production-${{ needs.plan.outputs.image_tag }}
          path: |
            ${{ runner.temp }}/bundle/${{ needs.plan.outputs.images_archive }}
            ${{ runner.temp }}/bundle/${{ needs.plan.outputs.images_archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  # 部署：需要显式开关；GitHub Environment `production` 应配置人工审批（这是真正的放行点）。
  deploy:
    name: deploy (production stack)
    needs: [plan, build]
    if: vars.DEPLOY_PRODUCTION_ENABLED == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ needs.plan.outputs.origin }}
    permissions:
      contents: read
      deployments: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
      PREVIEW_TAGS: ${{ needs.plan.outputs.preview_tags }}
      IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      STACK_ROOT: ${{ needs.plan.outputs.stack_root }}
      INCOMING_DIR: ${{ needs.plan.outputs.incoming_dir }}
      RUNTIME_ENV_FILE: ${{ needs.plan.outputs.runtime_env_file }}
      IMAGES_ARCHIVE: ${{ needs.plan.outputs.images_archive }}
      ORIGIN: ${{ needs.plan.outputs.origin }}
      COMPOSE_PROJECT: ${{ needs.plan.outputs.compose_project }}
    steps:
      - name: 校验 production 环境保护（人工审批必须真实存在）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # 不信任「YAML 里写了 environment: production」这一行：直接读 REST 的环境配置，
        # 没有 required reviewers 就拒绝上线（详见 docs/ops/CICD.md 的证据链一节）。
        run: |
          set -eu
          if ! environment="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production" 2>/dev/null)"; then
            echo "读不到 GitHub Environment 'production'（可能尚未创建，或当前计划不支持环境保护）：拒绝上线。" >&2
            exit 1
          fi
          reviewers="$(echo "$environment" | jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')"
          if [ "$reviewers" -lt 1 ]; then
            echo "Environment 'production' 没有 required reviewers 保护规则：人工审批无法生效，拒绝上线。" >&2
            echo "请在仓库 Settings → Environments → production 配置 required reviewers 后再打开部署开关。" >&2
            exit 1
          fi
          echo "production 环境保护确认：required reviewers 规则 ${reviewers} 条。"

      - name: 校验环境哨兵（防止仓库级变量静默回落）
        shell: bash
        # 环境级 vars 必须显式等于 production：任何回落（仓库级同名变量、空值）都拒绝部署。
        env:
          DEPLOY_TARGET_ENVIRONMENT: ${{ vars.DEPLOY_TARGET_ENVIRONMENT }}
        run: |
          set -eu
          if [ "${DEPLOY_TARGET_ENVIRONMENT}" != "production" ]; then
            echo "环境哨兵不匹配：GitHub Environment 'production' 的 DEPLOY_TARGET_ENVIRONMENT 必须是 production，实际 '${DEPLOY_TARGET_ENVIRONMENT}'" >&2
            exit 1
          fi
          echo "环境哨兵确认：production"

      - name: 检出 plan 核对过的提交（取部署物料：compose 与远端脚本）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 下载镜像归档
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yzgc-images-production-${{ needs.plan.outputs.image_tag }}
          path: ${{ runner.temp }}/bundle

      - name: 渲染运行时 env 文件（模板 + 环境级 secrets + IMAGE_TAG）
        shell: bash
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -eu
          node scripts/deployment-environment.mjs render \
            --environment production \
            --out "$RUNNER_TEMP/bundle/.env.production" \
            --image-tag "$IMAGE_TAG"

      - name: 准备 SSH（私钥与 known_hosts 只落在 runner 的临时目录）
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/id_deploy"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_deploy"
          chmod 644 "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH 物料就绪：私钥 $(wc -l < "$RUNNER_TEMP/ssh/id_deploy") 行，known_hosts $(wc -l < "$RUNNER_TEMP/ssh/known_hosts") 行"

      - name: 创建部署记录（in_progress）
        id: record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          deployment_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" \
            -f ref="$COMMIT" -f environment=production -f auto_inactive=false \
            -f description="${RELEASE_TAG} → production（镜像 tag ${IMAGE_TAG}，预发布 ${PREVIEW_TAGS}）" \
            -f "payload[tag]=${RELEASE_TAG}" -f "payload[release_version]=${RELEASE_VERSION}" \
            -f "payload[preview_tags]=${PREVIEW_TAGS}" -f "payload[image_tag]=${IMAGE_TAG}" \
            --jq '.id')"
          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            -f state=in_progress -f description="分发镜像与 env 文件到 ${STACK_ROOT}" > /dev/null
          echo "部署记录已创建：deployment ${deployment_id}（${COMMIT}）"

      - name: 分发镜像、env 文件与 compose 物料
        shell: bash
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -eu
          key="$RUNNER_TEMP/ssh/id_deploy"
          known="$RUNNER_TEMP/ssh/known_hosts"
          target="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh_options=(-i "$key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$known" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20)
          scp_options=(-i "$key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$known" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20)
          ssh "${ssh_options[@]}" -p "$DEPLOY_SSH_PORT" "$target" \
            "mkdir -p '$INCOMING_DIR' '$STACK_ROOT/deploy/compose' && chmod 700 '$INCOMING_DIR'"
          scp "${scp_options[@]}" -P "$DEPLOY_SSH_PORT" \
            "$RUNNER_TEMP/bundle/${IMAGES_ARCHIVE}" "$RUNNER_TEMP/bundle/${IMAGES_ARCHIVE}.sha256" \
            "$RUNNER_TEMP/bundle/.env.production" deploy/remote/deploy-stack.sh \
            "${target}:${INCOMING_DIR}/"
          scp "${scp_options[@]}" -P "$DEPLOY_SSH_PORT" \
            deploy/compose/production.yml deploy/compose/preview.yml \
            "${target}:${STACK_ROOT}/deploy/compose/"
          ssh "${ssh_options[@]}" -p "$DEPLOY_SSH_PORT" "$target" \
            "chmod 600 '${INCOMING_DIR}/.env.production' && ls -l '${INCOMING_DIR}' && sha256sum -c '${INCOMING_DIR}/${IMAGES_ARCHIVE}.sha256' --ignore-missing"

      - name: 执行远端部署（load 镜像 → compose up → 健康检查）
        id: deploy-stack
        shell: bash
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -eu
          target="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh -i "$RUNNER_TEMP/ssh/id_deploy" -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -p "$DEPLOY_SSH_PORT" "$target" \
            "bash '${INCOMING_DIR}/deploy-stack.sh' --environment production --stack-root '${STACK_ROOT}' \
              --image-tag '${IMAGE_TAG}' --incoming-dir '${INCOMING_DIR}' --env-file '${INCOMING_DIR}/.env.production'"

      - name: 记录部署结果
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.deploy-stack.outcome }}
          DEPLOYMENT_ID: ${{ steps.record.outputs.deployment_id }}
        run: |
          set -eu
          if [ -z "${DEPLOYMENT_ID:-}" ]; then
            echo "::warning::部署记录未创建（前置步骤失败），跳过状态更新。"
            exit 0
          fi
          if [ "$OUTCOME" = "success" ]; then
            state=success
            description="${RELEASE_TAG} 正式部署成功（镜像 tag ${IMAGE_TAG}）"
          else
            state=failure
            description="${RELEASE_TAG} 正式部署失败或未执行（$OUTCOME）"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="$state" -f environment_url="$ORIGIN" -f description="$description" > /dev/null
          echo "部署记录已更新：${state}"

      - name: 输出入口与身份
        if: always()
        shell: bash
        run: |
          set -eu
          {
            echo "## 正式部署"
            echo ""
            echo "- 环境：production（GitHub Environment: production）"
            echo "- 发布 tag：\`${RELEASE_TAG}\`（同一提交的预发布：${PREVIEW_TAGS}）"
            echo "- 展示版本：\`${RELEASE_VERSION}\`"
            echo "- commit：\`${COMMIT}\`"
            echo "- 镜像 tag：\`${IMAGE_TAG}\`"
            echo "- compose 项目：\`${COMPOSE_PROJECT}\`"
            echo "- 栈根目录：\`${STACK_ROOT}\`"
            echo "- 入口：${ORIGIN}"
            echo ""
            echo "回滚：\`deploy/remote/rollback-stack.sh\`（把 IMAGE_TAG 切回更早的正式 tag 的镜像 → compose up -d）；tag 本身不移动、不删除。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "正式入口：${ORIGIN}"
