# 预发布部署（vX.Y.Z-rc.N → preview）
#
# 触发：推送预发布 tag vX.Y.Z-rc.N（N 从 1 开始，提交必须在 stage 上），或手工 dispatch：
# 「Use workflow from」选这个 tag，并在 tag 输入框里再填同一个 tag。push stage / main 不再部署。
# plan job 硬断言触发 ref 就是 refs/tags/<rc tag>，其它 ref（分支、正式 tag、格式不对的 tag）一律拒绝。
# 开关：仓库级 vars.DEPLOY_PREVIEW_ENABLED 必须显式等于 enabled，未设置 = 不部署。
# 运行位置：runs-on 读仓库变量 DEPLOY_RUNNER，没设时用 ubuntu-latest；与 CI 的 CI_RUNNER 分开。
# 部署 job 会拿到部署私钥：DEPLOY_RUNNER 设为 yzgc-deploy（每个 job 一个全新容器，跑完即删），
# 不要指向 CI 用的常驻自托管 runner yzgc-arch（docs/ops/CICD.md「自托管 runner」）。
#
# 边界：
#   * 本工作流不创建、不移动、不删除 tag；tag 由所有者授权后手工打（见 docs/conventions/RELEASES.md）。
#   * 构建（build job）不接触任何环境级密钥。静态资源 CDN（#146）的上传 token 只在 cdn-plan、cdn-upload
#     两个 job 里出现（GitHub Environment `static-cdn`），这两个 job 不安装依赖；没有 token 时同源构建、不上传。
#   * 部署用环境级 secrets（GitHub Environment `preview`），与 PR 构建、正式环境完全隔离。
#   * 镜像 tag 只用提交 SHA 前 12 位，禁止 latest；展示版本是 X.Y.Z-rc.N@<sha12>。
#   * 部署记录走 GitHub Deployments API（payload 带 rc tag），正式环境用它做「先预发布后正式」的证据。

name: Deploy Preview

on:
  push:
    # GitHub 的过滤模式匹配整个 tag 名：只有 vX.Y.Z-rc.N 形状会触发，正式 tag vX.Y.Z 不会。
    # 前导 0 等细节由 plan job 的正则再判一次。
    tags: ['v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: '预发布 tag（vX.Y.Z-rc.N），必须与「Use workflow from」选中的 tag 相同'
        required: true
        type: string

# 默认最小权限：只读仓库内容。写 deployments 的权限只在 deploy job 上单独声明。
permissions:
  contents: read

concurrency:
  group: deploy-preview
  # 同一时刻只跑一个预发布部署。不取消正在跑的运行：半途被取消的部署可能停在 load 镜像与
  # compose up 之间；新的 rc tag 排队等待（GitHub 只保留最新一个排队中的运行）。
  cancel-in-progress: false

jobs:
  # 规划：硬断言触发来源是 rc tag → 解析发布身份（镜像 tag、栈目录、入口、产物名）。
  plan:
    name: plan (rc tag → preview 身份)
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      image_tag: ${{ steps.identity.outputs.image_tag }}
      image_repository: ${{ steps.identity.outputs.image_repository }}
      release_version: ${{ steps.identity.outputs.release_version }}
      origin: ${{ steps.identity.outputs.origin }}
      stack_root: ${{ steps.identity.outputs.stack_root }}
      incoming_dir: ${{ steps.identity.outputs.incoming_dir }}
      runtime_env_file: ${{ steps.identity.outputs.runtime_env_file }}
      images_archive: ${{ steps.identity.outputs.images_archive }}
      compose_project: ${{ steps.identity.outputs.compose_project }}
    steps:
      - name: 硬断言触发来源是预发布 tag
        id: source
        shell: bash
        # 只有 vX.Y.Z-rc.N 能进预发布：分支、正式 tag、格式不对的 tag 一概拒绝，没有回落路径。
        # 手工触发时输入的 tag 必须就是运行所在的 ref，工作流定义与被部署的代码来自同一个 tag。
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          case "${GITHUB_EVENT_NAME}" in
            push) tag="${GITHUB_REF_NAME}" ;;
            workflow_dispatch) tag="${INPUT_TAG}" ;;
            *) echo "不支持的触发事件：${GITHUB_EVENT_NAME}" >&2; exit 1 ;;
          esac
          rc_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$'
          if ! [[ "$tag" =~ $rc_re ]]; then
            echo "预发布只接受 vX.Y.Z-rc.N（N 从 1 开始，不带前导 0）：收到 '${tag}'" >&2
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/tags/${tag}" ]; then
            echo "本工作流只接受 refs/tags/${tag}（当前：${GITHUB_REF}，事件：${GITHUB_EVENT_NAME}）。手工触发时「Use workflow from」必须选同一个 tag。" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "触发来源确认：${GITHUB_REF}（事件 ${GITHUB_EVENT_NAME}）"

      - name: 检出发布 tag（取全部分支与 tag，不保留凭据）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.source.outputs.tag }}
          # 判定「提交在 stage 上」需要 origin/stage，核对 tag 需要全部 tag，浅克隆拿不到。
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 规划发布身份（tag 模型）
        id: identity
        shell: bash
        # release-policy 校验：tag 指向检出的提交、X.Y.Z 等于该提交 package.json 的 version、
        # 提交在 origin/stage 的历史里、该版本还没有正式 tag。任一不成立即失败关闭。
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -eu
          commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$(git rev-parse HEAD)" != "$commit" ]; then
            echo "检出的 HEAD 不是 ${RELEASE_TAG} 指向的提交 ${commit}：拒绝规划。" >&2
            exit 1
          fi
          node scripts/release-policy.mjs plan --tag "$RELEASE_TAG" --commit "$commit" \
            --branch-ref refs/remotes/origin/stage --require-tag > "$RUNNER_TEMP/plan.json"
          {
            echo "commit=$(jq -r '.commit' "$RUNNER_TEMP/plan.json")"
            echo "image_tag=$(jq -r '.imageTag' "$RUNNER_TEMP/plan.json")"
            echo "image_repository=$(jq -r '.imageRepository' "$RUNNER_TEMP/plan.json")"
            echo "release_version=$(jq -r '.releaseVersion' "$RUNNER_TEMP/plan.json")"
            echo "origin=$(jq -r '.origin' "$RUNNER_TEMP/plan.json")"
            echo "stack_root=$(jq -r '.stackRoot' "$RUNNER_TEMP/plan.json")"
            echo "incoming_dir=$(jq -r '.incomingDir' "$RUNNER_TEMP/plan.json")"
            echo "runtime_env_file=$(jq -r '.runtimeEnvFile' "$RUNNER_TEMP/plan.json")"
            echo "images_archive=$(jq -r '.imagesArchive' "$RUNNER_TEMP/plan.json")"
            echo "compose_project=$(jq -r '.composeProject' "$RUNNER_TEMP/plan.json")"
          } >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/plan.json"

      - name: 校验环境契约（部署事实来源不许漂移）
        shell: bash
        run: node scripts/deployment-environment.mjs --check

  # 静态资源 CDN 开关（#146）：有上传 token、且 preview 线上的 CSP 已放行 CDN 时，build 用 CDN 地址构建；
  # 否则同源构建（与原来一样）。上传 token 只在这个 job 与 cdn-upload 里出现：两个 job 都不安装依赖，
  # 只跑仓库里零依赖的 scripts/static-cdn.mjs（docs/ops/CICD.md「静态资源 CDN」）。
  cdn-plan:
    name: cdn-plan (静态资源 CDN 开关)
    needs: plan
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    # token 存在 GitHub Environment `static-cdn`（部署 tag 规则只放行 v*）；deployment: false 不产生部署记录。
    environment:
      name: static-cdn
      deployment: false
    permissions:
      contents: read
    outputs:
      base: ${{ steps.decide.outputs.base }}
    steps:
      - name: 检出 plan 核对过的提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 决定这次是否用 CDN（没有 token 或 CSP 未放行 = 同源）
        id: decide
        shell: bash
        # stdout 只有一行 base=<地址或空>。token 的策略不对（前缀、只增不改、到期）直接失败，不带着错的凭据继续；
        # 脚本不打印 token，只打印策略字段与到期时间。
        env:
          STATIC_CDN_UPLOAD_TOKEN: ${{ secrets.STATIC_CDN_UPLOAD_TOKEN }}
          ORIGIN: ${{ needs.plan.outputs.origin }}
        run: |
          set -eu
          node scripts/static-cdn.mjs decide --origin "$ORIGIN" >> "$GITHUB_OUTPUT"

  # 构建：三条镜像 → 单个归档 + 校验和（不推送 registry，目标机 docker load）。
  build:
    name: build (镜像归档)
    needs: [plan, cdn-plan]
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      # 下载源（#104）：仓库变量没设时回到官方源，与 ci.yml 的写法相同（docs/ops/CICD.md「构建下载源」）。
      # 大写三项以 build arg 传给 Dockerfile 的构建阶段，不进运行镜像。
      NPM_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
      DEBIAN_MIRROR: ${{ vars.DEBIAN_MIRROR || '' }}
      BETTER_SQLITE3_BINARY_HOST: ${{ vars.BETTER_SQLITE3_BINARY_HOST || '' }}
      # runner 上的 pnpm/action-setup（npm ci）与 pnpm 9 install 读这两项；不设 pnpm_config_registry 的原因见 ci.yml core job。
      npm_config_registry: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
      npm_config_better_sqlite3_binary_host: ${{ vars.BETTER_SQLITE3_BINARY_HOST || '' }}
    steps:
      - name: 检出 plan 核对过的提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 用 plan 输出的完整 SHA，而不是再按 tag 名解析一次：tag 在两次检出之间被改动也构建不到别的代码。
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      # prebuild-install 不核对 better-sqlite3 预编译包的哈希，传输途中不被换包只能靠 https（#104）。
      # 在任何下载之前按与 app/server/Dockerfile 构建阶段相同的 case 核对地址：空 = GitHub releases；
      # tests/tooling/build-mirrors.test.ts 核对三处 job 与 Dockerfile 一致，并实跑这一步。
      - name: 核对 better-sqlite3 预编译包地址
        shell: bash
        run: |
          BETTER_SQLITE3_BINARY_HOST=$npm_config_better_sqlite3_binary_host
          if [ -n "$BETTER_SQLITE3_BINARY_HOST" ]; then
            case "$BETTER_SQLITE3_BINARY_HOST" in https://*[!/]) ;; *) echo "BETTER_SQLITE3_BINARY_HOST 必须是不带结尾 / 的 https:// 地址：${BETTER_SQLITE3_BINARY_HOST}" >&2; exit 1 ;; esac
            case "$BETTER_SQLITE3_BINARY_HOST" in *[!0-9A-Za-z.:/_-]*) echo "BETTER_SQLITE3_BINARY_HOST 含有不允许的字符：${BETTER_SQLITE3_BINARY_HOST}" >&2; exit 1 ;; esac
          fi
          echo "better-sqlite3 预编译包：${BETTER_SQLITE3_BINARY_HOST:-GitHub releases}"

      - name: 安装 pnpm（读取根 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 依赖安装（锁文件不可变）
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: 构建（提交态 = production 值；镜像内部的构建会按 preview 渲染）
        shell: bash
        # 这一步只证明「同一份提交在 runner 上能构建」，产物不进镜像：
        # 三个 Dockerfile 各自在容器里重新安装与构建，并用 build args 渲染 preview 身份与域名。
        env:
          GEEK_DEPLOYMENT_ENVIRONMENT: preview
          GEEK_RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
          GEEK_RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: pnpm build

      - name: 构建三个镜像（preview 专用仓库，tag = SHA 前 12 位）
        shell: bash
        # 镜像仓库按环境分开（yzgc-preview/<服务>）：两套栈共用目标机的 Docker 守护进程，
        # 同一提交的预发布与正式镜像构建参数不同，共用镜像名会在 docker load 时互相覆盖。
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          IMAGE_REPOSITORY: ${{ needs.plan.outputs.image_repository }}
          GEEK_RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
          GEEK_RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          STATIC_CDN_BASE: ${{ needs.cdn-plan.outputs.base }}
        run: |
          set -eu
          for service in server web forum; do
            # 只有 server 的构建阶段用 apt 与 better-sqlite3 的预编译包；web、forum 只换 npm 源。
            case "$service" in
              server) mirror_args=(--build-arg NPM_REGISTRY="$NPM_REGISTRY" --build-arg DEBIAN_MIRROR="$DEBIAN_MIRROR" --build-arg BETTER_SQLITE3_BINARY_HOST="$BETTER_SQLITE3_BINARY_HOST") ;;
              *) mirror_args=(--build-arg NPM_REGISTRY="$NPM_REGISTRY") ;;
            esac
            # 静态资源 CDN 开关（#146）只影响 web、forum 的前端产物；空 = 同源。server 的 Dockerfile 没有这个参数。
            case "$service" in
              server) cdn_args=() ;;
              *) cdn_args=(--build-arg STATIC_CDN_BASE="$STATIC_CDN_BASE") ;;
            esac
            docker build \
              --file "app/${service}/Dockerfile" \
              --build-arg GEEK_DEPLOYMENT_ENVIRONMENT=preview \
              --build-arg GEEK_RELEASE_VERSION="$GEEK_RELEASE_VERSION" \
              --build-arg GEEK_RELEASE_COMMIT="$GEEK_RELEASE_COMMIT" \
              "${mirror_args[@]}" \
              "${cdn_args[@]}" \
              --tag "${IMAGE_REPOSITORY}/${service}:${IMAGE_TAG}" .
          done
          docker image list --format '{{.Repository}}:{{.Tag}}' | grep "^${IMAGE_REPOSITORY}/"

      - name: 取出要上传 CDN 的带哈希文件（开关打开时）
        if: needs.cdn-plan.outputs.base != ''
        shell: bash
        # 从刚构建的 web、forum 镜像里原样拷出三个产物目录，再按 scripts/static-cdn.mjs 的规则挑文件（不联网）：
        # 有不带内容哈希的文件就在这里失败。上传在 cdn-upload job 里做，本 job 不接触上传 token。
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          IMAGE_REPOSITORY: ${{ needs.plan.outputs.image_repository }}
        run: |
          set -eu
          out="${RUNNER_TEMP}/static-cdn"
          mkdir -p "${out}/web" "${out}/forum"
          web="$(docker create "${IMAGE_REPOSITORY}/web:${IMAGE_TAG}")"
          forum="$(docker create "${IMAGE_REPOSITORY}/forum:${IMAGE_TAG}")"
          docker cp "${web}:/usr/share/nginx/html/assets" "${out}/web/assets"
          docker cp "${web}:/usr/share/nginx/html/console-assets" "${out}/web/console-assets"
          docker cp "${forum}:/usr/share/nginx/html/_nuxt" "${out}/forum/_nuxt"
          docker rm "$web" "$forum" > /dev/null
          node scripts/static-cdn.mjs plan --web "${out}/web" --forum "${out}/forum"

      - name: 上传带哈希的静态文件（交给 cdn-upload，保留 7 天）
        if: needs.cdn-plan.outputs.base != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yzgc-static-preview-${{ needs.plan.outputs.image_tag }}
          path: ${{ runner.temp }}/static-cdn/
          if-no-files-found: error
          retention-days: 7

      - name: 打包镜像归档与校验和
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          IMAGE_REPOSITORY: ${{ needs.plan.outputs.image_repository }}
          IMAGES_ARCHIVE: ${{ needs.plan.outputs.images_archive }}
        run: |
          set -eu
          out="${RUNNER_TEMP}/bundle"
          mkdir -p "$out"
          # docker save 直接进 gzip：中间不落地未压缩 tar，runner 上不留第二份镜像数据。
          docker save "${IMAGE_REPOSITORY}/server:${IMAGE_TAG}" "${IMAGE_REPOSITORY}/web:${IMAGE_TAG}" "${IMAGE_REPOSITORY}/forum:${IMAGE_TAG}" \
            | gzip -9 > "${out}/${IMAGES_ARCHIVE}"
          ( cd "$out" && sha256sum "${IMAGES_ARCHIVE}" > "${IMAGES_ARCHIVE}.sha256" )
          ls -lh "$out"
          cat "${out}/${IMAGES_ARCHIVE}.sha256"

      - name: 上传镜像归档（保留 7 天，不推 registry）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yzgc-images-preview-${{ needs.plan.outputs.image_tag }}
          path: |
            ${{ runner.temp }}/bundle/${{ needs.plan.outputs.images_archive }}
            ${{ runner.temp }}/bundle/${{ needs.plan.outputs.images_archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  # 上传并核对（#146）：开关关闭时只打印一行，job 照常成功，deploy 不受影响；开关打开时任何一个文件
  # 上传或经 CDN 核对失败，deploy 都不会开始——HTML 不会先于它引用的文件上线。只增不改，不删除任何对象。
  cdn-upload:
    name: cdn-upload (上传并核对 CDN 静态文件)
    needs: [plan, cdn-plan, build]
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment:
      name: static-cdn
      deployment: false
    permissions:
      contents: read
      # 读本次运行的静态文件 artifact（scripts/fetch-artifact.mjs 经 REST API 下载）。
      actions: read
    env:
      STATIC_CDN_BASE: ${{ needs.cdn-plan.outputs.base }}
    steps:
      - name: 开关状态
        shell: bash
        run: |
          set -eu
          if [ -z "$STATIC_CDN_BASE" ]; then
            echo "静态资源 CDN 开关关闭：这次同源构建，不上传。"
          else
            echo "静态资源 CDN 开关打开：${STATIC_CDN_BASE}"
          fi

      - name: 检出 plan 核对过的提交
        if: needs.cdn-plan.outputs.base != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: 安装 Node（读取 .nvmrc）
        if: needs.cdn-plan.outputs.base != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 下载带哈希的静态文件
        if: needs.cdn-plan.outputs.base != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: yzgc-static-preview-${{ needs.plan.outputs.image_tag }}
        run: |
          set -eu
          node scripts/fetch-artifact.mjs --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" \
            --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/static-cdn"

      - name: 上传（只增不改）并经 CDN 带 Referer 逐个核对
        if: needs.cdn-plan.outputs.base != ''
        shell: bash
        # 核对每个文件：HTTP 200、ETag 等于本地七牛 qetag、长度、Content-Type、JS/CSS/字体的 CORS 头。
        env:
          STATIC_CDN_UPLOAD_TOKEN: ${{ secrets.STATIC_CDN_UPLOAD_TOKEN }}
          ORIGIN: ${{ needs.plan.outputs.origin }}
        run: |
          set -eu
          node scripts/static-cdn.mjs upload --web "$RUNNER_TEMP/static-cdn/web" --forum "$RUNNER_TEMP/static-cdn/forum" \
            --referer "${ORIGIN}/"

  # 部署：只有显式打开仓库级开关才跑。部署用的环境级 secrets 只在本 job 出现。
  deploy:
    name: deploy (preview stack)
    needs: [plan, build, cdn-upload]
    # 未设置或不是 enabled 一律不部署；哨兵值在第一个 step 里再硬校验一次。
    if: vars.DEPLOY_PREVIEW_ENABLED == 'enabled'
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    environment:
      name: preview
      url: ${{ needs.plan.outputs.origin }}
    permissions:
      contents: read
      # 读本次运行的镜像归档（scripts/fetch-artifact.mjs 经 REST API 下载）。
      actions: read
      # 写部署记录（GitHub Deployments API）：正式环境据此判断同一 commit 是否已在预发布验证过。
      deployments: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
      IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
      IMAGE_REPOSITORY: ${{ needs.plan.outputs.image_repository }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      STACK_ROOT: ${{ needs.plan.outputs.stack_root }}
      INCOMING_DIR: ${{ needs.plan.outputs.incoming_dir }}
      RUNTIME_ENV_FILE: ${{ needs.plan.outputs.runtime_env_file }}
      IMAGES_ARCHIVE: ${{ needs.plan.outputs.images_archive }}
      ORIGIN: ${{ needs.plan.outputs.origin }}
      COMPOSE_PROJECT: ${{ needs.plan.outputs.compose_project }}
    steps:
      - name: 校验环境哨兵（防止仓库级变量静默回落）
        shell: bash
        # 环境级 vars 必须显式等于本环境名：仓库级同名变量或空值都不能让部署悄悄跑起来。
        env:
          DEPLOY_TARGET_ENVIRONMENT: ${{ vars.DEPLOY_TARGET_ENVIRONMENT }}
        run: |
          set -eu
          if [ "${DEPLOY_TARGET_ENVIRONMENT}" != "preview" ]; then
            echo "环境哨兵不匹配：GitHub Environment 'preview' 的 DEPLOY_TARGET_ENVIRONMENT 必须是 preview，实际 '${DEPLOY_TARGET_ENVIRONMENT}'" >&2
            exit 1
          fi
          echo "环境哨兵确认：preview"

      - name: 检出 plan 核对过的提交（取部署物料：compose 与远端脚本）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      - name: 安装 Node（读取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 下载镜像归档（并发分段）
        shell: bash
        # 不用 actions/download-artifact：它单连接下载，自托管 runner 在家里从 GitHub 的存储下载只有几十 KB/s，
        # 163MB 要一小时；并发 16 段约 6.6MB/s（#99）。归档内容仍由目标机的 sha256sum -c 核对。
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: yzgc-images-preview-${{ needs.plan.outputs.image_tag }}
        run: |
          set -eu
          node scripts/fetch-artifact.mjs --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" \
            --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/bundle"

      - name: 渲染运行时 env 文件（模板 + 环境级 secrets + IMAGE_TAG）
        shell: bash
        # 模板取 deploy/env/.env.preview，密钥字段用本 GitHub Environment 的 secrets 覆盖；
        # 脚本只回显字段名与 tag，永不回显密钥值；缺任一密钥即失败关闭。
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -eu
          node scripts/deployment-environment.mjs render \
            --environment preview \
            --out "$RUNNER_TEMP/bundle/.env.preview" \
            --image-tag "$IMAGE_TAG"

      - name: 准备 SSH（私钥与 known_hosts 只落在 runner 的临时目录）
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/id_deploy"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_deploy"
          chmod 644 "$RUNNER_TEMP/ssh/known_hosts"
          # 私钥与 known_hosts 都来自环境级 secrets；不打印内容，只确认长度。
          echo "SSH 物料就绪：私钥 $(wc -l < "$RUNNER_TEMP/ssh/id_deploy") 行，known_hosts $(wc -l < "$RUNNER_TEMP/ssh/known_hosts") 行"

      - name: 创建部署记录（in_progress）
        id: record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # required_contexts 只认 CI 的「verify (required check)」：默认会要求这个提交上的全部检查都已通过，
          # 而本 job 自己此刻还在运行，GitHub 永远返回 409（v0.1.0-rc.1 首次部署时实测）。
          # auto_merge 默认 true：重新部署落后于默认分支的旧 tag 时 GitHub 会去合并默认分支；这里只部署 plan 核对过的提交。
          # 状态 POST 一律 -F auto_inactive=false（布尔要用 -F）：默认会把同一环境里更早的成功记录置为 inactive，
          # 正式环境的证据 job 读的正是预发布的这些记录。
          deployment_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" \
            -f ref="$COMMIT" -f environment=preview -F auto_merge=false \
            -f "required_contexts[]=verify (required check)" \
            -f description="${RELEASE_TAG} → preview（${RELEASE_VERSION}，镜像 tag ${IMAGE_TAG}）" \
            -f "payload[tag]=${RELEASE_TAG}" -f "payload[release_version]=${RELEASE_VERSION}" \
            -f "payload[image_tag]=${IMAGE_TAG}" -f "payload[image_repository]=${IMAGE_REPOSITORY}" \
            --jq '.id')"
          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" -F auto_inactive=false \
            -f state=in_progress -f description="分发镜像与 env 文件到 ${STACK_ROOT}" > /dev/null
          echo "部署记录已创建：deployment ${deployment_id}（${COMMIT}）"

      - name: 分发镜像、env 文件与 compose 物料
        shell: bash
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -eu
          key="$RUNNER_TEMP/ssh/id_deploy"
          known="$RUNNER_TEMP/ssh/known_hosts"
          target="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh_options=(-i "$key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$known" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20)
          scp_options=(-i "$key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$known" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20)
          # 目标机只接收物料：incoming/ 放本次归档与渲染好的 env 文件，deploy/compose/ 放两套栈定义（长期存在）。
          ssh "${ssh_options[@]}" -p "$DEPLOY_SSH_PORT" "$target" \
            "mkdir -p '$INCOMING_DIR' '$STACK_ROOT/deploy/compose' && chmod 700 '$INCOMING_DIR'"
          scp "${scp_options[@]}" -P "$DEPLOY_SSH_PORT" \
            "$RUNNER_TEMP/bundle/${IMAGES_ARCHIVE}" "$RUNNER_TEMP/bundle/${IMAGES_ARCHIVE}.sha256" \
            "$RUNNER_TEMP/bundle/.env.preview" deploy/remote/deploy-stack.sh \
            "${target}:${INCOMING_DIR}/"
          scp "${scp_options[@]}" -P "$DEPLOY_SSH_PORT" \
            deploy/compose/production.yml deploy/compose/preview.yml \
            "${target}:${STACK_ROOT}/deploy/compose/"
          ssh "${ssh_options[@]}" -p "$DEPLOY_SSH_PORT" "$target" \
            "cd '${INCOMING_DIR}' && chmod 600 '.env.preview' && ls -la && sha256sum -c '${IMAGES_ARCHIVE}.sha256'"

      - name: 执行远端部署（load 镜像 → compose up → 健康检查）
        id: deploy-stack
        shell: bash
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -eu
          target="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          # deploy-stack.sh 只从 env 文件取事实（IMAGE_TAG/STACK_ROOT/COMPOSE_PROJECT_NAME），
          # 传进来的 --image-tag/--stack-root 只做交叉校验；compose up 或健康检查失败会自动回滚到上一个 tag 并非零退出，
          # 成功后删掉 incoming 里本环境的归档与 .env.preview。
          # --images 只指这次的归档：失败的部署会在 incoming 里留下归档，不指定时 deploy-stack.sh 会把整个目录都当成本次输入，
          # 看到别的版本的镜像就拒绝部署（v0.1.0-rc.2 的归档留在预发布机上，审查时复现过）。
          ssh -i "$RUNNER_TEMP/ssh/id_deploy" -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -p "$DEPLOY_SSH_PORT" "$target" \
            "bash '${INCOMING_DIR}/deploy-stack.sh' --environment preview --stack-root '${STACK_ROOT}' \
              --image-tag '${IMAGE_TAG}' --incoming-dir '${INCOMING_DIR}' --images '${INCOMING_DIR}/${IMAGES_ARCHIVE}' \
              --env-file '${INCOMING_DIR}/.env.preview'"

      - name: 记录部署结果
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.deploy-stack.outcome }}
          DEPLOYMENT_ID: ${{ steps.record.outputs.deployment_id }}
        run: |
          set -eu
          if [ -z "${DEPLOYMENT_ID:-}" ]; then
            echo "::warning::部署记录未创建（前置步骤失败），跳过状态更新。"
            exit 0
          fi
          if [ "$OUTCOME" = "success" ]; then
            state=success
            description="${RELEASE_TAG} 预发布部署成功（镜像 tag ${IMAGE_TAG}）"
          else
            state=failure
            description="${RELEASE_TAG} 预发布部署失败或未执行（$OUTCOME）"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" -F auto_inactive=false \
            -f state="$state" -f environment_url="$ORIGIN" -f description="$description" > /dev/null
          echo "部署记录已更新：${state}"

      - name: 输出入口与身份
        if: always()
        shell: bash
        run: |
          set -eu
          {
            echo "## 预发布部署"
            echo ""
            echo "- 环境：preview（GitHub Environment: preview）"
            echo "- 发布 tag：\`${RELEASE_TAG}\`"
            echo "- 展示版本：\`${RELEASE_VERSION}\`"
            echo "- commit：\`${COMMIT}\`"
            echo "- 镜像：\`${IMAGE_REPOSITORY}/{server,web,forum}:${IMAGE_TAG}\`"
            echo "- compose 项目：\`${COMPOSE_PROJECT}\`"
            echo "- 栈根目录：\`${STACK_ROOT}\`"
            echo "- 入口：${ORIGIN}"
            echo ""
            echo "机器部署成功不等于人工试用通过。所有者在预发布试用并明确批准后，才把 main 快进到这个提交并打正式 tag。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "预发布入口：${ORIGIN}"
